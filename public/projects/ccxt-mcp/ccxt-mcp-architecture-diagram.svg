<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- 제목 -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CCXT MCP 아키텍처</text>
  
  <!-- 사용자 및 AI 모델 영역 -->
  <rect x="50" y="80" width="700" height="80" rx="10" ry="10" fill="#f9d5e5" stroke="#333" stroke-width="2"/>
  <text x="400" y="110" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">사용자 및 AI 모델</text>
  <rect x="80" y="130" width="150" height="20" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="155" y="145" font-family="Arial" font-size="14" text-anchor="middle">사용자</text>
  <rect x="330" y="130" width="150" height="20" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="405" y="145" font-family="Arial" font-size="14" text-anchor="middle">Claude</text>
  <rect x="570" y="130" width="150" height="20" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="645" y="145" font-family="Arial" font-size="14" text-anchor="middle">GPT</text>
  
  <!-- MCP 프로토콜 영역 -->
  <rect x="150" y="190" width="500" height="60" rx="10" ry="10" fill="#e5d5f9" stroke="#333" stroke-width="2"/>
  <text x="400" y="225" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">MCP 프로토콜</text>
  
  <!-- CCXT MCP 서버 영역 -->
  <rect x="50" y="280" width="700" height="160" rx="10" ry="10" fill="#d5e5f9" stroke="#333" stroke-width="2"/>
  <text x="400" y="305" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">CCXT MCP 서버</text>
  
  <!-- 서버 내부 컴포넌트 -->
  <rect x="80" y="320" width="150" height="60" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="155" y="345" font-family="Arial" font-size="14" text-anchor="middle">CcxtMcpServer</text>
  <text x="155" y="365" font-family="Arial" font-size="12" text-anchor="middle">server.ts</text>
  
  <rect x="250" y="320" width="150" height="60" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="325" y="345" font-family="Arial" font-size="14" text-anchor="middle">리소스</text>
  <text x="325" y="365" font-family="Arial" font-size="12" text-anchor="middle">resources/</text>
  
  <rect x="420" y="320" width="150" height="60" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="495" y="345" font-family="Arial" font-size="14" text-anchor="middle">도구</text>
  <text x="495" y="365" font-family="Arial" font-size="12" text-anchor="middle">tools/</text>
  
  <rect x="590" y="320" width="150" height="60" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="665" y="345" font-family="Arial" font-size="14" text-anchor="middle">설정</text>
  <text x="665" y="365" font-family="Arial" font-size="12" text-anchor="middle">계정 정보</text>
  
  <rect x="80" y="390" width="660" height="40" rx="5" ry="5" fill="#fff" stroke="#333"/>
  <text x="400" y="415" font-family="Arial" font-size="14" text-anchor="middle">CCXT 라이브러리 통합</text>
  
  <!-- CCXT 라이브러리 영역 -->
  <rect x="50" y="470" width="700" height="60" rx="10" ry="10" fill="#d5f9e5" stroke="#333" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">CCXT 라이브러리</text>
  
  <!-- 암호화폐 거래소 영역 -->
  <rect x="50" y="560" width="700" height="30" rx="10" ry="10" fill="#f9e5d5" stroke="#333" stroke-width="2"/>
  <text x="400" y="580" font-family="Arial" font-size="14" text-anchor="middle">암호화폐 거래소 API (바이낸스, 바이비트, 코인베이스 등)</text>
  
  <!-- 연결선 -->
  <!-- 사용자/AI와 MCP 프로토콜 -->
  <line x1="155" y1="150" x2="155" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="405" y1="150" x2="405" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="645" y1="150" x2="645" y2="190" stroke="#333" stroke-width="2"/>
  
  <!-- MCP 프로토콜과 서버 -->
  <line x1="400" y1="250" x2="400" y2="280" stroke="#333" stroke-width="2"/>
  
  <!-- 서버 내부 연결 -->
  <line x1="230" y1="350" x2="250" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="350" x2="420" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="350" x2="590" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="380" x2="155" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="325" y1="380" x2="325" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="495" y1="380" x2="495" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="665" y1="380" x2="665" y2="390" stroke="#333" stroke-width="2"/>
  
  <!-- 서버와 CCXT 라이브러리 -->
  <line x1="400" y1="430" x2="400" y2="470" stroke="#333" stroke-width="2"/>
  
  <!-- CCXT 라이브러리와 거래소 -->
  <line x1="400" y1="530" x2="400" y2="560" stroke="#333" stroke-width="2"/>
  
  <!-- 화살표 -->
  <polygon points="400,185 395,175 405,175" fill="#333"/>
  <polygon points="400,275 395,265 405,265" fill="#333"/>
  <polygon points="400,465 395,455 405,455" fill="#333"/>
  <polygon points="400,555 395,545 405,545" fill="#333"/>
</svg>
