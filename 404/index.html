c/chunks/94730671-1e2691690418b851.js\",\"711\",\"static/chunks/8e1d74a4-e827b714699a717f.js\",\"173\",\"static/chunks/173-392b385b0cae3bc1.js\",\"762\",\"static/chunks/762-2429aa46e96cf35d.js\",\"565\",\"static/chunks/565-5d63cb2cfc9b6b83.js\",\"200\",\"static/chunks/200-e5b4f393133f2b22.js\",\"285\",\"static/chunks/285-5f450dbbf95cfc99.js\",\"359\",\"static/chunks/359-4401a530635be94c.js\",\"177\",\"static/chunks/app/layout-b6c3f1c862db2fc0.js\"],\"default\"]\n18:I[33475,[\"204\",\"static/chunks/94730671-1e2691690418b851.js\",\"711\",\"static/chunks/8e1d74a4-e827b714699a717f.js\",\"173\",\"static/chunks/173-392b385b0cae3bc1.js\",\"762\",\"static/chunks/762-2429aa46e96cf35d.js\",\"565\",\"static/chunks/565-5d63cb2cfc9b6b83.js\",\"200\",\"static/chunks/200-e5b4f393133f2b22.js\",\"285\",\"static/chunks/285-5f450dbbf95cfc99.js\",\"359\",\"static/chunks/359-4401a530635be94c.js\",\"177\",\"static/chunks/app/layout-b6c3f1c862db2fc0.js\"],\"default\"]\n19:I[52845,[\"204\",\"static/chunks/94730671-1e2691690418b851.js\",\"711\",\"static/chunks/8e1d74a4-e827b714699a717f.js\",\"173\",\"static/chunks/173-392b385b0cae3bc1.js\",\"762\",\"static/chunks/762-2429aa46e96cf35d.js\",\"565\",\"stati"])</script><script>self.__next_f.push([1,"c/chunks/565-5d63cb2cfc9b6b83.js\",\"200\",\"static/chunks/200-e5b4f393133f2b22.js\",\"285\",\"static/chunks/285-5f450dbbf95cfc99.js\",\"359\",\"static/chunks/359-4401a530635be94c.js\",\"177\",\"static/chunks/app/layout-b6c3f1c862db2fc0.js\"],\"default\"]\nf:T2b9f,"])</script><script>self.__next_f.push([1,"\n# 크롬 확장프로그램에 케시메모리 추가하기\n\n크롬 확장 프로그램을 통해 [[LazyTrading|트레이딩 도구]]를 개발하는 도중, 한 가지 큰 문제가 있었다.\n\n## 문제 상황\n\n크롬 확장 프로그램은 일반 앱처럼 보이지만, 사용자가 팝업 창이나 사이드바를 닫으면 확장 프로그램의 세션이 완전히 종료된다. 이로 인해 사용자가 입력했던 데이터나 현재 보고 있던 화면 위치가 저장되지 않고, 재접속 시 항상 처음 화면으로 돌아가게 된다.\n멀티태스킹 환경에서 트레이더들은 확장 프로그램을 수시로 열고 닫아야 하는데, 매번 처음부터 시작해야 하는 것은 큰 불편함이었다.\n\n## 해결 방안\n\n문제를 해결의 목표를 단순하게 정리하면 다음과 같다\n\n\u003e [!goal]\n\u003e 크롬 확장프로그램을 사용하는 와중 확장프로그램의 창을 닫고 키면 이전 창의 정보를 복원시킨다.\n\n해당 목적을 달성하기 위해선 단순하게 사용자가 사용하고 있는 정보를 저장할 저장소만 있으면 되겠다고 판단하였다.\n\n| 저장소                   | 최대 용량                      | 데이터 구조                      | 비동기 지원 | 지속성                                            | 다른 탭/창 공유                         |\n| ------------------------ | ------------------------------ | -------------------------------- | ----------- | ------------------------------------------------- | --------------------------------------- |\n| `localStorage`           | 5MB                            | 문자열(JSON)                     | ❌(동기)    | 브라우저 종료 후에도 유지                         | ✅(같은 출처에서 공유)                  |\n| `sessionStorage`         | 5MB                            | 문자열(JSON)                     | ❌(동기)    | 탭(세션)이 닫히면 삭제                            | ❌(탭마다 독립적)                       |\n| `chrome.storage.local`   | 10MB (확장 프로그램)           | JSON 객체 저장 가능              | ✅(비동기)  | 브라우저 종료 후에도 유지                         | ✅(확장 프로그램 내에서 공유 가능)      |\n| `chrome.storage.session` | 10MB (확장 프로그램)           | JSON 객체 저장 가능              | ✅(비동기)  | 확장 프로그램이 종료되면 삭제                     | ✅(확장 프로그램 내에서 공유 가능)      |\n| `IndexedDB`              | GB 단위                        | 객체 저장 가능 (JSON, 배열 포함) | ✅(비동기)  | 브라우저 종료 후에도 유지                         | ✅(같은 출처에서 가능)                  |\n| `background.js`          | 제한 없음 (메모리 사용량 만큼) | 모든 JS 객체 저장 가능           | ✅(비동기)  | 브라우저 종료되면 삭제 (persistent: false일 경우) | ✅(확장 프로그램 내 모든 페이지와 공유) |\n\n서로 다른 장단점이 있지만 내가 원하는 기능을 하기위해서는 `background.js`가 가장 적합하였다.\n그 이유는 다음과 같다.\n\n1. pin 정보같은 민감한 정보도 일시적으로 저장될 수 있기 때문에 localStorage와 sessionStorage그리고 IndexedDB를 이용하지 않아야 한다.\n2. 확장프로그램이 닫혀도 정보가 유지되어야 하기 때문에 chrome.storage.session과 sessionStorage를 이용할 수 없다.\n\n`background.js`를 이용하는 방법이 내가 내가 원하는 사용자 경험과 가장 잘 맞았다.\n\n### 문제 해결 로직\n\n문제를 해결하기 위해서는 2가지 기능이 필요하다.\n\n1. 앱을 사용하는 동안 사용자의 현제 라우트 위치와 해당 위치에 필요한 데이터 저장하기.\n2. 앱을 켤때 `background.js` 에 저장된 앱의 상태가 있는지 확인하고 있다면 복원하기.\n\n현제 프로젝트에서는 `react-query`를 사용중이기 때문에 `react-query`와 `context` 그리고 `hook`을 사용하여 앱의 상태를 저장하고 앱을 실행시킬때 불러오는 작업을 담당하도록 하였다.\n\n#### background.js 와 통신하기\n\n`background.js`는 브라우저 영역에서 작동하는 스크립트 이다.\n\n`background.js` 와 크롬 확장프로그램은 서로 `chrome.runtime.onMessage` 와 `chrome.runtime.sendMessage` 함수로 통신이 가능하다.\n\n간단하게 `background.js`를 작성해보자\n\n```js\nconst initialState = {\n  currentRoute: null,\n  data: {},\n};\n\nlet appState = { ...initialState };\n\nchrome.runtime.onMessage.addListener((message, sender, sendResponse) =\u003e {\n  switch (message.type) {\n    case \"GET_APP_STATE\":\n      sendResponse({\n        data: {\n          currentRoute: appState.currentRoute,\n          data: appState.data || {},\n        },\n      });\n      break;\n\n    case \"UPDATE_APP_STATE\":\n      // state가 undefined인 경우 처리\n      const newState = message.state || {};\n\n      // currentRoute가 변경되면 data 초기화\n      if (\n        newState.currentRoute \u0026\u0026\n        newState.currentRoute !== appState.currentRoute\n      ) {\n        appState = {\n          currentRoute: newState.currentRoute,\n          data: {},\n        };\n      } else {\n        appState = {\n          currentRoute: newState.currentRoute || appState.currentRoute,\n          data: { ...appState.data, ...(newState.data || {}) },\n        };\n      }\n\n      sendResponse({ data: appState });\n      break;\n\n    default:\n      sendResponse({ error: \"Unknown message type\" });\n  }\n  return true; // 비동기 응답을 위해 true 반환\n});\n```\n\n#### 앱 상태에 접근하기 위한 인터페이스 만들기\n\n브라우저의 `background.js`와 통신하기 위한 유틸리티 함수를 만들어야 한다.\n\n```typescript\n// app-cache.ts\n// 쿼리 키 상수\nexport const APP_STATE_KEY = [\"appState\"];\n\n// 백그라운드와 통신하는 함수들\nexport interface AppState {\n  currentRoute: string | null;\n  data: Record\u003cstring, any\u003e;\n}\n\nexport const getAppState = async (): Promise\u003cAppState\u003e =\u003e {\n  const response = await chrome.runtime.sendMessage({\n    type: \"GET_APP_STATE\",\n  });\n  return response?.data ?? { currentRoute: null, data: {} };\n};\n\nexport const updateAppState = async (state: Partial\u003cAppState\u003e) =\u003e {\n  const response = await chrome.runtime.sendMessage({\n    type: \"UPDATE_APP_STATE\",\n    state: {\n      currentRoute: state.currentRoute ?? null,\n      data: state.data ?? {},\n    },\n  });\n  return response.data;\n};\n```\n\n#### React Query 통합\n\nReact Query를 사용하여 캐시 상태를 관리하는 커스텀 훅을 만들었다.\n\n```tsx\n// use-cache.tsx\nimport { usePin } from \"@/contexts/pin/use\";\nimport { getAppState, updateAppState } from \"@/lib/app-cache\";\nimport { useMutation, useQuery, useQueryClient } from \"@tanstack/react-query\";\n\nexport const useCacheQuery = () =\u003e {\n  const { validPin } = usePin();\n  return useQuery({\n    queryKey: [\"cache\"],\n    queryFn: getAppState,\n    enabled: !!validPin,\n    staleTime: Infinity,\n  });\n};\n\nexport const useCacheMutation = () =\u003e {\n  const queryClient = useQueryClient();\n  return useMutation({\n    mutationFn: updateAppState,\n    onSuccess: (newState) =\u003e {\n      queryClient.setQueryData([\"cache\"], newState);\n    },\n  });\n};\n```\n\n- `useCacheQuery`: 앱 상태를 가져오는 쿼리 (PIN이 유효할 때만 활성화)\n- `useCacheMutation`: 앱 상태를 업데이트하는 뮤테이션\n\n#### Context API로 앱 전체에서 접근 가능하게 만들기\n\n캐시 상태에 앱 전체에서 쉽게 접근할 수 있도록 React Context를 만들었다.\n\n```tsx\n// 타입 정의 (contexts/cache/type.ts)\nimport { createContext } from \"react\";\n\nexport interface AppState {\n  currentRoute: string | null;\n  data: Record\u003cstring, any\u003e;\n}\n\nexport interface CacheContextType {\n  cache: AppState | undefined;\n  isLoading: boolean;\n  error: Error | null;\n  updateCache: (newState: Partial\u003cAppState\u003e) =\u003e Promise\u003cvoid\u003e;\n}\n\nexport const CacheContext = createContext\u003cCacheContextType | undefined\u003e(\n  undefined,\n);\n```\n\n```tsx\n// Context Provider (contexts/cache/index.tsx)\nimport React, { useCallback } from \"react\";\nimport { AppState } from \"@/lib/app-cache\";\nimport { CacheContext } from \"./type\";\nimport { useCacheMutation, useCacheQuery } from \"@/hooks/use-cache\";\n\nexport function CacheProvider({ children }: { children: React.ReactNode }) {\n  // Fetch cache data\n  const { data: cache, isLoading, error } = useCacheQuery();\n\n  // Update cache mutation\n  const { mutateAsync: updateCacheMutation } = useCacheMutation();\n\n  // Update cache wrapper function\n  const updateCache = useCallback(\n    async (newState: Partial\u003cAppState\u003e) =\u003e {\n      await updateCacheMutation(newState);\n    },\n    [updateCacheMutation],\n  );\n\n  return (\n    \u003cCacheContext.Provider\n      value={{\n        cache,\n        isLoading,\n        error,\n        updateCache,\n      }}\n    \u003e\n      {children}\n    \u003c/CacheContext.Provider\u003e\n  );\n}\n```\n\n```tsx\n// 사용을 위한 커스텀 훅 (contexts/cache/use.ts)\nimport { CacheContext } from \"@/contexts/cache/type\";\nimport { useContext } from \"react\";\n\n// Custom hook to use the cache context\nexport function useCache() {\n  const context = useContext(CacheContext);\n  if (context === undefined) {\n    throw new Error(\"useCache must be used within a CacheProvider\");\n  }\n  return context;\n}\n```\n\n#### 실제 사용 예시\n\n캐시 시스템을 실제로 어떻게 사용하는지 예시 코드를 살펴보자.\n\n```tsx\n// 특정 컴포넌트에서 캐시 사용하기\nimport { useCache } from '@/contexts/cache/use';\nimport { useEffect } from 'react';\nimport { useLocation } from 'react-router-dom';\n\nfunction MyComponent() {\n  const location = useLocation();\n  const { cache, updateCache } = useCache();\n  \n  // 현재 라우트 저장\n  useEffect(() =\u003e {\n    updateCache({ currentRoute: location.pathname });\n  }, [location.pathname, updateCache]);\n  \n  // 컴포넌트 상태 저장\n  const saveData = (newData) =\u003e {\n    updateCache({ \n      data: { \n        ...cache?.data,\n        myComponentData: newData \n      } \n    });\n  };\n  \n  // 저장된 데이터 사용\n  useEffect(() =\u003e {\n    if (cache?.data?.myComponentData) {\n      // 저장된 데이터로 컴포넌트 상태 복원\n      // ...\n    }\n  }, [cache]);\n  \n  return (\n    // ... 컴포넌트 렌더링\n  );\n}\n```\n\n이런 식으로 다양한 컴포넌트에서 캐시를 활용하여 상태를 저장하고 복원할 수 있다.\n\n## 최종 생각\n\n확장 프로그램 세션이 종료되어도 사용자 경험을 유지하는 것은 생각보다 까다로운 문제였다. `background.js`를 활용한 메모리 기반 캐시는 데이터의 민감성과 일시적인 저장 특성을 고려할 때 최적의 선택이었다. React Query와 Context API를 함께 사용함으로써 상태 관리 로직을 깔끔하게 구현할 수 있었고, 사용자 경험을 크게 향상시킬 수 있었다.\n\n트레이딩 도구처럼 빠른 상호작용이 필요한 확장 프로그램에서는 이런 방식의 캐시가 매우 유용하다. 다음 프로젝트에서도 이런 패턴을 적극 활용해봐야겠다.\n"])</script><script>self.__next_f.push([1,"10:T15b7,"])</script><script>self.__next_f.push([1,"크롬 확장 프로그램을 통해 트레이딩 도구를 개발하는 도중, 한 가지 큰 문제가 있었다.\n크롬 확장 프로그램은 일반 앱처럼 보이지만, 사용자가 팝업 창이나 사이드바를 닫으면 확장 프로그램의 세션이 완전히 종료된다. 이로 인해 사용자가 입력했던 데이터나 현재 보고 있던 화면 위치가 저장되지 않고, 재접속 시 항상 처음 화면으로 돌아가게 된다.\n멀티태스킹 환경에서 트레이더들은 확장 프로그램을 수시로 열고 닫아야 하는데, 매번 처음부터 시작해야 하는 것은 큰 불편함이었다.\n문제를 해결의 목표를 단순하게 정리하면 다음과 같다\n\u003e [!goal]\n\u003e 크롬 확장프로그램을 사용하는 와중 확장프로그램의 창을 닫고 키면 이전 창의 정보를 복원시킨다.\n해당 목적을 달성하기 위해선 단순하게 사용자가 사용하고 있는 정보를 저장할 저장소만 있으면 되겠다고 판단하였다.\n| 저장소                   | 최대 용량                      | 데이터 구조                      | 비동기 지원 | 지속성                                            | 다른 탭/창 공유                         |\n| ------------------------ | ------------------------------ | -------------------------------- | ----------- | ------------------------------------------------- | --------------------------------------- |\n| localStorage           | 5MB                            | 문자열(JSON)                     | ❌(동기)    | 브라우저 종료 후에도 유지                         | ✅(같은 출처에서 공유)                  |\n| sessionStorage         | 5MB                            | 문자열(JSON)                     | ❌(동기)    | 탭(세션)이 닫히면 삭제                            | ❌(탭마다 독립적)                       |\n| chrome.storage.local   | 10MB (확장 프로그램)           | JSON 객체 저장 가능              | ✅(비동기)  | 브라우저 종료 후에도 유지                         | ✅(확장 프로그램 내에서 공유 가능)      |\n| chrome.storage.session | 10MB (확장 프로그램)           | JSON 객체 저장 가능              | ✅(비동기)  | 확장 프로그램이 종료되면 삭제                     | ✅(확장 프로그램 내에서 공유 가능)      |\n| IndexedDB              | GB 단위                        | 객체 저장 가능 (JSON, 배열 포함) | ✅(비동기)  | 브라우저 종료 후에도 유지                         | ✅(같은 출처에서 가능)                  |\n| background.js          | 제한 없음 (메모리 사용량 만큼) | 모든 JS 객체 저장 가능           | ✅(비동기)  | 브라우저 종료되면 삭제 (persistent: false일 경우) | ✅(확장 프로그램 내 모든 페이지와 공유) |\n서로 다른 장단점이 있지만 내가 원하는 기능을 하기위해서는 background.js가 가장 적합하였다.\n그 이유는 다음과 같다.\n1. pin 정보같은 민감한 정보도 일시적으로 저장될 수 있기 때문에 localStorage와 sessionStorage그리고 IndexedDB를 이용하지 않아야 한다.\n2. 확장프로그램이 닫혀도 정보가 유지되어야 하기 때문에 chrome.storage.session과 sessionStorage를 이용할 수 없다.\nbackground.js를 이용하는 방법이 내가 내가 원하는 사용자 경험과 가장 잘 맞았다.\n문제를 해결하기 위해서는 2가지 기능이 필요하다.\n1. 앱을 사용하는 동안 사용자의 현제 라우트 위치와 해당 위치에 필요한 데이터 저장하기.\n2. 앱을 켤때 background.js 에 저장된 앱의 상태가 있는지 확인하고 있다면 복원하기.\n현제 프로젝트에서는 react-query를 사용중이기 때문에 react-query와 context 그리고 hook을 사용하여 앱의 상태를 저장하고 앱을 실행시킬때 불러오는 작업을 담당하도록 하였다.\nbackground.js는 브라우저 영역에서 작동하는 스크립트 이다.\nbackground.js 와 크롬 확장프로그램은 서로 chrome.runtime.onMessage 와 chrome.runtime.sendMessage 함수로 통신이 가능하다.\n간단하게 background.js를 작성해보자\n브라우저의 background.js와 통신하기 위한 유틸리티 함수를 만들어야 한다.\nReact Query를 사용하여 캐시 상태를 관리하는 커스텀 훅을 만들었다.\nuseCacheQuery: 앱 상태를 가져오는 쿼리 (PIN이 유효할 때만 활성화)\nuseCacheMutation: 앱 상태를 업데이트하는 뮤테이션\n캐시 상태에 앱 전체에서 쉽게 접근할 수 있도록 React Context를 만들었다.\n캐시 시스템을 실제로 어떻게 사용하는지 예시 코드를 살펴보자.\n이런 식으로 다양한 컴포넌트에서 캐시를 활용하여 상태를 저장하고 복원할 수 있다.\n확장 프로그램 세션이 종료되어도 사용자 경험을 유지하는 것은 생각보다 까다로운 문제였다. background.js를 활용한 메모리 기반 캐시는 데이터의 민감성과 일시적인 저장 특성을 고려할 때 최적의 선택이었다. React Query와 Context API를 함께 사용함으로써 상태 관리 로직을 깔끔하게 구현할 수 있었고, 사용자 경험을 크게 향상시킬 수 있었다.\n트레이딩 도구처럼 빠른 상호작용이 필요한 확장 프로그램에서는 이런 방식의 캐시가 매우 유용하다. 다음 프로젝트에서도 이런 패턴을 적극 활용해봐야겠다."])</script><script>self.__next_f.push([1,"11:T199f,"])</script><script>self.__next_f.push([1,"\n# 취업을 위한 알고리즘 공부\n\n목표: 취업을 하기위한 알고리즘 공부\n어디서 어떻게 시작해야 발전할 수 있는지 모르기 때문에 다른 사람들을 먼저 찾아보고 따라해보면서 공부해 나간다.\n\n## 다른 사람들이 소개하는 알고리즘 공부방법\n\n인터넷검색을 통해 내가 실천할 수 있을만한 것들을 선별하여 정리하자\n\n### 알고리즘 코딩테스트 입문자를 위한 공부법\n\n출처:[Velog 포스트](https://velog.io/@skiende74/%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98-%EC%BD%94%EB%94%A9%ED%85%8C%EC%8A%A4%ED%8A%B8-%EC%9E%85%EB%AC%B8%EC%9E%90%EB%A5%BC-%EC%9C%84%ED%95%9C-%EA%B3%B5%EB%B6%80%EB%B2%95)\n\n따라하기 쉽게 뭐부터 풀어라 를 잘 알려주고 있다.(나에게 필요한것일수도?)\n\n1. 프로그래머스 0.5 레벨\n2. [백준 단계별 문제 풀기](https://www.acmicpc.net/step)\n3. dfs/bfs,완전탐색 이론공부 후 실버 15문제 풀기\n4. dp 이론공부 후 실버 15문제 풀기\n5. 앞서 진행한 문제 유형별로 실보 15문제/골드 10문제 풀기 (완전탐색, dp 등은 20문제 이상)\n6. 이진탐색 유형 이론공부 후 실버 15문제 풀기\n7. 디익스트라 유형 이론공부 후 실버 15문제 풀기\n8. 유니온파인드 유형 이론공부 후 실버 10문제 풀기\n9. MST(크루스칼,프림) 유형 이론공부 후 실버 10문제 풀기\n10. 투포인터, 슬리이딩윈도우 유형 이론공부 후 투포인터 유형 실버 10문제 풀기.\n11. 비트마스킹 유형 이론공부 후 실버 10문제 풀기.\n\n\u003e [!info] 참고\n\u003e [백준 유형별 공략법](https://velog.io/@skiende74/%EB%B0%B1%EC%A4%80-%EC%9C%A0%ED%98%95%EB%B3%84%EB%A1%9C-%EB%AF%B8%EB%8A%94%EB%B2%95)\n\u003e\n\u003e [코드트리](https://www.codetree.ai/)\n\u003e\n\u003e [유형별 백준](https://solved.ac/search?query=%23graph_traversal+*s\u0026sort=solved\u0026direction=desc\u0026page=1)\n\u003e\n\u003e [이코테 해설강의](https://www.youtube.com/watch?v=7C9RgOcvkvo\u0026ab_channel=%EB%8F%99%EB%B9%88%EB%82%98)\n\u003e\n\u003e [문어박사 해설강의](https://www.youtube.com/@IT-zk3so/videos)\n\u003e\n\u003e [개발자장고 알고리즘 강의](https://www.youtube.com/watch?v=3_eVkTkBbJE\u0026ab_channel=%EA%B0%9C%EB%B0%9C%EC%9E%90%EC%9E%A5%EA%B3%A0)\n\u003e\n\u003e [알고리즘 고수 바킹독 강의](https://www.youtube.com/playlist?list=PLtqbFd2VIQv4O6D6l9HcD732hdrnYb6CY)\n\u003e\n\u003e [바킹독 블로그 강의포스팅](https://blog.encrypted.gg/category/%EA%B0%95%EC%A2%8C/%EC%8B%A4%EC%A0%84%20%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98?page=1)\n\n### 알고리즘 대회 공부 과정\n\n출처: [DC 게시글](https://gall.dcinside.com/mgallery/board/view/?id=ps\u0026no=44058)\n\n- [티스토리 블로그](https://plzrun.tistory.com/entry/%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98-%EB%AC%B8%EC%A0%9C%ED%92%80%EC%9D%B4PS-%EC%8B%9C%EC%9E%91%ED%95%98%EA%B8%B0)\n\n  1. 입출력 문제 풀어보기\n\n     - 2557, 1000, 2558, 10950, 10951, 10952, 10953, 11021, 11022, 11718, 11719, 11720, 11721, 2741, 2742, 2739, 1924, 8393, 10818, 2438, 2439, 2440, 2441, 2442, 2445, 2522, 2446, 10991, 10992\n     - 입출력 문제들을 풀 때 *1  이 과정에서 데이터 동기화 문제(예: 중복 저장, 최신 버전 식별 등)가 발생할 가능성이 높다.\n4. 백엔드 서버를 유지보수해야 하므로 추가적인 비용과 관리 부담이 생긴다.\n5. 단순한 마크다운 기반 블로그를 운영하는 데 있어, DB를 활용하는 것이 오히려 과도한 복잡성을 초래할 수 있다.\n\n이러한 문제점 때문에 나는 DB 사용하지 않기로 하였다.\nDB를 사용하지 않는다면 [[동적 사이트 vs 정적사이트|동적 사이트로 블로그를 개발할 이유]]가 사라진다. 그러면 이제 정적 사이트를 위해 고민할것은 파일을 프로젝트 폴더 안으로 가져와 파일을 동기화 해야 한다.\n\n파일을 프로젝트 폴더 안으로 가져오는 것을 **파이썬 스크립트**를 사용하여 구현하기로 하였다.\nPython을 통해 파일 시스템을 만져본것은 처음이라 [[Aider|AI 툴]]을 활용하여 작성하였다. 완성된 스크립트는 [링크](https://github.com/lazy-dinosaur/lazy-dinosaur.github.io/blob/blog/scripts/sync-notes.py)를 통해 확인할 수 있다.\n\n\u003e [!tip]\n\u003e\n\u003e - [[Python Script로 파일 복사해오기]]\n\u003e - [[Python Script로 Markdown 파일 읽어오기]]\n\u003e - [[Python Script로 JSON 파일 작성하기]]\n\nNext.js 를 활용하여 블로그를 만들때 기본적으로 content 폴더에 파일들을 가져와 빌드하게 된다.\n"])</script><script>self.__next_f.push([1,"14:T9fa,"])</script><script>self.__next_f.push([1,"앞선 포스트에서 살펴본것처럼 내가 중요하게 생각한 블로그의 조건은 다음과 같았다.\n1. 블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것\n2. 노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것\n3. 포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것\n4. 필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것\n나는 Neovim 과 Obsidian 을 활용하여 노트를 작성하고 있다. 내가 이러한 셋업을 사용하면서 원하는 워크플로우는 Neovim 으로 노트를 작성 한 이후 커맨드를 사용하여 바로 노트를 동기화 시키고 블로그에 글을 포스팅하는 것 이었다.\n노트를 동기화 시키는 방법은 두가지로 좁혀진다. DB를 사용하는 방식과 사용하지 않는 방식이다\n1. 만약 DB를 사용하게 된다면 백엔드를 만들어 API를 활용해서 블로그를 관리해야 한다. 즉, 관리의 복잡성이 증가한다.\n2. API를 통해 먼저 DB에서 노트를 불러오고 현재 노트와 비교해야 하는 번거로운 작업이 필요하다.\n3. 노트의 버전 관리를 위해 추가적인 작업이 필요하며, 이 과정에서 데이터 동기화 문제(예: 중복 저장, 최신 버전 식별 등)가 발생할 가능성이 높다.\n4. 백엔드 서버를 유지보수해야 하므로 추가적인 비용과 관리 부담이 생긴다.\n5. 단순한 마크다운 기반 블로그를 운영하는 데 있어, DB를 활용하는 것이 오히려 과도한 복잡성을 초래할 수 있다.\n이러한 문제점 때문에 나는 DB 사용하지 않기로 하였다.\nDB를 사용하지 않는다면 동적 사이트로 블로그를 개발할 이유가 사라진다. 그러면 이제 정적 사이트를 위해 고민할것은 파일을 프로젝트 폴더 안으로 가져와 파일을 동기화 해야 한다.\n파일을 프로젝트 폴더 안으로 가져오는 것을 파이썬 스크립트를 사용하여 구현하기로 하였다.\nPython을 통해 파일 시스템을 만져본것은 처음이라 AI 툴을 활용하여 작성하였다. 완성된 스크립트는 링크를 통해 확인할 수 있다.\n\u003e [!tip]\n\u003e\n\u003e - Python Script로 파일 복사해오기]]\n\u003e - [[Python Script로 Markdown 파일 읽어오기]]\n\u003e - [[Python Script로 JSON 파일 작성하기\nNext.js 를 활용하여 블로그를 만들때 기본적으로 content 폴더에 파일들을 가져와 빌드하게 된다."])</script><script>self.__next_f.push([1,"15:T11a8,"])</script><script>self.__next_f.push([1,"\n# 개인 블로그를 제작하게 된 이유\n\n개발자로서 내가 한 일을 기록하고, 이를 공유할 수 있는 공간이 필요했다. 여러 블로그 플랫폼이 있지만, **작성한 글을 복사해서 붙여넣어야 한다는 점**이 번거로웠다. 이 과정에서 블로그 운영이 기록의 목적이 아니라 **포스트를 만들기 위한 기록**처럼 느껴지는 문제가 발생했다. 결국, 기존 플랫폼을 이용하는 방식은 내 스타일이 아니라는 결론을 내렸다.\n\n## 블로그 운영 방식에 대한 고민\n\n블로그를 운영하는 방식에는 크게 세 가지가 있다고 생각했다.\n\n1. 기존 블로그 플랫폼을 이용하는 방법\n2. Notion이나 Obsidian의 Publish 기능을 활용하는 방법\n3. 직접 개인 블로그를 제작하여 운영하는 방법\n\n각각의 방법을 고민하면서 어떤 방식이 나에게 가장 적합할지 검토했다.\n\n## 블로그 플랫폼의 한계\n\n기존 블로그 플랫폼을 이용하는 방법에는 두 가지 방식이 있다. API를 활용한 자동화와 수동으로 글을 업로드하는 방식이다. 하지만 이 두 가지 방법 모두 내게는 불편한 점이 많았다.\n\n### 1. API를 활용한 자동화의 어려움\n\n일부 블로그 플랫폼은 API를 제공하지만, 최근에는 이를 폐지하는 곳이 많아졌다. 대표적으로 **네이버 블로그**와 **티스토리**가 API 지원을 중단했다. 이처럼 플랫폼 정책이 바뀔 위험성이 크기 때문에 특정 서비스에 의존하는 것은 장기적으로 안전한 방법이 아니라고 판단했다.\n\n### 2. 수동 업로드의 번거로움\n\n나는 **Neovim을 이용해 글을 작성하고, Obsidian을 뷰어(Viewer)로 사용**하고 있다. 따라서 글을 블로그에 올리려면 복사하여 붙여넣어야 하며, 플랫폼에서 지원하지 않는 **Callout 형식**이나 **Wiki 스타일 링크** 등을 직접 변환해야 하는 번거로움이 있다.\n\n## 노트 앱의 Publish 기능 활용의 한계\n\nNotion과 Obsidian 같은 노트 앱의 Publish 기능을 활용하는 방법도 고려했지만, 몇 가지 제약이 있었다.\n\n### 1. 노트와 블로그 포스트의 분리 문제\n\n나는 노트를 우선 **Inbox 폴더**에 저장한 후, 필요한 경우 다른 폴더로 이동시키는 방식으로 정리한다. 하지만 이 방식은 블로그에 올릴 글을 특정 카테고리로 묶는 데 제약이 생긴다. 이를 해결하려면 블로그 전용 워크스페이스를 만들어야 하는데, 이는 기존 블로그 플랫폼을 사용하는 것과 크게 다르지 않다.\n\n### 2. 커스터마이징의 한계\n\nNotion과 Obsidian은 강력한 노트 관리 기능을 제공하지만, 블로그 디자인과 기능을 원하는 대로 변경하는 데는 한계가 있다. 특히 Obsidian의 Publish 기능은 기본적으로 노트 공유에 초점이 맞춰져 있어, 블로그를 운영하는 데 적합하지 않았다.\n\n## 나만의 블로그를 제작하기로 결정하다\n\n위의 문제점들을 고려한 결과, 나만의 블로그를 직접 제작하는 것이 최선의 방법이라고 판단했다. 이렇게 하면 기존 방식의 모든 단점을 보완하면서도 나만의 이상적인 블로그 운영 방식을 구축할 수 있다.\n\n### 내가 만들고 싶은 블로그의 조건\n\n기존 방식의 문제를 반대로 생각하면, 내가 원하는 블로그의 조건은 다음과 같았다.\n\n1. **블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것**\n2. **노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것**\n3. **포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것**\n4. **필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것**\n\n이러한 목표를 달성하기 위해 데이터베이스(DB) 사용도 고려했지만, 단순한 방법이 더 적합하다고 판단했다. 그래서 **Python을 활용하여** Obsidian Vault 폴더 내의 Markdown 파일을 자동으로 블로그로 가져오는 방식을 선택했다.\n\n### 커스터마이징을 위한 프레임워크\n\n블로그를 만들기 위한 다양한 프레임워크가 있지만 내가 다룰 줄 아는 프레임워크인 Next.js 가 커스터마이징하기 쉬워 보였기 때문에 Next.js 를 활용하여 블로그를 구축 하기로 결정하였다.\n\n다음: [[어떻게 블로그를 구현하였나]]\n"])</script><script>self.__next_f.push([1,"16:Tf5f,"])</script><script>self.__next_f.push([1,"개발자로서 내가 한 일을 기록하고, 이를 공유할 수 있는 공간이 필요했다. 여러 블로그 플랫폼이 있지만, 작성한 글을 복사해서 붙여넣어야 한다는 점이 번거로웠다. 이 과정에서 블로그 운영이 기록의 목적이 아니라 포스트를 만들기 위한 기록처럼 느껴지는 문제가 발생했다. 결국, 기존 플랫폼을 이용하는 방식은 내 스타일이 아니라는 결론을 내렸다.\n블로그를 운영하는 방식에는 크게 세 가지가 있다고 생각했다.\n1. 기존 블로그 플랫폼을 이용하는 방법\n2. Notion이나 Obsidian의 Publish 기능을 활용하는 방법\n3. 직접 개인 블로그를 제작하여 운영하는 방법\n각각의 방법을 고민하면서 어떤 방식이 나에게 가장 적합할지 검토했다.\n기존 블로그 플랫폼을 이용하는 방법에는 두 가지 방식이 있다. API를 활용한 자동화와 수동으로 글을 업로드하는 방식이다. 하지만 이 두 가지 방법 모두 내게는 불편한 점이 많았다.\n일부 블로그 플랫폼은 API를 제공하지만, 최근에는 이를 폐지하는 곳이 많아졌다. 대표적으로 네이버 블로그와 티스토리가 API 지원을 중단했다. 이처럼 플랫폼 정책이 바뀔 위험성이 크기 때문에 특정 서비스에 의존하는 것은 장기적으로 안전한 방법이 아니라고 판단했다.\n나는 Neovim을 이용해 글을 작성하고, Obsidian을 뷰어(Viewer)로 사용하고 있다. 따라서 글을 블로그에 올리려면 복사하여 붙여넣어야 하며, 플랫폼에서 지원하지 않는 Callout 형식이나 Wiki 스타일 링크 등을 직접 변환해야 하는 번거로움이 있다.\nNotion과 Obsidian 같은 노트 앱의 Publish 기능을 활용하는 방법도 고려했지만, 몇 가지 제약이 있었다.\n나는 노트를 우선 Inbox 폴더에 저장한 후, 필요한 경우 다른 폴더로 이동시키는 방식으로 정리한다. 하지만 이 방식은 블로그에 올릴 글을 특정 카테고리로 묶는 데 제약이 생긴다. 이를 해결하려면 블로그 전용 워크스페이스를 만들어야 하는데, 이는 기존 블로그 플랫폼을 사용하는 것과 크게 다르지 않다.\nNotion과 Obsidian은 강력한 노트 관리 기능을 제공하지만, 블로그 디자인과 기능을 원하는 대로 변경하는 데는 한계가 있다. 특히 Obsidian의 Publish 기능은 기본적으로 노트 공유에 초점이 맞춰져 있어, 블로그를 운영하는 데 적합하지 않았다.\n위의 문제점들을 고려한 결과, 나만의 블로그를 직접 제작하는 것이 최선의 방법이라고 판단했다. 이렇게 하면 기존 방식의 모든 단점을 보완하면서도 나만의 이상적인 블로그 운영 방식을 구축할 수 있다.\n기존 방식의 문제를 반대로 생각하면, 내가 원하는 블로그의 조건은 다음과 같았다.\n1. 블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것\n2. 노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것\n3. 포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것\n4. 필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것\n이러한 목표를 달성하기 위해 데이터베이스(DB) 사용도 고려했지만, 단순한 방법이 더 적합하다고 판단했다. 그래서 Python을 활용하여 Obsidian Vault 폴더 내의 Markdown 파일을 자동으로 블로그로 가져오는 방식을 선택했다.\n블로그를 만들기 위한 다양한 프레임워크가 있지만 내가 다룰 줄 아는 프레임워크인 Next.js 가 커스터마이징하기 쉬워 보였기 때문에 Next.js 를 활용하여 블로그를 구축 하기로 결정하였다.\n다음: 어떻게 블로그를 구현하였나"])</script><script>self.__next_f.push([1,"2:[\"$\",\"html\",null,{\"lang\":\"ko\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{\"className\":\"__variable_4d318d __variable_ea5f4b __variable_d65c78 __variable_dc8395 antialiased transition-all\",\"children\":[\"$\",\"$Ld\",null,{\"attribute\":\"class\",\"defaultTheme\":\"system\",\"enableSystem\":true,\"disableTransitionOnChange\":true,\"children\":[\"$\",\"$Le\",null,{\"posts\":[{\"urlPath\":\"자원/크롬 확장프로그램/크롬 확장프로그램에 케시메모리 추가하기\",\"title\":\"크롬 확장프로그램에 케시메모리 추가하기\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"chrome-extension\",\"example\",\"problem\"],\"series\":\"\",\"createdAt\":\"2025-03-23 09:21:24\",\"modifiedAt\":\"2025-03-24 13:58:25\",\"publish\":\"자원/크롬 확장프로그램\",\"content\":\"$f\",\"plainContent\":\"$10\"},{\"urlPath\":\"자원/SWEA 강의 정리노트/SWEA 강의 정리노트\",\"title\":\"SWEA 강의 정리노트\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"study\",\"algorithm\"],\"series\":\"\",\"createdAt\":\"2025-03-19 12:20:41\",\"modifiedAt\":\"2025-03-20 16:17:34\",\"publish\":\"자원/SWEA 강의 정리노트\",\"content\":\"\\n# SWEA 강의 정리노트\\n\\n- [강의 주소](https://swexpertacademy.com/main/learn/course/subjectList.do?courseId=AVuPCwCKAAPw5UW6)\\n\\n## 강의 노트\\n\\n### Computaional Thinking\\n\\n- [[프로그래밍과 논리수학]]\\n\",\"plainContent\":\"강의 주소\\n프로그래밍과 논리수학\"},{\"urlPath\":\"프로젝트/알고리즘/취업을 위한 알고리즘 공부\",\"title\":\"취업을 위한 알고리즘 공부\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"project\",\"study\",\"algorithm\"],\"series\":\"취업을 위해 알고리즘 공부하기\",\"createdAt\":\"2025-03-19 08:05:06\",\"modifiedAt\":\"2025-03-20 16:16:00\",\"publish\":\"프로젝트/알고리즘\",\"content\":\"$11\",\"plainContent\":\"$12\"},{\"urlPath\":\"자원/ai/Aider\",\"title\":\"Aider\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"ai\",\"tool\",\"aider\",\"quickstart\"],\"series\":\"\",\"createdAt\":\"2025-03-10 08:21:08\",\"modifiedAt\":\"2025-03-20 16:17:15\",\"publish\":\"자원/ai\",\"content\":\"\\n# Aider\\n\\n공식 홈페이지:[Home | Aider](https://aider.chat/)\\n\\n\u003e [!quote]\\n\u003e Aider lets you pair program with LLMs, to edit code in your local git repository. Start a new project or work with an existing code base.\\n\\nAider 는 터미널을 통해 AI 와 [Pair Programming](https://namu.wiki/w/%ED%8E%98%EC%96%B4%20%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%98%EB%B0%8D)을 할 수 있도록 해주는 툴이다.\\n\\n비슷 한 툴로는 Cursor, Claude, Windsurf 등이 있다.\\n\\n## QuickStart\\n\",\"plainContent\":\"공식 홈페이지:Home | Aider\\n\u003e [!quote]\\n\u003e Aider lets you pair program with LLMs, to edit code in your local git repository. Start a new project or work with an existing code base.\\nAider 는 터미널을 통해 AI 와 Pair Programming을 할 수 있도록 해주는 툴이다.\\n비슷 한 툴로는 Cursor, Claude, Windsurf 등이 있다.\"},{\"urlPath\":\"자원/web/동적 사이트 vs 정적사이트\",\"title\":\"동적 사이트 vs 정적사이트\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"web\"],\"series\":\"\",\"createdAt\":\"2025-03-10 07:39:08\",\"modifiedAt\":\"2025-03-20 16:16:49\",\"publish\":\"자원/web\",\"content\":\"\\n# 동적 사이트 vs 정적사이트\\n\\n복잡하게 생각하지 말고 단순하게 동적 사이트와 정적 사이트를 구분한다면 페이지의 렌더링 **_(화면 렌더링 아님)_** 시기 이다.\\n\\n정적 사이트는 HTML이 빌드 타임에 미리 생성되고 수정되지 않는다.\\n하지만 동적 사이트의 경우 클라이언트 측이든 서버 측이든 요청에 따라 HTML 이 생성되게 된다.\\n\\n\u003e [!caution] 화면 렌더링(브라우저의 렌더링) 과 페이지 렌더링의 차이\\n\u003e 동적 사이트와 정적사이트에서 표현하는 렌더링은 HTML에 대한 렌더링 이다. 즉 코드를 HTML 로 변환하는 과정을 말한다.\\n\u003e 화면에 대한 렌더링은 이 완성된 HTML 과 CSS 를 웹브라우져가 화면에 그려 표현해주는것을 뜻한다.\\n\u003e 참고: [[웹브라우저의 렌더링]]\\n\\n## CSR,SSR,SSG\\n\\nCSR(Client Side Rendering) 과 SSR(Server Side Rendering) 의 경우 동적 사이트로 분류될 수 있다. 왜냐하면 HTML 의 렌더링 시기 때문이다.\\nSSR의 경우 요청에 따라 Javascript 가 담겨있는 HTML을 받아와 해당 javascript 코드를 실행하여 직접 HTML을 생성하여 렌더링 하게 된다. SSR의 경우 요청에 따라 서버 측에서 HTML 을 생성하여 클라이언트로 전송한다.\\n\\nCSR과 SSR둘 다 요청 이후에 필요에 따라 HTML이 새로 만들어지며 이 때문에 **_동적 사이트_** 방식으로 분류될 수 있다.\\n\\nSSG의 경우 HTML 을 빌드 타임에 미리 생성하게 되기 때문에 **_정적 사이트_**로 분류될 수 있다.\\n\\n참고: [[CSR vs SSR vs SSG]]\\n\",\"plainContent\":\"복잡하게 생각하지 말고 단순하게 동적 사이트와 정적 사이트를 구분한다면 페이지의 렌더링 _(화면 렌더링 아님)_ 시기 이다.\\n정적 사이트는 HTML이 빌드 타임에 미리 생성되고 수정되지 않는다.\\n하지만 동적 사이트의 경우 클라이언트 측이든 서버 측이든 요청에 따라 HTML 이 생성되게 된다.\\n\u003e [!caution] 화면 렌더링(브라우저의 렌더링) 과 페이지 렌더링의 차이\\n\u003e 동적 사이트와 정적사이트에서 표현하는 렌더링은 HTML에 대한 렌더링 이다. 즉 코드를 HTML 로 변환하는 과정을 말한다.\\n\u003e 화면에 대한 렌더링은 이 완성된 HTML 과 CSS 를 웹브라우져가 화면에 그려 표현해주는것을 뜻한다.\\n\u003e 참고: 웹브라우저의 렌더링]]\\nCSR(Client Side Rendering) 과 SSR(Server Side Rendering) 의 경우 동적 사이트로 분류될 수 있다. 왜냐하면 HTML 의 렌더링 시기 때문이다.\\nSSR의 경우 요청에 따라 Javascript 가 담겨있는 HTML을 받아와 해당 javascript 코드를 실행하여 직접 HTML을 생성하여 렌더링 하게 된다. SSR의 경우 요청에 따라 서버 측에서 HTML 을 생성하여 클라이언트로 전송한다.\\nCSR과 SSR둘 다 요청 이후에 필요에 따라 HTML이 새로 만들어지며 이 때문에 _동적 사이트_ 방식으로 분류될 수 있다.\\nSSG의 경우 HTML 을 빌드 타임에 미리 생성하게 되기 때문에 _정적 사이트_로 분류될 수 있다.\\n참고: [[CSR vs SSR vs SSG\"},{\"urlPath\":\"프로젝트/블로그/어떻게 블로그를 구현하였나\",\"title\":\"어떻게 블로그를 구현하였나\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"blog\",\"dev\",\"project\"],\"series\":\"나의 맞춤 블로그 만들기\",\"createdAt\":\"2025-03-08 17:12:17\",\"modifiedAt\":\"2025-03-20 16:16:24\",\"publish\":\"프로젝트/블로그\",\"content\":\"$13\",\"plainContent\":\"$14\"},{\"urlPath\":\"프로젝트/블로그/개인 블로그를 제작하게 된 이유\",\"title\":\"개인 블로그를 제작하게 된 이유\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"blog\",\"dev\",\"project\"],\"series\":\"나의 맞춤 블로그 만들기\",\"createdAt\":\"2025-03-08 17:09:39\",\"modifiedAt\":\"2025-03-20 16:17:00\",\"publish\":\"프로젝트/블로그\",\"content\":\"$15\",\"plainContent\":\"$16\"}],\"postsMetadata\":[{\"urlPath\":\"자원/크롬 확장프로그램/크롬 확장프로그램에 케시메모리 추가하기\",\"title\":\"크롬 확장프로그램에 케시메모리 추가하기\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:0:tags\",\"series\":\"\",\"createdAt\":\"2025-03-23 09:21:24\",\"modifiedAt\":\"2025-03-24 13:58:25\",\"publish\":\"자원/크롬 확장프로그램\"},{\"urlPath\":\"자원/SWEA 강의 정리노트/SWEA 강의 정리노트\",\"title\":\"SWEA 강의 정리노트\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:1:tags\",\"series\":\"\",\"createdAt\":\"2025-03-19 12:20:41\",\"modifiedAt\":\"2025-03-20 16:17:34\",\"publish\":\"자원/SWEA 강의 정리노트\"},{
