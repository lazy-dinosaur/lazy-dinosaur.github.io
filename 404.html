아 **`if` 문이나 `for`문 블록 내에서 선언해도 해당 블록 외부에서 접근이 가능하다.**\n\n- `let`,`const`\n  **블록 스코프(Block Scope)**를 가진다. 변수가 선언된 블록(`{}`),문(statement), 또는 표현식 내에서만 유효하다. 이는 **변수의 유효 범위를 더 좁게 제한하여 의도치 않은 값 변경이나 충돌을 방지한다.**\n\n\u003e [!tip] 스코프 더 자세히 알아 보기\n\u003e\n\u003e - [[스코프(Scope)란 무엇인가]]\n\n### 재선언(Redeclaration)\n\n- `var`\n  같은 스코프 내에서 **동일한 이름으로 변수를 다시 생성해도 에러가 발생하지 않는다.** 이는 실수로 변수를 덮어쓰는 문제를 일으킬 수 있다.\n\n- `let`,`const`\n  같은 스코프 내에서 동일한 이름으로 변수를 **다시 선언하면 `SyntaxError`가 발생한다.**\n\n### 재할당(Reassignment)\n\n- `var`,`let`\n  선언 후에 다른 값으로 **재할당 하는 것이 가능**하다.\n- `const`\n  선언시 반드시 값으로 초기화해야 하며, 한번 할당된 후에는 **다른 값으로 재할당할 수 없다(상수).** 단, `const`로 선언된 객체나 배열의 경우, 객체 자체를 재할당할 수는 없지만 그 내부의 속성이나 요소는 변경할 수 있다(객체/배열 자체가 불변이 되는것은 아님).\n\n## 비교표\n\n| 기능(Feature)                | var                      | let                      | const                    |\n| ---------------------------- | ------------------------ | ------------------------ | ------------------------ |\n| 스코프(Scope)                | 함수 스코프(Function)    | 블록 스코프(Block)       | 블록 스코프(Block)       |\n| 호이스팅(Hoisting)           | 선언 + `undefined`초기화 | 선언만(초기화X)          | 선언만(초기화X)          |\n| 재선언 (Redeclaration)       | 가능(O)                  | 불가능(X,같은 스코프 내) | 불가능(X,같은 스코프 내) |\n| 재할당(Reassignment)         | 가능(O)                  | 가능(O)                  | 불가능(X)                |\n| 시간적 사각지대(TDZ)         | 없음(X)                  | 있음(O)                  | 있음(O)                  |\n| 선언 전 접근 (Access before) | `undefined`              | `ReferenceError`         | `ReferenceError`         |\n\n\u003e [!info]\n\u003e\n\u003e `let`과`const`가 TDZ를 가지는 것은 선언 전에 변수를 사용하는 실수를 방지하는 데 도움을 준다.\n\u003e `var`에서 `let`과 `const`로의 전환은 단순히 새로운 키워드를 사용하는 것을 넘어, 자바스크립트 언어가 더 안전하고 예측 가능한 코드를 작성하도록 발전해 왔음을 보여준다. `var`은 함수 레벨 스코프와 `undefined`로 초키화되는 호이스팅 특성 때문에, 특히 반복문이나 조건문 내에서 변수를 사용할 땡 셰아치 못한 버그를 유라하는 경우가 많았다. 예를 들어, `for` 루프에서 이러한 문제를 해결하기 위해 블록 스코프와 TDZ를 도입하여, 변수의 유효 범위를 명확히 하고 선언 전에 접근하는 것을 막아 코드의 안정성을 높였다.\n\u003e\n\u003e - [[호이스팅(Hoisting)이란 무엇인가]]\n"])</script><script>self.__next_f.push([1,"27:Tecc,"])</script><script>self.__next_f.push([1,"var,let,const는 전부 변수 선언 키워드이지만 중요한 차이점이 있다.\nlet과 const는 var의 단점(함수 스코프, 재선언 가능 등)을 보완하기 위해 ES6에서 도입되었다. 블록 스코프와 재선언/재할당 규칙은 코드를 더 예측 가능하고 안전하게 만들어주기 때문에, 현대 자바스크립트 개발에서는 var대신 let과 const사용이 강력히 권장된다. const를 기본으로 사용하고, 재할당이 필요한 경우에만 let을 사용하는것이 좋다.\nvar\n함수 스코프(Function Scope)를 갖는다. 함수 내에서 선언된 var 변수는 함수 전체에서 유효하며, 함수 외부에서는 접근할 수 없다. 블록({})스코프를 가지지 않아 if 문이나 for문 블록 내에서 선언해도 해당 블록 외부에서 접근이 가능하다.\nlet,const\n블록 스코프(Block Scope)를 가진다. 변수가 선언된 블록({}),문(statement), 또는 표현식 내에서만 유효하다. 이는 변수의 유효 범위를 더 좁게 제한하여 의도치 않은 값 변경이나 충돌을 방지한다.\n\u003e [!tip] 스코프 더 자세히 알아 보기\n\u003e\n\u003e - 스코프(Scope)란 무엇인가\nvar\n같은 스코프 내에서 동일한 이름으로 변수를 다시 생성해도 에러가 발생하지 않는다. 이는 실수로 변수를 덮어쓰는 문제를 일으킬 수 있다.\nlet,const\n같은 스코프 내에서 동일한 이름으로 변수를 다시 선언하면 SyntaxError가 발생한다.\nvar,let\n선언 후에 다른 값으로 재할당 하는 것이 가능하다.\nconst\n선언시 반드시 값으로 초기화해야 하며, 한번 할당된 후에는 다른 값으로 재할당할 수 없다(상수). 단, const로 선언된 객체나 배열의 경우, 객체 자체를 재할당할 수는 없지만 그 내부의 속성이나 요소는 변경할 수 있다(객체/배열 자체가 불변이 되는것은 아님).\n| 기능(Feature)                | var                      | let                      | const                    |\n| ---------------------------- | ------------------------ | ------------------------ | ------------------------ |\n| 스코프(Scope)                | 함수 스코프(Function)    | 블록 스코프(Block)       | 블록 스코프(Block)       |\n| 호이스팅(Hoisting)           | 선언 + undefined초기화 | 선언만(초기화X)          | 선언만(초기화X)          |\n| 재선언 (Redeclaration)       | 가능(O)                  | 불가능(X,같은 스코프 내) | 불가능(X,같은 스코프 내) |\n| 재할당(Reassignment)         | 가능(O)                  | 가능(O)                  | 불가능(X)                |\n| 시간적 사각지대(TDZ)         | 없음(X)                  | 있음(O)                  | 있음(O)                  |\n| 선언 전 접근 (Access before) | undefined              | ReferenceError         | ReferenceError         |\n\u003e [!info]\n\u003e\n\u003e let과const가 TDZ를 가지는 것은 선언 전에 변수를 사용하는 실수를 방지하는 데 도움을 준다.\n\u003e var에서 let과 const로의 전환은 단순히 새로운 키워드를 사용하는 것을 넘어, 자바스크립트 언어가 더 안전하고 예측 가능한 코드를 작성하도록 발전해 왔음을 보여준다. var은 함수 레벨 스코프와 undefined로 초키화되는 호이스팅 특성 때문에, 특히 반복문이나 조건문 내에서 변수를 사용할 땡 셰아치 못한 버그를 유라하는 경우가 많았다. 예를 들어, for 루프에서 이러한 문제를 해결하기 위해 블록 스코프와 TDZ를 도입하여, 변수의 유효 범위를 명확히 하고 선언 전에 접근하는 것을 막아 코드의 안정성을 높였다.\n\u003e\n\u003e - 호이스팅(Hoisting)이란 무엇인가"])</script><script>self.__next_f.push([1,"28:T96d,"])</script><script>self.__next_f.push([1,"\n# 호이스팅(Hoisting)이란 무엇인가\n\n호이스팅은 자바스크립트 엔진이 코드를 실행하기 전에 변수, 함수, 클래스의 **선언** 부분을 해당 스코프의 최상단으로 끌어올리는 것처럼 동작하는 현상을 말한다.\n\n엔진이 코드를 해석할 때 선언부를 먼저 처리하기 때문에 마치 끌어올려진 것처럼 보인다.\n\n## `var`,`let`,`const`의 호이스팅의 차이\n\n- `var`\n  변수 선언(`var myVar;`)이 스코프 최상단으로 끌어올려지고, 동시에 `undefined`로 **초기화**된다. 따라서 선언문 이전에 변수에 접근해도 에러가 발생하지 않고 `undefined` 값을 가진다.\n\n  ```js\n  //`var` 의 경우 선언 전에 호출하게 되면 `undefined`로 에러가 나지 않는다.\n\n  console.log(myVar); //undefined (var은 호이스팅되고 undefined로 초기화된다)\n  var myVar = 5;\n  ```\n\n- `let`,`const`\n  변수 선언이 스코프 최상단으로 끌어올려지지만, **초기화 되지는 않는다.** 선언문 이전에 해당 변수에 접근하려고 하면 초기화되기 전까지 접근할 수 없다는 `referenceError`가 발생한다. 이 구간을 **시간적 사각지대(Temporal Dead One, TDZ)**라고 한다.\n\n  ```js\n  //`let`과 `const`의 경우 선언 전에 호출하게 되면 `ReferenceError`가 발생한다.\n\n  console.log(myLet); // ReferenceError: Cannot access 'myLet' before initialization (TDZ)\n  let myLet = 5;\n  ```\n\n- 함수 선언식\n  함수 선언식(`function myFunction(){}`)은 함수 전체가 호이스팅되어 선언 전에 호출할 수 있다. 함수 표현식(`function myFunction(){}`)은 변수 호이스팅 규칙(여기서는 `const`)을 따른다.\n\n  ```js\n  //함수 선언식은 선언 전에 호출을 해도 정상적으로 작동 한다. 선언은 전체 호이스팅 되기 때문이다.\n\n  myFunction(); // \"Hello\" (함수 선언식은 호이스팅됨)\n  function myFunction() {\n    console.log(\"Hello\");\n  }\n  ```\n\n\u003e [!tip]\n\u003e\n\u003e - [[var,let,const의 주요 차이점은 무엇인가]]\n\n호이스팅은 특히`var`을 사용할 때 코드의 실행 순서와 변수 값 예측을 어렵게 만들 수 있다.`let`과 `const`의 도입 및 TDZ는 이러한 혼란을 줄이고 더 예측 가능한 코드를 작성하는 데 도움을 준다.\n\n## 관련 정보\n\n- [[변수의 선언,초기화,할당의 차이점은 무엇인가]]\n"])</script><script>self.__next_f.push([1,"29:Ta5c,"])</script><script>self.__next_f.push([1,"\n# HTTP(Hypertext Transfer Protocol)\n\nHTTP(Hypertext Transfer Protocol)는 웹에서 데이터를 주고받기 위한 애플리케이션 계층 프로토콜 이다. 클라이언트와 서버 간의 통신을 담당한다.\n\n## 주요 특징\n\n- 무상태성: 각 요청은 독립적으로 처리되며, 서버는 이전 요청에대한 정보를 저장하지 않는다.\n- 비연결성: 요청-응답 후 연결을 끊는다. (HTTP/1.1에서는 연결을 유지할 수 있음)\n- 요청/응답구조: 클라이언트가 요청을보내면, 서버는 응답을 반환한다.\n\n\u003e [!tip]\n\u003e 무상태성 이라는 특성 때문에 서버는 클라이언트와 재 연결이 되도 클라이언트를 식별하지 못한다. 그 문제를 해결하기 위해서 쿠키와 세션이라는 개념이 등장했다.\n\n## HTTP의 요청-응답\n\nHTTP 요청과 응답은 둘 다 각각 세부분으로 구성된다\n\n### HTTP 요청\n\n1. 요청라인\n   \u003c!-- TODO: HTTP-Methods 페이지 완성하기--\u003e\n\n   - [[HTTP-Methods|HTTP 메소드]]: 수행할 작업 유형(GET,POST 등)\n   - URI(Uniform Resource Identifier): 요청하는 리소스의 경로\n   - HTTP 버전: 사용하는 HTTP 프로토콜 버전\n\n   예) `GET /index.html HTTP/1.1`\n\n2. 헤더\n   요청에 대한 추가 정보를 제공하는 키-값\n\n   - `Host`: 요청을 보내는 서버의 도메인 이름\n   - `User-Agent`: 클라이언트 프로그래 정보(브라우저 종류 등)\n   - `Accept`: 클라이언트가 처리할 수 있는 콘텐츠 유형\n   - `Content-Type`: 요청 본문의 미디어 타입\n   - `Cookie`: 서버에서 이전에 설정한 쿠키 정보\n\n   ```http 예시\n   Host: www.example.com\n   User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)\n   Accept: text/html,application/xhtml+xml\n   Content-Type: application/json\n   Cookie: session=abc123\n   ```\n\n3. 본문\n   주로 POST 나 PUT 메소드에서 서버로 보내는 데이터를 포함한다. GET 요청은 일반적으로 본문이 없다.\n\n   ```json 예시\n   {\n     \"username\": \"user123\",\n     \"password\": \"securepass\"\n   }\n   ```\n\n### HTTP 응답\n\n1. 상태 라인\n   \u003c!-- TODO: 상태코드 페이지 완성하기 --\u003e\n\n   - HTTP 버전: 사용된 HTTP 프로토콜 버전\n   - [[HTTP-Statuscode|상태코드]]: 요청 처리 결과를 나타내는 3자리 숫자\n   - 상태 메시지: 상태 코드에 대한 간략한 설명\n\n2. 헤더-응답에 대한 추가 정보를 제공하는 키-값 쌍\n   - `Content-Type`: 응답 본문의 미디어 타입\n   - `Content-Length`: 응답 본문의 크기\n   - `Server`: 서버 소프트웨어 정보\n   - `Set-Cookie`: 클라이언트에 저장할 쿠키 정보\n"])</script><script>self.__next_f.push([1,"2a:T811,"])</script><script>self.__next_f.push([1,"HTTP(Hypertext Transfer Protocol)는 웹에서 데이터를 주고받기 위한 애플리케이션 계층 프로토콜 이다. 클라이언트와 서버 간의 통신을 담당한다.\n무상태성: 각 요청은 독립적으로 처리되며, 서버는 이전 요청에대한 정보를 저장하지 않는다.\n비연결성: 요청-응답 후 연결을 끊는다. (HTTP/1.1에서는 연결을 유지할 수 있음)\n요청/응답구조: 클라이언트가 요청을보내면, 서버는 응답을 반환한다.\n\u003e [!tip]\n\u003e 무상태성 이라는 특성 때문에 서버는 클라이언트와 재 연결이 되도 클라이언트를 식별하지 못한다. 그 문제를 해결하기 위해서 쿠키와 세션이라는 개념이 등장했다.\nHTTP 요청과 응답은 둘 다 각각 세부분으로 구성된다\n1. 요청라인\n\u003c!-- TODO: HTTP-Methods 페이지 완성하기--\u003e\nHTTP 메소드: 수행할 작업 유형(GET,POST 등)\nURI(Uniform Resource Identifier): 요청하는 리소스의 경로\nHTTP 버전: 사용하는 HTTP 프로토콜 버전\n예) GET /index.html HTTP/1.1\n2. 헤더\n요청에 대한 추가 정보를 제공하는 키-값\nHost: 요청을 보내는 서버의 도메인 이름\nUser-Agent: 클라이언트 프로그래 정보(브라우저 종류 등)\nAccept: 클라이언트가 처리할 수 있는 콘텐츠 유형\nContent-Type: 요청 본문의 미디어 타입\nCookie: 서버에서 이전에 설정한 쿠키 정보\n3. 본문\n주로 POST 나 PUT 메소드에서 서버로 보내는 데이터를 포함한다. GET 요청은 일반적으로 본문이 없다.\n1. 상태 라인\n\u003c!-- TODO: 상태코드 페이지 완성하기 --\u003e\nHTTP 버전: 사용된 HTTP 프로토콜 버전\n상태코드: 요청 처리 결과를 나타내는 3자리 숫자\n상태 메시지: 상태 코드에 대한 간략한 설명\n2. 헤더-응답에 대한 추가 정보를 제공하는 키-값 쌍\nContent-Type: 응답 본문의 미디어 타입\nContent-Length: 응답 본문의 크기\nServer: 서버 소프트웨어 정보\nSet-Cookie: 클라이언트에 저장할 쿠키 정보"])</script><script>self.__next_f.push([1,"2b:T788,\n# DOM(Document Object Model)\n\nDOM(Document Object Model)이란 HTML,XML 같은 마크업 문서를 위한 프로그래밍 인터페이스 이다.\nDOM은 문서를 노드와 객체로 표현해 웹 페이지의 구조화된 표현을 제공한다.\n\nDOM은 개발자가 Javascript를 통해 웹 페이지의 콘텐츠, 구조, 스타일을 동적으로 변경할 수 있게 해 준다. 이를 통해 사용자와 상호작용하는 웹 애플리케이션을 구축할 수 있다.\n\n## DOM의 핵심 개념\n\n- 트리구조: 문서는 부모-자식 관계를 가진 노드들의 트리로 표현된다.\n- 노드: HTML요소, 속성 텍스트등 모든 것이 노드이다.\n- 조작기능: Javascript를 사용해 DOM 노드를 추가, 수정, 삭제할 수 있다.\n- 이벤트 처리: 사용자 상호작용(클릭, 입력 등)에 반응하는 이벤트를 처리한다.\n\n## DOM의 구성 요소\n\n- Document: DOM 트리의 루트 노드\n- Element: HTML 태그에 해당하는 노드(div, p, span 등)\n- Attribute: 요소의 속성(id, class, href 등)\n- Text: 텍스트 내용을 담고 있는 노드\n\n\u003e [!info] window 오브젝트\n\u003e window 객체는 브라우저에서 Javascript의 전역 객체이다. 브라우저 환경에서의 모든 Javascript코드가 실행되는 기본적인 컨테이너 이다.\n\n### 주요 객체들의 부모\n\n- `document`: DOM에 접근할 수 있는 객체\n- `location`: 현재 URL 정보와 탐색 기능\n- `history`: 브라우저 방문 기록 관리\n- `navigator`: 브라우저 정보\n- `screen`: 사용자 화면 정보\n- `localStorage`,`sessionStorage`:클라이언트 측 데이터 저장소\n\n## DOM 조작 예시\n\n```js\n// 요소 선택\nconst element = document.getElementById(\"myId\");\n\n// 새 요소 생성\nconst newElement = document.createElement(\"div\");\n\n// 요소에 내용 추가\nnewElement.textContent = \"안녕하세요\";\n\n// DOM에 요소 추가\nelement.appendChild(newElement);\n```\n2c:Tc4d,"])</script><script>self.__next_f.push([1,"\n# 웹사이트는 어떻게 보여지는가-브라우저의 렌더링\n\n웹사이트는 [[웹사이트에 들어갈때에는 어떤 일이 생기는가-웹사이트접속의 과정|사용자의 요청]]에 따라 [[웹사이트는 어떻게 구성되어있나-HTML과 CSS와 Javascript의 이해|웹사이트를 구성]]하는 [[HTML]]과 [[CSS]] [[Javascript]]를 전달받고 이 파일들을 **브라우저가 이해하고 렌더링**하는 과정을 거쳐 눈에 보여지게 된다.\n\n## 브라우저의 렌더링 과정\n\n브라우저는 HTML 과 CSS를 바로 이해하지 못한다 따라서 이해하고 화면에 그릴 수 있도록 하는 일련의 과정을 거친다. 그리고 이 과정을 **Critical Rendering Path**라고 부른다.\n\n1. HTML 파싱과 DOM 생성\n\n   첫번째로 브라우져는 서버로 부터 받은 **HTML을 파싱하여 점진적으로 DOM(Document Object Model)을 생성**한다. 파싱 과정은 첫줄부터 순차적으로 진행된다\n\n2. CSS 파싱과 CSSOM 생성\n\n   파싱하는 도중 `\u003clink rel=\"stylesheet\"\u003e`태그를 만나면 CSS 파일을 요청하고 파싱하여 **CSSOM(CSS Object Model)을 생성**한다. CSS는 렌더링 차단 리소스로, HTML 파싱은 계속될 수 있지만 **최종 렌더링은 CSSOM이 완성될 때까지 지연**될 수 있다.\n\n3. Javascript 처리\n\n   HTML **파싱 중 `\u003cscript\u003e`태그를 만나면 HTML 파싱은 즉시 일시 중단**된다.스크립트 실행 전, 해당 스크립트 이전에 선언된 모든 CSS가 로드되고 파싱될 때까지 Javascript실행이 차단된다(Javascript가 CSSOM에 접근할 수 있기 때문). 이후 **Javascript 처리가 끝나면 HTML파싱이 중단된 시점부터 재게**된다. 하지만 **`defer`나 `async`속성이 있는 스크립트느 HTML파싱을 차단하지 않고 다른 방식으로 처리**된다.\n\n4. Render Tree 생성\n\n   HTML과 CSS 파싱은 둘 다 **점진적으로 진행**되며 DOM과 CSSOM이 생성되면 **두 트리를 결합하여 Render Tree를 생성**한다. 이때 화면에 표시되지 앟는 요소들을 배제한다(`display:none`적용된 요소, `\u003chead\u003e` 내의 요소 등).\n\n5. Layout\n\n이렇게 Render Tree 가 생성되면 Layout 단계를 거쳐 Render Tree의 노드와 그 관계되는 각 **요소들이 화면에 위치해야 하는 위치와 크기를 설정**한다.\n\n6. Paint\n\n   Paint 단계로 넘어가 Render Tree의 **각 노드를 화면에 그리게 된다**. 이때 색상, 이미지, 그림자 등 시각적 요소가 처리된다. 이 때 시각적 요소에 따라 필요하다면 여러 레이어들을 생성하게 된다.\n\n7. Compositing\n\n   생성된 여러 **레이어를 합성하여 최종 화면을 화면에 표시**한다. CSS 의 Z-index에 의해 쌓이는 순서가 결정된다. 이 레이어 합성은 주로 GPU를 활용하여 처리하여 에니메이션이나 전환 효과의 성능을 향상시킨다.\n\n이렇게 화면에 보여지는 웹사이트는 DOM과 CSSOM를 이용해 [[Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념|Javascript를 통해 조작]]이 가능해 진다.\n"])</script><script>self.__next_f.push([1,"2d:T1051,"])</script><script>self.__next_f.push([1,"\n# Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념\n\n웹사이트는 [[HTML]] 과 [[CSS]] 를 통해 기본적인 구조와 형태가 정해진다. 그리고 Javascript로 이 웹사이트를 조작할 수 있는데 그렇다고 해서 파일 자체를 수정할 순 없다.\n\n[[웹사이트는 어떻게 보여지는가-브라우저의 렌더링|렌더링]]이 필요한 이유가 어겨기에 있다고 생각해도 될것같다. 브라우져가 HTML과 CSS를 이해하고 프로그램화 하는 과정이 렌더링 과정이라고 생각된다.\n\n이 브라우저의 렌더링 과정중 브라우저가 Javascript를 통해 조작이 가능하도록 이해하고 인터페이스를 만드는 과정이 있는데 그것이 바로 파싱을 통해 [[DOM(Document Object Model)]]과 [[CSSOM(CSS Object Model)]]을 생성하는 과정이다.\n\n## DOM(Document Object Model)의 파싱\n\nDOM은 HTML 문서를 트리 구조로 표현한 것이다. 이 트리의 각 노드는 문서의 일부(요소, 속성, 텍스트 등)를 나타낸다. **DOM은 Javascript가 페이지상의 콘텐츠와 구저에 접근하고 조작할 수 있게 해주는 인터페이스 이다**.\n\nHTML이 파서를 통해 DOM의 트리를 구축 하는 과정은 다음과 같다.\n\n1. 바이트를 문자로 변환\n   HTML의 원시 데이터는 바이트로 이것을 문자로 변환하는 과정을 거친다.\n2. 토큰화\n   문자열이 HTML 명세에 따라 토큰(`\u003chtml\u003e`, `\u003cbody\u003e` 등)으로 변환된다.\n3. 노드 생성\n   각 토큰이 **속성과 규칙을 가진 객체(노드)로 변환**된다.\n4. DOM 트리 구축\n   노드들이 트리 구조로 연결되며 **부모-자식 간의 관계가 설정**되고 요소간의 계층 구조가 형성된다. 이는 루트(`document`)부터 모든 요소, 속성, 텍스트 노드까지 포함한다.\n\n## CSSOM(CSS Object Model)의 파싱\n\nCSSOM은 HTML 대신 **CSS를 트리 구조로 표현하고 조작하는 API 집합**이다. CSS 스타일 시트를 표현하는 객체 모델로 DOM과 유사하게 트리구조로 되어 있다.\n\nCSS가 파싱되어 CSSOM트리가 구축되는 과정은 다음과 같다.\n\n1. CSS로드\n   외부 스타일시트,`\u003cstyle\u003e`태그, 인라인 스타일 등에서 CSS 규칙을 로드한다.\n2. 토큰화\n   CSS 규칙을 토큰으로 변환한다.\n3. 노드 생성\n   각 CSS 규칙을 나타내는 노드를 생성한다.\n4. CSSOM 트리 구축\n   CSS 규칙이 계층적 트리 구조로 구성되고 **스타일 상속이 적용**된다(부모 요소의 스타일이 자식 요소에 상속). 명시성과 우선순위에 따라 스타일이 계산된다.\n\n## DOM에 접근하기\n\nDOM 은 여러가지의 object를 포함한다. `window`,`document`,`element`,`nodeList` 등이 대표적이며 각각의 object를 위한 인터페이스가 존재한다.\n\n대표적인 인터페이스는 다음과 같다.\n\n\u003e [!example]\n\u003e\n\u003e - `document.getElementById(id)`\n\u003e - `document.getElementsByTagName(name)`\n\u003e - `document.createElement(name)`\n\u003e - `parentNode.appendChild(node)`\n\u003e - `element.innerHTML`\n\u003e - `element.style.left`\n\u003e - `element.setAttribute`\n\u003e - `element.getAttribute`\n\u003e - `element.addEventListener`\n\u003e - `window.content`\n\u003e - `window.onload`\n\u003e - `window.dump`\n\u003e - `window.scrollTo`\n\n## 예시\n\n```js DOM 인터페이스 예시\nvar table = document.getElementById(\"table\");\nvar tableAttrs = table.attributes; // Node/Element interface\nfor (var i = 0; i \u003c tableAttrs.length; i++) {\n  // HTMLTableElement interface: border attribute\n  if (tableAttrs[i].nodeName.toLowerCase() == \"border\") table.border = \"1\";\n}\n// HTMLTableElement interface: summary attribute\ntable.summary = \"note: increased border\";\n```\n\n```js CSSOM 인터페이스 예시\nconst element = document.getElementById(\"myElement\");\nelement.style.color = \"blue\";\nelement.style.backgroundColor = \"#f0f0f0\";\nelement.style.fontSize = \"16px\";\n\n// 여러 속성을 한 번에 변경\nObject.assign(element.style, {\n  margin: \"10px\",\n  padding: \"5px\",\n  borderRadius: \"3px\",\n  transition: \"all 0.3s ease\",\n});\n\n// CSS 변수(CSS Custom Properties) 설정\nelement.style.setProperty(\"--main-color\", \"purple\");\n```\n"])</script><script>self.__next_f.push([1,"2e:Taa0,"])</script><script>self.__next_f.push([1,"웹사이트는 렌더링이 필요한 이유가 어겨기에 있다고 생각해도 될것같다. 브라우져가 HTML과 CSS를 이해하고 프로그램화 하는 과정이 렌더링 과정이라고 생각된다.\n이 브라우저의 렌더링 과정중 브라우저가 Javascript를 통해 조작이 가능하도록 이해하고 인터페이스를 만드는 과정이 있는데 그것이 바로 파싱을 통해 DOM(Document Object Model)]]과 [[CSSOM(CSS Object Model)을 생성하는 과정이다.\nDOM은 HTML 문서를 트리 구조로 표현한 것이다. 이 트리의 각 노드는 문서의 일부(요소, 속성, 텍스트 등)를 나타낸다. DOM은 Javascript가 페이지상의 콘텐츠와 구저에 접근하고 조작할 수 있게 해주는 인터페이스 이다.\nHTML이 파서를 통해 DOM의 트리를 구축 하는 과정은 다음과 같다.\n1. 바이트를 문자로 변환\nHTML의 원시 데이터는 바이트로 이것을 문자로 변환하는 과정을 거친다.\n2. 토큰화\n문자열이 HTML 명세에 따라 토큰(\u003chtml\u003e, \u003cbody\u003e 등)으로 변환된다.\n3. 노드 생성\n각 토큰이 속성과 규칙을 가진 객체(노드)로 변환된다.\n4. DOM 트리 구축\n노드들이 트리 구조로 연결되며 부모-자식 간의 관계가 설정되고 요소간의 계층 구조가 형성된다. 이는 루트(document)부터 모든 요소, 속성, 텍스트 노드까지 포함한다.\nCSSOM은 HTML 대신 CSS를 트리 구조로 표현하고 조작하는 API 집합이다. CSS 스타일 시트를 표현하는 객체 모델로 DOM과 유사하게 트리구조로 되어 있다.\nCSS가 파싱되어 CSSOM트리가 구축되는 과정은 다음과 같다.\n1. CSS로드\n외부 스타일시트,\u003cstyle\u003e태그, 인라인 스타일 등에서 CSS 규칙을 로드한다.\n2. 토큰화\nCSS 규칙을 토큰으로 변환한다.\n3. 노드 생성\n각 CSS 규칙을 나타내는 노드를 생성한다.\n4. CSSOM 트리 구축\nCSS 규칙이 계층적 트리 구조로 구성되고 스타일 상속이 적용된다(부모 요소의 스타일이 자식 요소에 상속). 명시성과 우선순위에 따라 스타일이 계산된다.\nDOM 은 여러가지의 object를 포함한다. window,document,element,nodeList 등이 대표적이며 각각의 object를 위한 인터페이스가 존재한다.\n대표적인 인터페이스는 다음과 같다.\n\u003e [!example]\n\u003e\n\u003e - document.getElementById(id)\n\u003e - document.getElementsByTagName(name)\n\u003e - document.createElement(name)\n\u003e - parentNode.appendChild(node)\n\u003e - element.innerHTML\n\u003e - element.style.left\n\u003e - element.setAttribute\n\u003e - element.getAttribute\n\u003e - element.addEventListener\n\u003e - window.content\n\u003e - window.onload\n\u003e - window.dump\n\u003e - window.scrollTo"])</script><script>self.__next_f.push([1,"2f:T10e5,"])</script><script>self.__next_f.push([1,"\n# React\n\n![1745108551-react.png](_assets/attachments/1745108551-react.png)\n\n리액트(React)는 Facebook(현재 Meta)에서 개발한 JavaScript 라이브러리로, 사용자 인터페이스(UI)를 구축하기 위해 설계되었다.\n\n## 핵심 개념\n\n1. 컴포넌트 기반 아키텍처\n\n   - 리엑트는 UI를 **독립적이고 재사용 가능한 조각**(컴포넌트)으로 나눈다.\n   - 각 컴포넌트는 **자체 상태와 렌더링 로직**을 가질 수 있다.\n   - 이를 통해 복잡한 UI를 **관리하기 쉬운 작은 부분**으로 분리할 수 있다.\n\n2. 가상 DOM(Virtual DOM)\n\n   - 실제 DOM을 직접 조작하는 대신 가상 DOM을 사용한다.\n   - 변경사항이 있을 때 전체 UI를 다시 그리는 대신, **리엑트는 가상 DOM에서 변경된 부분만 식별하여 실제 DOM에 효율적으로 업데이트한다.**\n   - 이 과정을 '**재조정(Reconciliation)**'이라고 한다.\n\n3. 단방향 데이터 흐름(One-way Data Flow)\n\n   - 데이터는 상위 컴포넌트에서 하위 컴포넌트로 한 방향으로만 흐른다.(Props)\n   - 이 방식은 애플리케이션의 **상태 변화를 예측 가능하게 만들고 디버깅을 용이**하게 한다.\n\n4. JSX(JavaScript XML)\n\n   - JavaScript 코드 안에 HTML과 유사한 마크업을 작성할 수 있는 문법이다.\n   - 컴포넌트의 구조와 동작을 동일한 파일에서 정의할 수 있게 해준다.\n\n   ```jsx\n   function Welcome() {\n     return \u003ch1\u003e안녕하세요!\u003c/h1\u003e;\n   }\n   ```\n\n5. 상태(State)와 생명주기(Lifecycle)\n\n   - 컴포넌트는 내부 상태를 가질 수 있으며, 이 상태가 변경되면 컴포넌트가 다시 렌더링 된다.\n   - 함수형 컴포넌트에서는 Hook(`useState`, `useEffect` 등)을 통해 상태와 생명주기 기능을 사용한다.\n   - 클래스 컴포넌트에서는 `this.state`와 생명주기 메서드를 사용한다.\n\n## React의 장단점\n\n### 장점\n\n1. 선언적 프로그래밍\n\n   - 원하는 UI상태를 선언하면 리엑트가 DOM을 그에 맞게 업데이트햔다.\n   - 명령형으로 DOM을 직접 조작하는 것보다 코드가 간결하고 이해하기 쉽다.\n\n2. 컴포넌트 재사용성\n\n   - 한 번 작성한 컴포넌트는 여러곳에서 재사용할 수 있다.\n   - 개발 시간을 단축하고 일관된 UI를 유지하는 데 도움이 된다.\n\n3. 커뮤니티와 생태계\n\n   - 풍부한 라이브러리, 도구, 확장 프로그램이 있어 다양한 기능을 쉽게 구현할 수 있다.\n\n4. 성능 최적화\n   - 가상 DOM과 효율적인 렌더링 알고리즘을 통해 높은 성능을 제공한다.\n\n### 단점\n\n1. 가파른 학습 곡선\n\n   - JSX, 가상 DOM, 컴포넌트 라이프사이클, Hook 등 새로운 개념을 이해해야 한다.\n\n2. 부분적인 라이브러리\n\n   - 리엑트는 UI 인터페이스를 위한 라이브러리 일 뿐, 완전한 프레임워크가 아니다.\n   - 라우팅, 상태관리, API통신 등을 위해 추가 라이브러리가 필요하다.\n   - 이로 인해 프로젝트 설정 과정이 복잡해질 수 있다.\n\n3. 높은 번들 크기\n\n   - 기본 리엑트 라이브러리 자체가 다소 큰 편이다.\n   - 추가 라이브러리와 함께 사용하면 최종 번들 크기가 커져 초기 로딩 시간이 길어질 수 있다.\n\n4. SEO 문제\n   - 전통적인 클라이언트 사이드 렌더링은 검색 엔진 최적화에 불리할 수 있다.\n   - 이를 해결하기 위해 SSR(서버 사이드 렌더링)구현이 필요한데, 이는 Next.js와 같은 추가 프레임워크나 복잡한 설정이 요구된다.\n\n## 관련 노트\n\n- [[flux 패턴이란]]\n- [[엘리먼트와 컴포넌트의 차이]]\n- [[props와 state]]\n- [[Props Drilling 이란 무엇인가]]\n- [[자식컴포넌트에서 부모컴포넌트로 데이터 전달하기]]\n- [[가상DOM의 원리]]\n- [[React의 상태관리]]\n- [[리엑트 함수형 컴포넌트의 생명주기]]\n- [[useRef란 무엇인가]]\n- [[useEffect와 useLayoutEffect]]\n- [[useCallback과 useMemo]]\n- [[react-query]]\n- [[portal이란 무엇인가]]\n- [[hook이란 무엇인가]]\n- [[suspense란 무엇인가]]\n- [[서버 컴포넌트란 무엇인가]]\n- [[Key Props란 무엇인가]]\n- [[고차 컴포넌트(Higher-Order Components)란 무엇인가]]\n- [[CSR vs SSR vs SSG]]\n"])</script><script>self.__next_f.push([1,"30:Tf06,"])</script><script>self.__next_f.push([1,"리액트(React)는 Facebook(현재 Meta)에서 개발한 JavaScript 라이브러리로, 사용자 인터페이스(UI)를 구축하기 위해 설계되었다.\n1. 컴포넌트 기반 아키텍처\n리엑트는 UI를 독립적이고 재사용 가능한 조각(컴포넌트)으로 나눈다.\n각 컴포넌트는 자체 상태와 렌더링 로직을 가질 수 있다.\n이를 통해 복잡한 UI를 관리하기 쉬운 작은 부분으로 분리할 수 있다.\n2. 가상 DOM(Virtual DOM)\n실제 DOM을 직접 조작하는 대신 가상 DOM을 사용한다.\n변경사항이 있을 때 전체 UI를 다시 그리는 대신, 리엑트는 가상 DOM에서 변경된 부분만 식별하여 실제 DOM에 효율적으로 업데이트한다.\n이 과정을 '재조정(Reconciliation)'이라고 한다.\n3. 단방향 데이터 흐름(One-way Data Flow)\n데이터는 상위 컴포넌트에서 하위 컴포넌트로 한 방향으로만 흐른다.(Props)\n이 방식은 애플리케이션의 상태 변화를 예측 가능하게 만들고 디버깅을 용이하게 한다.\n4. JSX(JavaScript XML)\nJavaScript 코드 안에 HTML과 유사한 마크업을 작성할 수 있는 문법이다.\n컴포넌트의 구조와 동작을 동일한 파일에서 정의할 수 있게 해준다.\n5. 상태(State)와 생명주기(Lifecycle)\n컴포넌트는 내부 상태를 가질 수 있으며, 이 상태가 변경되면 컴포넌트가 다시 렌더링 된다.\n함수형 컴포넌트에서는 Hook(useState, useEffect 등)을 통해 상태와 생명주기 기능을 사용한다.\n클래스 컴포넌트에서는 this.state와 생명주기 메서드를 사용한다.\n1. 선언적 프로그래밍\n원하는 UI상태를 선언하면 리엑트가 DOM을 그에 맞게 업데이트햔다.\n명령형으로 DOM을 직접 조작하는 것보다 코드가 간결하고 이해하기 쉽다.\n2. 컴포넌트 재사용성\n한 번 작성한 컴포넌트는 여러곳에서 재사용할 수 있다.\n개발 시간을 단축하고 일관된 UI를 유지하는 데 도움이 된다.\n3. 커뮤니티와 생태계\n풍부한 라이브러리, 도구, 확장 프로그램이 있어 다양한 기능을 쉽게 구현할 수 있다.\n4. 성능 최적화\n가상 DOM과 효율적인 렌더링 알고리즘을 통해 높은 성능을 제공한다.\n1. 가파른 학습 곡선\nJSX, 가상 DOM, 컴포넌트 라이프사이클, Hook 등 새로운 개념을 이해해야 한다.\n2. 부분적인 라이브러리\n리엑트는 UI 인터페이스를 위한 라이브러리 일 뿐, 완전한 프레임워크가 아니다.\n라우팅, 상태관리, API통신 등을 위해 추가 라이브러리가 필요하다.\n이로 인해 프로젝트 설정 과정이 복잡해질 수 있다.\n3. 높은 번들 크기\n기본 리엑트 라이브러리 자체가 다소 큰 편이다.\n추가 라이브러리와 함께 사용하면 최종 번들 크기가 커져 초기 로딩 시간이 길어질 수 있다.\n4. SEO 문제\n전통적인 클라이언트 사이드 렌더링은 검색 엔진 최적화에 불리할 수 있다.\n이를 해결하기 위해 SSR(서버 사이드 렌더링)구현이 필요한데, 이는 Next.js와 같은 추가 프레임워크나 복잡한 설정이 요구된다.\nflux 패턴이란]]\n[[엘리먼트와 컴포넌트의 차이]]\n[[props와 state]]\n[[Props Drilling 이란 무엇인가]]\n[[자식컴포넌트에서 부모컴포넌트로 데이터 전달하기]]\n[[가상DOM의 원리]]\n[[React의 상태관리]]\n[[리엑트 함수형 컴포넌트의 생명주기]]\n[[useRef란 무엇인가]]\n[[useEffect와 useLayoutEffect]]\n[[useCallback과 useMemo]]\n[[react-query]]\n[[portal이란 무엇인가]]\n[[hook이란 무엇인가]]\n[[suspense란 무엇인가]]\n[[서버 컴포넌트란 무엇인가]]\n[[Key Props란 무엇인가]]\n[[고차 컴포넌트(Higher-Order Components)란 무엇인가]]\n[[CSR vs SSR vs SSG"])</script><script>self.__next_f.push([1,"31:T3d3c,"])</script><script>self.__next_f.push([1,"\n# 물류 서비스 웹사이트 개발 회고-혼자서 외주 프로젝트 완성하기\n\n## 프로젝트 개요\n\n이번 프로젝트는 물류 서비스 회사인 '아임유어박스'의 웹사이트를 개발하는 외주 작업이었습니다. 기존 사이트의 여러 문제점을 개선하고 현대적인 기술 스택으로 재구축하는 것이 주요 목표였습니다.\n\n![메인 화면](_assets/attachments/imyourbox/imyourbox-main.gif)\n\n## 기술 스택 선택과 구현 과정에서의 도전\n\n### 1. PayloadCMS 도입과 설정\n\n#### 헤드리스 CMS 선택의 이유와 도전\n\n웹사이트를 개발하면서 가장 큰 결정 중 하나는 헤드리스 CMS 선택이었습니다. 클라이언트가 뉴스, 공지사항, 채용정보 등의 콘텐츠를 직접 관리할 수 있어야 했기 때문입니다.\n\n```typescript\n// payload.config.ts - 프로젝트의 핵심 설정 파일\nexport default buildConfig({\n  admin: {\n    user: Users.slug,\n    importMap: {\n      baseDir: path.resolve(dirname),\n    },\n    dependencies: {\n      ExportInquiries: {\n        path: \"@/components/ExportInquiries\",\n        type: \"component\",\n      },\n    },\n  },\n  collections: [Users, Media, News, History, Inquiries, Notices, Locations],\n  editor: lexicalEditor(),\n  db: postgresAdapter({\n    pool: {\n      connectionString: process.env.DATABASE_URI || \"\",\n    },\n  }),\n  plugins: [\n    payloadCloudPlugin(),\n    s3Storage({\n      // S3 설정...\n    }),\n  ],\n});\n```\n\nPayloadCMS를 처음 도입할 때는 문서가 제한적이었고, 특히 복잡한 요구사항을 구현하는 과정에서 많은 시행착오가 있었습니다. 예를 들어, 컬렉션 간의 관계 설정이나 커스텀 필드 타입 구현에서 TypeScript 오류가 자주 발생했습니다.\n\n특히 어려웠던 점은:\n\n- 데이터 모델링과 스키마 설계\n- 관리자 패널 커스터마이징\n- 프론트엔드와 백엔드 통합\n\n하지만 이런 초기 어려움을 극복한 후에는 PayloadCMS의 강력한 기능과 유연성이 개발 속도를 크게 향상시켰습니다.\n\n![페이로드 대시보드](_assets/attachments/imyourbox/imyourbox-payload-admin-dashboard.png)\nPayloadCMS의 관리자 인터페이스에 커스텀 기능을 추가하는 과정은 문서의 부재로 인해 특히 어려웠습니다. 문의 내역을 CSV로 내보내는 기능을 구현하기 위해 많은 시간을 투자했습니다.\n\n```tsx\n// ExportInquiries.tsx\nimport React, { useState } from \"react\";\nimport { Button } from \"payload/components/elements\";\nimport { useConfig } from \"payload/components/utilities\";\nimport { stringify } from \"csv-stringify/sync\";\n\nconst ExportInquiries: React.FC = () =\u003e {\n  const [isExporting, setIsExporting] = useState(false);\n  const { serverURL } = useConfig();\n\n  const handleExport = async () =\u003e {\n    try {\n      setIsExporting(true);\n\n      // API 호출을 통한 데이터 가져오기\n      const response = await fetch(`${serverURL}/api/inquiries?limit=500`);\n      const json = await response.json();\n\n      // CSV 변환 및 다운로드 로직\n      const csvData = stringify(\n        json.docs.map((doc) =\u003e ({\n          업체명: doc.companyName,\n          연락처: doc.phone,\n          담당자: doc.managerName,\n          이메일: doc.email,\n          접수일: new Date(doc.createdAt).toLocaleDateString(\"ko-KR\"),\n          문의유형: doc.inquiryType === \"price\" ? \"견적문의\" : \"일반문의\",\n          문의내용: doc.content,\n        })),\n        { header: true },\n      );\n\n      // 다운로드 처리\n      const blob = new Blob([csvData], { type: \"text/csv;charset=utf-8;\" });\n      const url = URL.createObjectURL(blob);\n      const link = document.createElement(\"a\");\n      link.setAttribute(\"href\", url);\n      link.setAttribute(\n        \"download\",\n        `문의-내역-${new Date().toISOString().slice(0, 10)}.csv`,\n      );\n      link.style.visibility = \"hidden\";\n      document.body.appendChild(link);\n      link.click();\n      document.body.removeChild(link);\n    } catch (error) {\n      console.error(\"Export failed:\", error);\n      alert(\n        \"내보내기 실패: \" +\n          (error instanceof Error ? error.message : \"알 수 없는 오류\"),\n      );\n    } finally {\n      setIsExporting(false);\n    }\n  };\n\n  return (\n    \u003cButton onClick={handleExport} disabled={isExporting}\u003e\n      {isExporting ? \"내보내는 중...\" : \"CSV 내보내기\"}\n    \u003c/Button\u003e\n  );\n};\n\nexport default ExportInquiries;\n```\n\n이 기능을 구현하기 위해 다음과 같은 도전 과제가 있었습니다:\n\n1. **PayloadCMS Admin 컴포넌트 확장**: PayloadCMS의 관리자 UI에 커스텀 버튼을 추가하는 방법이 직관적이지 않았습니다. 결국 소스 코드를 분석하고 커뮤니티 포럼에서 해결책을 찾았습니다.\n\n2. **대용량 데이터 처리**: 문의 데이터가 많아질 경우를 대비하여 페이지네이션 기반으로 데이터를 가져오고 스트리밍 방식으로 처리하는 로직을 구현해야 했습니다.\n\n3. **문자 인코딩 문제**: 한글이 포함된 CSV 파일이 Excel에서 정상적으로 열리도록 하는 인코딩 처리가 필요했습니다.\n\n이런 어려움을 해결한 후에는 클라이언트가 쉽게 데이터를 관리하고 분석할 수 있게 되었습니다. 이 과정에서 PayloadCMS의 내부 구조를 더 깊이 이해하게 되었고, 이는 추후 다른 커스텀 기능 개발에도 큰 도움이 되었습니다.\n\n\u003c!-- 이미지 3: 커스텀 CSV Export 버튼이 있는 문의 내역 관리 화면 - 실제 문의 데이터 목록과 상단에 구현한 내보내기 버튼이 보이도록 캡처 --\u003e\n\n![CSV export](_assets/attachments/imyourbox/imyourbox-csv-example.gif)\n\n### 3. 이메일 시스템 구현\n\n견적 문의나 일반 문의가 접수되면 관리자에게 이메일로 알림을 보내는 기능을 구현하는 과정도 많은 도전이 있었습니다.\n![이메일 문의 프로세스](_assets/attachments/imyourbox/imyourbox-email-process.gif)\n\n```typescript\n// app/(app)/api/contact/route.ts\nimport { NextResponse } from \"next/server\";\nimport nodemailer from \"nodemailer\";\nimport { render } from \"@react-email/render\";\nimport { InquiryEmail } from \"@/emails/inquiry-email\";\n\nexport async function POST(req: Request) {\n  try {\n    // 환경 변수 검증\n    if (!process.env.SMTP_FROM_EMAIL || !process.env.SMTP_TO_EMAIL) {\n      throw new Error(\"이메일 주소 설정이 누락되었습니다.\");\n    }\n\n    const body = await req.json();\n    const transporter = createTransporter();\n\n    // SMTP 연결 확인\n    try {\n      await Promise.race([\n        transporter.verify(),\n        new Promise((_, reject) =\u003e\n          setTimeout(() =\u003e reject(new Error(\"SMTP 연결 시간 초과\")), 5000),\n        ),\n      ]);\n    } catch (verifyError) {\n      console.error(\"SMTP verification failed:\", verifyError);\n      throw new Error(\"SMTP 연결 실패\");\n    }\n\n    // 이메일 템플릿 렌더링\n    const emailHtml = await render(\n      InquiryEmail({\n        companyName: body.companyName,\n        phone: body.phone,\n        email: body.email,\n        managerName: body.managerName,\n        content: body.content,\n      }),\n    );\n\n    // 이메일 전송\n    try {\n      await Promise.race([\n        transporter.sendMail({\n          from: process.env.SMTP_FROM_EMAIL,\n          to: process.env.SMTP_TO_EMAIL,\n          subject: `[간편문의] ${body.companyName} - ${body.managerName}`,\n          html: emailHtml,\n        }),\n        new Promise((_, reject) =\u003e\n          setTimeout(() =\u003e reject(new Error(\"이메일 전송 시간 초과\")), 10000),\n        ),\n      ]);\n    } catch (sendError) {\n      console.error(\"Email send error:\", sendError);\n      throw new Error(\"이메일 전송 실패\");\n    }\n\n    return NextResponse.json(\n      { message: \"문의가 성공적으로 접수되었습니다.\" },\n      { status: 200 },\n    );\n  } catch (error) {\n    console.error(\"Error:\", error);\n    return NextResponse.json(\n      { message: \"문의 접수 중 오류가 발생했습니다.\" },\n      { status: 500 },\n    );\n  }\n}\n```\n\n주요 도전 과제:\n\n1. **이메일 템플릿 관리**: React Email을 사용하여 컴포넌트 기반의 이메일 템플릿을 구현했지만, 다양한 이메일 클라이언트에서 일관되게 표시되도록 하는 것이 어려웠습니다.\n\n2. **SMTP 오류 처리**: 프로덕션 환경에서 간헐적으로 SMTP 연결 문제가 발생했습니다. 이를 해결하기 위해 타임아웃 처리와 재시도 로직을 구현했습니다.\n\n3. **개발-프로덕션 환경 차이**: 개발 중에는 실제 이메일을 보내지 않고 로컬에서 테스트할 수 있는 방법이 필요했습니다. 이를 위해 환경에 따른 조건부 로직을 구현했습니다.\n\n이러한 도전을 해결하면서 견고한 이메일 시스템을 구축할 수 있었고, 클라이언트의 비즈니스 프로세스 개선에 크게 기여했습니다.\n\n![이메일 템플릿](_assets/attachments/imyourbox/imyourbox-email-template.png)\n\n### 4. Supabase를 활용한 미디어 관리\n\nPayloadCMS의 미디어 관리 시스템을 Supabase Storage와 통합하는 과정도 복잡했습니다.\n\n```typescript\n// Supabase 스토리지 설정\nimport { createClient } from \"@supabase/supabase-js\";\n\nconst supabase = createClient(\n  process.env.SUPABASE_URL || \"\",\n  process.env.SUPABASE_ANON_KEY || \"\",\n);\n\n// PayloadCMS와 Supabase Storage 통합\nconst supabaseStorage = {\n  collections: {\n    media: {\n      adapter: {\n        upload: async ({ file, filename }) =\u003e {\n          const { data, error } = await supabase.storage\n            .from(\"media\")\n            .upload(`public/${filename}`, file, {\n              cacheControl: \"3600\",\n              upsert: false,\n            });\n\n          if (error) throw error;\n          return `${process.env.SUPABASE_URL}/storage/v1/object/public/media/public/${filename}`;\n        },\n        // 기타 필요한 메서드...\n      },\n    },\n  },\n};\n```\n\n미디어 관리 시스템 구현에서 다음과 같은 도전 과제가 있었습니다:\n\n1. **Supabase Storage 정책 설정**: Supabase Storage에 적절한 접근 정책을 설정하여 이미지 업로드와 접근 권한을 관리해야 했습니다. 처음에는 정책 설정에 대한 이해 부족으로 업로드가 실패하는 문제가 있었습니다.\n\n2. **이미지 최적화**: 웹사이트 성능을 위해 업로드된 이미지를 자동으로 최적화하는 시스템을 구현했습니다. Sharp 라이브러리를 통합하여 다양한 크기의 이미지 버전을 생성했습니다.\n\n3. **로컬-프로덕션 환경 차이**: 개발 환경과 프로덕션 환경에서 Supabase 설정을 일관되게 유지하는 것이 중요했습니다. 환경 변수 관리와 개발용 Supabase 프로젝트를 따로 설정하여 이를 해결했습니다.\n\n이런 노력 덕분에 웹사이트의 이미지와 미디어 파일이 효율적으로 관리되고, 페이지 로딩 속도도 최적화할 수 있었습니다.\n\n![s3 버킷 관리](_assets/attachments/imyourbox/s3-media-management.png.png)\n\n## 웹사이트 디자인과 구현\n\n웹사이트는 현대적이고 사용자 친화적인 디자인으로 구현되었습니다:\n\n![서비스 소개페이지](_assets/attachments/imyourbox/service-page-overview.png)\n\n1. **반응형 네비게이션**: 모바일과 데스크톱 모두에서 최적화된 네비게이션 바\n2. **패럴랙스 스크롤 효과**: 메인 페이지의 시각적 효과를 위한 패럴랙스 스크롤 구현\n3. **견적 계산기**: 사용자가 쉽게 서비스 견적을 계산할 수 있는 단계별 폼\n4. **서비스 소개 페이지**: 아이콘과 설명을 통해 서비스를 명확하게 소개\n\n각 페이지별로 사용자 경험을 최우선으로 고려하여 디자인과 기능을 구현했습니다:\n\n1. **메인 페이지**: 패럴랙스 스크롤 효과와 애니메이션을 통한 시각적 매력 향상\n\n   ![패러랠 이펙트](_assets/attachments/imyourbox/imyourweb-parallax.gif)\n\n2. **견적 페이지**: 단계별 폼을 통한 사용자 친화적인 견적 계산 시스템\n\n   - 기본 정보\n     ![price-calculator-step1.png](_assets/attachments/imyourbox/price-calculator-step1.png)\n\n   - 상품 정보\n     ![price-calculator-stop2](_assets/attachments/imyourbox/price-calculator-step2.png)\n   - 견적 결과\n     ![price-calculator-step3.png](_assets/attachments/imyourbox/price-calculator-step3.png)\n\n3. **서비스 소개 페이지**: 명확한 아이콘과 설명을 통한 서비스 이해도 향상\n   ![service-icons-grid.png](_assets/attachments/imyourbox/service-icons-grid.png)\n\n4. **회사 소개 페이지**: 타임라인 형식의 회사 연혁과 핵심 가치 전달\n   ![company-timeline](_assets/attachments/imyourbox/imyourweb-company-timeline.gif)\n\n5. **채용 정보 페이지**: 회사 문화와 채용 프로세스, 현재 채용 중인 포지션 표시\n   ![imyourweb-employment](_assets/attachments/imyourbox/imyourweb-employment.png)\n\n이런 디자인 요소들은 Framer Motion과 TailwindCSS를 활용하여 구현되었으며, 사용자 경험을 최우선으로 고려했습니다.\n\n- 데스크톱\n  ![desktop-design](_assets/attachments/imyourbox/desktop-design.png)\n\n- 모바일\n  ![mobild-design](_assets/attachments/imyourbox/mobild-design.png)\n\n- 모바일 메뉴\n  ![mobile-menu-expanded.png](_assets/attachments/imyourbox/mobile-menu-expanded.png)\n\n## 학습 및 성과\n\n이 프로젝트를 통해 풀스택 개발자로서 많은 성장을 경험했습니다:\n\n1. **헤드리스 CMS 전문성**: PayloadCMS의 복잡한 설정과 커스터마이징에 대한 깊은 이해\n2. **서버리스 아키텍처**: Next.js와 API 라우트를 활용한 서버리스 아키텍처 구현\n3. **클라우드 서비스 통합**: Supabase DB와 Storage 같은 클라우드 서비스와의 효율적인 통합\n4. **성능 최적화**: 이미지 최적화, 코드 스플리팅, 레이지 로딩 등을 통한 웹사이트 성능 향상\n\n특히, PayloadCMS와 같은 상대적으로 덜 알려진 기술을 도입하면서 문서가 부족한 상황에서도 문제를 해결하는 능력이 크게 향상되었습니다. 소스 코드 분석, 커뮤니티 포럼 활용, 그리고 실험적 접근을 통해 다양한 기술적 도전을 극복했습니다.\n\n## 개선 가능한 부분\n\n프로젝트를 성공적으로 완료했지만, 추후 개선할 수 있는 부분도 있습니다:\n\n1. **테스트 자동화**: 단위 테스트와 E2E 테스트를 추가하여 코드 품질 보장\n2. **접근성 개선**: 웹 접근성 지침에 따른 더 포괄적인 사용자 경험 제공\n3. **성능 모니터링**: 실시간 성능 모니터링 도구 통합으로 지속적인 최적화\n4. **국제화 지원**: 다국어 지원을 위한 i18n 통합\n\n## 결론\n\n아임유어박스 웹사이트 개발은 새로운 기술 스택과 복잡한 요구사항을 다루는 도전적인 프로젝트였습니다. PayloadCMS, Next.js, Supabase 등 여러 기술을 통합하면서 많은 기술적 문제를 해결했고, 이 과정에서 풀스택 개발자로서 크게 성장할 수 있었습니다.\n\n특히 PayloadCMS의 커스터마이징, 견적 계산 시스템 구현, 이메일 통합, 그리고 Supabase 기반 미디어 관리 시스템 등을 성공적으로 구현하여 클라이언트의 비즈니스 요구사항을 충족시켰습니다. 이 프로젝트는 기술적 도전을 넘어 실제 비즈니스 가치를 창출하는 웹 애플리케이션을 구축하는 소중한 경험이었습니다.\n"])</script><script>self.__next_f.push([1,"32:T1f66,"])</script><script>self.__next_f.push([1,"이번 프로젝트는 물류 서비스 회사인 '아임유어박스'의 웹사이트를 개발하는 외주 작업이었습니다. 기존 사이트의 여러 문제점을 개선하고 현대적인 기술 스택으로 재구축하는 것이 주요 목표였습니다.\n웹사이트를 개발하면서 가장 큰 결정 중 하나는 헤드리스 CMS 선택이었습니다. 클라이언트가 뉴스, 공지사항, 채용정보 등의 콘텐츠를 직접 관리할 수 있어야 했기 때문입니다.\nPayloadCMS를 처음 도입할 때는 문서가 제한적이었고, 특히 복잡한 요구사항을 구현하는 과정에서 많은 시행착오가 있었습니다. 예를 들어, 컬렉션 간의 관계 설정이나 커스텀 필드 타입 구현에서 TypeScript 오류가 자주 발생했습니다.\n특히 어려웠던 점은:\n데이터 모델링과 스키마 설계\n관리자 패널 커스터마이징\n프론트엔드와 백엔드 통합\n하지만 이런 초기 어려움을 극복한 후에는 PayloadCMS의 강력한 기능과 유연성이 개발 속도를 크게 향상시켰습니다.\nPayloadCMS의 관리자 인터페이스에 커스텀 기능을 추가하는 과정은 문서의 부재로 인해 특히 어려웠습니다. 문의 내역을 CSV로 내보내는 기능을 구현하기 위해 많은 시간을 투자했습니다.\n이 기능을 구현하기 위해 다음과 같은 도전 과제가 있었습니다:\n1. PayloadCMS Admin 컴포넌트 확장: PayloadCMS의 관리자 UI에 커스텀 버튼을 추가하는 방법이 직관적이지 않았습니다. 결국 소스 코드를 분석하고 커뮤니티 포럼에서 해결책을 찾았습니다.\n2. 대용량 데이터 처리: 문의 데이터가 많아질 경우를 대비하여 페이지네이션 기반으로 데이터를 가져오고 스트리밍 방식으로 처리하는 로직을 구현해야 했습니다.\n3. 문자 인코딩 문제: 한글이 포함된 CSV 파일이 Excel에서 정상적으로 열리도록 하는 인코딩 처리가 필요했습니다.\n이런 어려움을 해결한 후에는 클라이언트가 쉽게 데이터를 관리하고 분석할 수 있게 되었습니다. 이 과정에서 PayloadCMS의 내부 구조를 더 깊이 이해하게 되었고, 이는 추후 다른 커스텀 기능 개발에도 큰 도움이 되었습니다.\n\u003c!-- 이미지 3: 커스텀 CSV Export 버튼이 있는 문의 내역 관리 화면 - 실제 문의 데이터 목록과 상단에 구현한 내보내기 버튼이 보이도록 캡처 --\u003e\n견적 문의나 일반 문의가 접수되면 관리자에게 이메일로 알림을 보내는 기능을 구현하는 과정도 많은 도전이 있었습니다.\n주요 도전 과제:\n1. 이메일 템플릿 관리: React Email을 사용하여 컴포넌트 기반의 이메일 템플릿을 구현했지만, 다양한 이메일 클라이언트에서 일관되게 표시되도록 하는 것이 어려웠습니다.\n2. SMTP 오류 처리: 프로덕션 환경에서 간헐적으로 SMTP 연결 문제가 발생했습니다. 이를 해결하기 위해 타임아웃 처리와 재시도 로직을 구현했습니다.\n3. 개발-프로덕션 환경 차이: 개발 중에는 실제 이메일을 보내지 않고 로컬에서 테스트할 수 있는 방법이 필요했습니다. 이를 위해 환경에 따른 조건부 로직을 구현했습니다.\n이러한 도전을 해결하면서 견고한 이메일 시스템을 구축할 수 있었고, 클라이언트의 비즈니스 프로세스 개선에 크게 기여했습니다.\nPayloadCMS의 미디어 관리 시스템을 Supabase Storage와 통합하는 과정도 복잡했습니다.\n미디어 관리 시스템 구현에서 다음과 같은 도전 과제가 있었습니다:\n1. Supabase Storage 정책 설정: Supabase Storage에 적절한 접근 정책을 설정하여 이미지 업로드와 접근 권한을 관리해야 했습니다. 처음에는 정책 설정에 대한 이해 부족으로 업로드가 실패하는 문제가 있었습니다.\n2. 이미지 최적화: 웹사이트 성능을 위해 업로드된 이미지를 자동으로 최적화하는 시스템을 구현했습니다. Sharp 라이브러리를 통합하여 다양한 크기의 이미지 버전을 생성했습니다.\n3. 로컬-프로덕션 환경 차이: 개발 환경과 프로덕션 환경에서 Supabase 설정을 일관되게 유지하는 것이 중요했습니다. 환경 변수 관리와 개발용 Supabase 프로젝트를 따로 설정하여 이를 해결했습니다.\n이런 노력 덕분에 웹사이트의 이미지와 미디어 파일이 효율적으로 관리되고, 페이지 로딩 속도도 최적화할 수 있었습니다.\n웹사이트는 현대적이고 사용자 친화적인 디자인으로 구현되었습니다:\n1. 반응형 네비게이션: 모바일과 데스크톱 모두에서 최적화된 네비게이션 바\n2. 패럴랙스 스크롤 효과: 메인 페이지의 시각적 효과를 위한 패럴랙스 스크롤 구현\n3. 견적 계산기: 사용자가 쉽게 서비스 견적을 계산할 수 있는 단계별 폼\n4. 서비스 소개 페이지: 아이콘과 설명을 통해 서비스를 명확하게 소개\n각 페이지별로 사용자 경험을 최우선으로 고려하여 디자인과 기능을 구현했습니다:\n1. 메인 페이지: 패럴랙스 스크롤 효과와 애니메이션을 통한 시각적 매력 향상\n2. 견적 페이지: 단계별 폼을 통한 사용자 친화적인 견적 계산 시스템\n기본 정보\n상품 정보\n견적 결과\n3. 서비스 소개 페이지: 명확한 아이콘과 설명을 통한 서비스 이해도 향상\n4. 회사 소개 페이지: 타임라인 형식의 회사 연혁과 핵심 가치 전달\n5. 채용 정보 페이지: 회사 문화와 채용 프로세스, 현재 채용 중인 포지션 표시\n이런 디자인 요소들은 Framer Motion과 TailwindCSS를 활용하여 구현되었으며, 사용자 경험을 최우선으로 고려했습니다.\n데스크톱\n모바일\n모바일 메뉴\n이 프로젝트를 통해 풀스택 개발자로서 많은 성장을 경험했습니다:\n1. 헤드리스 CMS 전문성: PayloadCMS의 복잡한 설정과 커스터마이징에 대한 깊은 이해\n2. 서버리스 아키텍처: Next.js와 API 라우트를 활용한 서버리스 아키텍처 구현\n3. 클라우드 서비스 통합: Supabase DB와 Storage 같은 클라우드 서비스와의 효율적인 통합\n4. 성능 최적화: 이미지 최적화, 코드 스플리팅, 레이지 로딩 등을 통한 웹사이트 성능 향상\n특히, PayloadCMS와 같은 상대적으로 덜 알려진 기술을 도입하면서 문서가 부족한 상황에서도 문제를 해결하는 능력이 크게 향상되었습니다. 소스 코드 분석, 커뮤니티 포럼 활용, 그리고 실험적 접근을 통해 다양한 기술적 도전을 극복했습니다.\n프로젝트를 성공적으로 완료했지만, 추후 개선할 수 있는 부분도 있습니다:\n1. 테스트 자동화: 단위 테스트와 E2E 테스트를 추가하여 코드 품질 보장\n2. 접근성 개선: 웹 접근성 지침에 따른 더 포괄적인 사용자 경험 제공\n3. 성능 모니터링: 실시간 성능 모니터링 도구 통합으로 지속적인 최적화\n4. 국제화 지원: 다국어 지원을 위한 i18n 통합\n아임유어박스 웹사이트 개발은 새로운 기술 스택과 복잡한 요구사항을 다루는 도전적인 프로젝트였습니다. PayloadCMS, Next.js, Supabase 등 여러 기술을 통합하면서 많은 기술적 문제를 해결했고, 이 과정에서 풀스택 개발자로서 크게 성장할 수 있었습니다.\n특히 PayloadCMS의 커스터마이징, 견적 계산 시스템 구현, 이메일 통합, 그리고 Supabase 기반 미디어 관리 시스템 등을 성공적으로 구현하여 클라이언트의 비즈니스 요구사항을 충족시켰습니다. 이 프로젝트는 기술적 도전을 넘어 실제 비즈니스 가치를 창출하는 웹 애플리케이션을 구축하는 소중한 경험이었습니다."])</script><script>self.__next_f.push([1,"33:T2aca,"])</script><script>self.__next_f.push([1,"\n# 크롬 확장프로그램에 케시메모리 추가하기\n\n크롬 확장 프로그램을 통해 [[LazyTrading|트레이딩 도구]]를 개발하는 도중, 한 가지 큰 문제가 있었다.\n\n## 문제 상황\n\n크롬 확장 프로그램은 일반 앱처럼 보이지만, 사용자가 팝업 창이나 사이드바를 닫으면 확장 프로그램의 세션이 완전히 종료된다. 이로 인해 사용자가 입력했던 데이터나 현재 보고 있던 화면 위치가 저장되지 않고, 재접속 시 항상 처음 화면으로 돌아가게 된다.\n멀티태스킹 환경에서 트레이더들은 확장 프로그램을 수시로 열고 닫아야 하는데, 매번 처음부터 시작해야 하는 것은 큰 불편함이었다.\n\n## 해결 방안\n\n문제를 해결의 목표를 단순하게 정리하면 다음과 같다\n\n\u003e [!goal]\n\u003e 크롬 확장프로그램을 사용하는 와중 확장프로그램의 창을 닫고 키면 이전 창의 정보를 복원시킨다.\n\n해당 목적을 달성하기 위해선 단순하게 사용자가 사용하고 있는 정보를 저장할 저장소만 있으면 되겠다고 판단하였다.\n\n| 저장소                      | 최대 용량              | 데이터 구조                 | 비동기 지원 | 지속성                                  | 다른 탭/창 공유               |\n| ------------------------ | ------------------ | ---------------------- | ------ | ------------------------------------ | ----------------------- |\n| `localStorage`           | 5MB                | 문자열(JSON)              | ❌(동기)  | 브라우저 종료 후에도 유지                       | ✅(같은 출처에서 공유)           |\n| `sessionStorage`         | 5MB                | 문자열(JSON)              | ❌(동기)  | 탭(세션)이 닫히면 삭제                        | ❌(탭마다 독립적)              |\n| `chrome.storage.local`   | 10MB (확장 프로그램)     | JSON 객체 저장 가능          | ✅(비동기) | 브라우저 종료 후에도 유지                       | ✅(확장 프로그램 내에서 공유 가능)    |\n| `chrome.storage.session` | 10MB (확장 프로그램)     | JSON 객체 저장 가능          | ✅(비동기) | 확장 프로그램이 종료되면 삭제                     | ✅(확장 프로그램 내에서 공유 가능)    |\n| `IndexedDB`              | GB 단위              | 객체 저장 가능 (JSON, 배열 포함) | ✅(비동기) | 브라우저 종료 후에도 유지                       | ✅(같은 출처에서 가능)           |\n| `background.js`          | 제한 없음 (메모리 사용량 만큼) | 모든 JS 객체 저장 가능         | ✅(비동기) | 브라우저 종료되면 삭제 (persistent: false일 경우) | ✅(확장 프로그램 내 모든 페이지와 공유) |\n\n서로 다른 장단점이 있지만 내가 원하는 기능을 하기위해서는 `background.js`가 가장 적합하였다.\n그 이유는 다음과 같다.\n\n1. pin 정보같은 민감한 정보도 일시적으로 저장될 수 있기 때문에 localStorage와 sessionStorage그리고 IndexedDB를 이용하지 않아야 한다.\n2. 확장프로그램이 닫혀도 정보가 유지되어야 하기 때문에 chrome.storage.session과 sessionStorage를 이용할 수 없다.\n\n`background.js`를 이용하는 방법이 내가 내가 원하는 사용자 경험과 가장 잘 맞았다.\n\n### 문제 해결 로직\n\n문제를 해결하기 위해서는 2가지 기능이 필요하다.\n\n1. 앱을 사용하는 동안 사용자의 현제 라우트 위치와 해당 위치에 필요한 데이터 저장하기.\n2. 앱을 켤때 `background.js` 에 저장된 앱의 상태가 있는지 확인하고 있다면 복원하기.\n\n현제 프로젝트에서는 `react-query`를 사용중이기 때문에 `react-query`와 `context` 그리고 `hook`을 사용하여 앱의 상태를 저장하고 앱을 실행시킬때 불러오는 작업을 담당하도록 하였다.\n\n#### background.js 와 통신하기\n\n`background.js`는 브라우저 영역에서 작동하는 스크립트 이다.\n\n`background.js` 와 크롬 확장프로그램은 서로 `chrome.runtime.onMessage` 와 `chrome.runtime.sendMessage` 함수로 통신이 가능하다.\n\n간단하게 `background.js`를 작성해보자\n\n```js\nconst initialState = {\n  currentRoute: null,\n  data: {},\n};\n\nlet appState = { ...initialState };\n\nchrome.runtime.onMessage.addListener((message, sender, sendResponse) =\u003e {\n  switch (message.type) {\n    case \"GET_APP_STATE\":\n      sendResponse({\n        data: {\n          currentRoute: appState.currentRoute,\n          data: appState.data || {},\n        },\n      });\n      break;\n\n    case \"UPDATE_APP_STATE\":\n      // state가 undefined인 경우 처리\n      const newState = message.state || {};\n\n      // currentRoute가 변경되면 data 초기화\n      if (\n        newState.currentRoute \u0026\u0026\n        newState.currentRoute !== appState.currentRoute\n      ) {\n        appState = {\n          currentRoute: newState.currentRoute,\n          data: {},\n        };\n      } else {\n        appState = {\n          currentRoute: newState.currentRoute || appState.currentRoute,\n          data: { ...appState.data, ...(newState.data || {}) },\n        };\n      }\n\n      sendResponse({ data: appState });\n      break;\n\n    default:\n      sendResponse({ error: \"Unknown message type\" });\n  }\n  return true; // 비동기 응답을 위해 true 반환\n});\n```\n\n#### 앱 상태에 접근하기 위한 인터페이스 만들기\n\n브라우저의 `background.js`와 통신하기 위한 유틸리티 함수를 만들어야 한다.\n\n```typescript\n// app-cache.ts\n// 쿼리 키 상수\nexport const APP_STATE_KEY = [\"appState\"];\n\n// 백그라운드와 통신하는 함수들\nexport interface AppState {\n  currentRoute: string | null;\n  data: Record\u003cstring, any\u003e;\n}\n\nexport const getAppState = async (): Promise\u003cAppState\u003e =\u003e {\n  const response = await chrome.runtime.sendMessage({\n    type: \"GET_APP_STATE\",\n  });\n  return response?.data ?? { currentRoute: null, data: {} };\n};\n\nexport const updateAppState = async (state: Partial\u003cAppState\u003e) =\u003e {\n  const response = await chrome.runtime.sendMessage({\n    type: \"UPDATE_APP_STATE\",\n    state: {\n      currentRoute: state.currentRoute ?? null,\n      data: state.data ?? {},\n    },\n  });\n  return response.data;\n};\n```\n\n#### React Query 통합\n\nReact Query를 사용하여 캐시 상태를 관리하는 커스텀 훅을 만들었다.\n\n```tsx\n// use-cache.tsx\nimport { usePin } from \"@/contexts/pin/use\";\nimport { getAppState, updateAppState } from \"@/lib/app-cache\";\nimport { useMutation, useQuery, useQueryClient } from \"@tanstack/react-query\";\n\nexport const useCacheQuery = () =\u003e {\n  const { validPin } = usePin();\n  return useQuery({\n    queryKey: [\"cache\"],\n    queryFn: getAppState,\n    enabled: !!validPin,\n    staleTime: Infinity,\n  });\n};\n\nexport const useCacheMutation = () =\u003e {\n  const queryClient = useQueryClient();\n  return useMutation({\n    mutationFn: updateAppState,\n    onSuccess: (newState) =\u003e {\n      queryClient.setQueryData([\"cache\"], newState);\n    },\n  });\n};\n```\n\n- `useCacheQuery`: 앱 상태를 가져오는 쿼리 (PIN이 유효할 때만 활성화)\n- `useCacheMutation`: 앱 상태를 업데이트하는 뮤테이션\n\n#### Context API로 앱 전체에서 접근 가능하게 만들기\n\n캐시 상태에 앱 전체에서 쉽게 접근할 수 있도록 React Context를 만들었다.\n\n```tsx\n// 타입 정의 (contexts/cache/type.ts)\nimport { createContext } from \"react\";\n\nexport interface AppState {\n  currentRoute: string | null;\n  data: Record\u003cstring, any\u003e;\n}\n\nexport interface CacheContextType {\n  cache: AppState | undefined;\n  isLoading: boolean;\n  error: Error | null;\n  updateCache: (newState: Partial\u003cAppState\u003e) =\u003e Promise\u003cvoid\u003e;\n}\n\nexport const CacheContext = createContext\u003cCacheContextType | undefined\u003e(\n  undefined,\n);\n```\n\n```tsx\n// Context Provider (contexts/cache/index.tsx)\nimport React, { useCallback } from \"react\";\nimport { AppState } from \"@/lib/app-cache\";\nimport { CacheContext } from \"./type\";\nimport { useCacheMutation, useCacheQuery } from \"@/hooks/use-cache\";\n\nexport function CacheProvider({ children }: { children: React.ReactNode }) {\n  // Fetch cache data\n  const { data: cache, isLoading, error } = useCacheQuery();\n\n  // Update cache mutation\n  const { mutateAsync: updateCacheMutation } = useCacheMutation();\n\n  // Update cache wrapper function\n  const updateCache = useCallback(\n    async (newState: Partial\u003cAppState\u003e) =\u003e {\n      await updateCacheMutation(newState);\n    },\n    [updateCacheMutation],\n  );\n\n  return (\n    \u003cCacheContext.Provider\n      value={{\n        cache,\n        isLoading,\n        error,\n        updateCache,\n      }}\n    \u003e\n      {children}\n    \u003c/CacheContext.Provider\u003e\n  );\n}\n```\n\n```tsx\n// 사용을 위한 커스텀 훅 (contexts/cache/use.ts)\nimport { CacheContext } from \"@/contexts/cache/type\";\nimport { useContext } from \"react\";\n\n// Custom hook to use the cache context\nexport function useCache() {\n  const context = useContext(CacheContext);\n  if (context === undefined) {\n    throw new Error(\"useCache must be used within a CacheProvider\");\n  }\n  return context;\n}\n```\n\n#### 실제 사용 예시\n\n캐시 시스템을 실제로 어떻게 사용하는지 예시 코드를 살펴보자.\n\n```tsx\n// 특정 컴포넌트에서 캐시 사용하기\nimport { useCache } from '@/contexts/cache/use';\nimport { useEffect } from 'react';\nimport { useLocation } from 'react-router-dom';\n\nfunction MyComponent() {\n  const location = useLocation();\n  const { cache, updateCache } = useCache();\n\n  // 현재 라우트 저장\n  useEffect(() =\u003e {\n    updateCache({ currentRoute: location.pathname });\n  }, [location.pathname, updateCache]);\n\n  // 컴포넌트 상태 저장\n  const saveData = (newData) =\u003e {\n    updateCache({\n      data: {\n        ...cache?.data,\n        myComponentData: newData\n      }\n    });\n  };\n\n  // 저장된 데이터 사용\n  useEffect(() =\u003e {\n    if (cache?.data?.myComponentData) {\n      // 저장된 데이터로 컴포넌트 상태 복원\n      // ...\n    }\n  }, [cache]);\n\n  return (\n    // ... 컴포넌트 렌더링\n  );\n}\n```\n\n이런 식으로 다양한 컴포넌트에서 캐시를 활용하여 상태를 저장하고 복원할 수 있다.\n\n## 최종 생각\n\n확장 프로그램 세션이 종료되어도 사용자 경험을 유지하는 것은 생각보다 까다로운 문제였다. `background.js`를 활용한 메모리 기반 캐시는 데이터의 민감성과 일시적인 저장 특성을 고려할 때 최적의 선택이었다. React Query와 Context API를 함께 사용함으로써 상태 관리 로직을 깔끔하게 구현할 수 있었고, 사용자 경험을 크게 향상시킬 수 있었다.\n\n트레이딩 도구처럼 빠른 상호작용이 필요한 확장 프로그램에서는 이런 방식의 캐시가 매우 유용하다. 다음 프로젝트에서도 이런 패턴을 적극 활용해봐야겠다.\n"])</script><script>self.__next_f.push([1,"34:T14ee,"])</script><script>self.__next_f.push([1,"크롬 확장 프로그램을 통해 트레이딩 도구를 개발하는 도중, 한 가지 큰 문제가 있었다.\n크롬 확장 프로그램은 일반 앱처럼 보이지만, 사용자가 팝업 창이나 사이드바를 닫으면 확장 프로그램의 세션이 완전히 종료된다. 이로 인해 사용자가 입력했던 데이터나 현재 보고 있던 화면 위치가 저장되지 않고, 재접속 시 항상 처음 화면으로 돌아가게 된다.\n멀티태스킹 환경에서 트레이더들은 확장 프로그램을 수시로 열고 닫아야 하는데, 매번 처음부터 시작해야 하는 것은 큰 불편함이었다.\n문제를 해결의 목표를 단순하게 정리하면 다음과 같다\n\u003e [!goal]\n\u003e 크롬 확장프로그램을 사용하는 와중 확장프로그램의 창을 닫고 키면 이전 창의 정보를 복원시킨다.\n해당 목적을 달성하기 위해선 단순하게 사용자가 사용하고 있는 정보를 저장할 저장소만 있으면 되겠다고 판단하였다.\n| 저장소                      | 최대 용량              | 데이터 구조                 | 비동기 지원 | 지속성                                  | 다른 탭/창 공유               |\n| ------------------------ | ------------------ | ---------------------- | ------ | ------------------------------------ | ----------------------- |\n| localStorage           | 5MB                | 문자열(JSON)              | ❌(동기)  | 브라우저 종료 후에도 유지                       | ✅(같은 출처에서 공유)           |\n| sessionStorage         | 5MB                | 문자열(JSON)              | ❌(동기)  | 탭(세션)이 닫히면 삭제                        | ❌(탭마다 독립적)              |\n| chrome.storage.local   | 10MB (확장 프로그램)     | JSON 객체 저장 가능          | ✅(비동기) | 브라우저 종료 후에도 유지                       | ✅(확장 프로그램 내에서 공유 가능)    |\n| chrome.storage.session | 10MB (확장 프로그램)     | JSON 객체 저장 가능          | ✅(비동기) | 확장 프로그램이 종료되면 삭제                     | ✅(확장 프로그램 내에서 공유 가능)    |\n| IndexedDB              | GB 단위              | 객체 저장 가능 (JSON, 배열 포함) | ✅(비동기) | 브라우저 종료 후에도 유지                       | ✅(같은 출처에서 가능)           |\n| background.js          | 제한 없음 (메모리 사용량 만큼) | 모든 JS 객체 저장 가능         | ✅(비동기) | 브라우저 종료되면 삭제 (persistent: false일 경우) | ✅(확장 프로그램 내 모든 페이지와 공유) |\n서로 다른 장단점이 있지만 내가 원하는 기능을 하기위해서는 background.js가 가장 적합하였다.\n그 이유는 다음과 같다.\n1. pin 정보같은 민감한 정보도 일시적으로 저장될 수 있기 때문에 localStorage와 sessionStorage그리고 IndexedDB를 이용하지 않아야 한다.\n2. 확장프로그램이 닫혀도 정보가 유지되어야 하기 때문에 chrome.storage.session과 sessionStorage를 이용할 수 없다.\nbackground.js를 이용하는 방법이 내가 내가 원하는 사용자 경험과 가장 잘 맞았다.\n문제를 해결하기 위해서는 2가지 기능이 필요하다.\n1. 앱을 사용하는 동안 사용자의 현제 라우트 위치와 해당 위치에 필요한 데이터 저장하기.\n2. 앱을 켤때 background.js 에 저장된 앱의 상태가 있는지 확인하고 있다면 복원하기.\n현제 프로젝트에서는 react-query를 사용중이기 때문에 react-query와 context 그리고 hook을 사용하여 앱의 상태를 저장하고 앱을 실행시킬때 불러오는 작업을 담당하도록 하였다.\nbackground.js는 브라우저 영역에서 작동하는 스크립트 이다.\nbackground.js 와 크롬 확장프로그램은 서로 chrome.runtime.onMessage 와 chrome.runtime.sendMessage 함수로 통신이 가능하다.\n간단하게 background.js를 작성해보자\n브라우저의 background.js와 통신하기 위한 유틸리티 함수를 만들어야 한다.\nReact Query를 사용하여 캐시 상태를 관리하는 커스텀 훅을 만들었다.\nuseCacheQuery: 앱 상태를 가져오는 쿼리 (PIN이 유효할 때만 활성화)\nuseCacheMutation: 앱 상태를 업데이트하는 뮤테이션\n캐시 상태에 앱 전체에서 쉽게 접근할 수 있도록 React Context를 만들었다.\n캐시 시스템을 실제로 어떻게 사용하는지 예시 코드를 살펴보자.\n이런 식으로 다양한 컴포넌트에서 캐시를 활용하여 상태를 저장하고 복원할 수 있다.\n확장 프로그램 세션이 종료되어도 사용자 경험을 유지하는 것은 생각보다 까다로운 문제였다. background.js를 활용한 메모리 기반 캐시는 데이터의 민감성과 일시적인 저장 특성을 고려할 때 최적의 선택이었다. React Query와 Context API를 함께 사용함으로써 상태 관리 로직을 깔끔하게 구현할 수 있었고, 사용자 경험을 크게 향상시킬 수 있었다.\n트레이딩 도구처럼 빠른 상호작용이 필요한 확장 프로그램에서는 이런 방식의 캐시가 매우 유용하다. 다음 프로젝트에서도 이런 패턴을 적극 활용해봐야겠다."])</script><script>self.__next_f.push([1,"35:T199f,"])</script><script>self.__next_f.push([1,"\n# 취업을 위한 알고리즘 공부\n\n목표: 취업을 하기위한 알고리즘 공부\n어디서 어떻게 시작해야 발전할 수 있는지 모르기 때문에 다른 사람들을 먼저 찾아보고 따라해보면서 공부해 나간다.\n\n## 다른 사람들이 소개하는 알고리즘 공부방법\n\n인터넷검색을 통해 내가 실천할 수 있을만한 것들을 선별하여 정리하자\n\n### 알고리즘 코딩테스트 입문자를 위한 공부법\n\n출처:[Velog 포스트](https://velog.io/@skiende74/%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98-%EC%BD%94%EB%94%A9%ED%85%8C%EC%8A%A4%ED%8A%B8-%EC%9E%85%EB%AC%B8%EC%9E%90%EB%A5%BC-%EC%9C%84%ED%95%9C-%EA%B3%B5%EB%B6%80%EB%B2%95)\n\n따라하기 쉽게 뭐부터 풀어라 를 잘 알려주고 있다.(나에게 필요한것일수도?)\n\n1. 프로그래머스 0.5 레벨\n2. [백준 단계별 문제 풀기](https://www.acmicpc.net/step)\n3. dfs/bfs,완전탐색 이론공부 후 실버 15문제 풀기\n4. dp 이론공부 후 실버 15문제 풀기\n5. 앞서 진행한 문제 유형별로 실보 15문제/골드 10문제 풀기 (완전탐색, dp 등은 20문제 이상)\n6. 이진탐색 유형 이론공부 후 실버 15문제 풀기\n7. 디익스트라 유형 이론공부 후 실버 15문제 풀기\n8. 유니온파인드 유형 이론공부 후 실버 10문제 풀기\n9. MST(크루스칼,프림) 유형 이론공부 후 실버 10문제 풀기\n10. 투포인터, 슬리이딩윈도우 유형 이론공부 후 투포인터 유형 실버 10문제 풀기.\n11. 비트마스킹 유형 이론공부 후 실버 10문제 풀기.\n\n\u003e [!info] 참고\n\u003e [백준 유형별 공략법](https://velog.io/@skiende74/%EB%B0%B1%EC%A4%80-%EC%9C%A0%ED%98%95%EB%B3%84%EB%A1%9C-%EB%AF%B8%EB%8A%94%EB%B2%95)\n\u003e\n\u003e [코드트리](https://www.codetree.ai/)\n\u003e\n\u003e [유형별 백준](https://solved.ac/search?query=%23graph_traversal+*s\u0026sort=solved\u0026direction=desc\u0026page=1)\n\u003e\n\u003e [이코테 해설강의](https://www.youtube.com/watch?v=7C9RgOcvkvo\u0026ab_channel=%EB%8F%99%EB%B9%88%EB%82%98)\n\u003e\n\u003e [문어박사 해설강의](https://www.youtube.com/@IT-zk3so/videos)\n\u003e\n\u003e [개발자장고 알고리즘 강의](https://www.youtube.com/watch?v=3_eVkTkBbJE\u0026ab_channel=%EA%B0%9C%EB%B0%9C%EC%9E%90%EC%9E%A5%EA%B3%A0)\n\u003e\n\u003e [알고리즘 고수 바킹독 강의](https://www.youtube.com/playlist?list=PLtqbFd2VIQv4O6D6l9HcD732hdrnYb6CY)\n\u003e\n\u003e [바킹독 블로그 강의포스팅](https://blog.encrypted.gg/category/%EA%B0%95%EC%A2%8C/%EC%8B%A4%EC%A0%84%20%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98?page=1)\n\n### 알고리즘 대회 공부 과정\n\n출처: [DC 게시글](https://gall.dcinside.com/mgallery/board/view/?id=ps\u0026no=44058)\n\n- [티스토리 블로그](https://plzrun.tistory.com/entry/%EC%95%8C%EA%B3%A0%EB%A6%AC%EC%A6%98-%EB%AC%B8%EC%A0%9C%ED%92%80%EC%9D%B4PS-%EC%8B%9C%EC%9E%91%ED%95%98%EA%B8%B0)\n\n  1. 입출력 문제 풀어보기\n\n     - 2557, 1000, 2558, 10950, 10951, 10952, 10953, 11021, 11022, 11718, 11719, 11720, 11721, 2741, 2742, 2739, 1924, 8393, 10818, 2438, 2439, 2440, 2441, 2442, 2445, 2522, 2446, 10991, 10992\n     - 입출력 문제들을 풀 때 *10분 이상 풀리지 않는다면 입출력에서 뭔가 모르는 부분이 있
