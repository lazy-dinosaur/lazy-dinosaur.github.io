cies])`: 의존성 배열의 값이 변경될 때마다 실행된다. 이는 클래스 컴포넌트의 `componentDidUpdate`와 유사하다.\n   - `useMemo`,`useCallback`: 의존성이 변경될 때만 값이나 함수를 재계산하여 최적화한다.\n\n3. 언마운트(Unmount)-컴포넌트가 DOM에서 제거될 때\n   - `useEffect`의 클린업 함수:`useEffect(()=\u003e{return()=\u003e{/*정리 로직*/}},[])`. 이는 크래스 컴포넌트의 `componentWillUnmount`와 유사하다.\n4. 에러 처리\n   - `useErrorBoundary`(별도 라이브러리) 또는 상위 컴포넌트에서 ErrorBoundary 클래스 사용\n\n## 추가로 알아두면 좋은 개념들\n\n- 조건부 렌더링: 함수형 컴포넌트는 조건에 따라 다른 JSX를 반환할 수 있다.\n- 렌더 최적화: `React.memo`를 사용하여 불필"])</script><script>self.__next_f.push([1,"요한 리렌더링을 방지할 수 있다.\n- 커스텀 Hooks: 여러 생명주기 관련 로직을 재사용 가능한 자체 Hook으로 만들 수 있다.\n10:Tf92,"])</script><script>self.__next_f.push([1,"\n# 가상DOM의 원리\n\n가상DOM은 실제 DOM의 가벼운 복사본이다. 실제 브라우저의 DOM을 직접 조작하는 대신, 메모리 상에 가상의 DOM 트리를 만들어 작업산 후 필요한 변경사항만 실제 DOM에 적용하는 방식이다.\n\n## 작동 원리\n\n1. 초기 렌더링:\n   - 애플리케이션이 처음 로드될때 실제 DOM의 가상 표현이 메모리에 생성된다.\n   - 이 가상 DOM은 실제 DOM 요소에 대응하는 JavaScript 객체 트리 구조이다.\n2. 상태 변경 감지:\n   - 데이터가 변경되면(예: 사용자 상호작용) 전체 UI를 다시 렌더링하는 새로운 가상 DOM 트리가 생성된다.\n3. 가상 DOM 비교(Diffing):\n   - 이전 DOM과 새로운 가상 DOM을 비교하는 \"diffing\"알고리즘이 실행된다.\n   - React의 경우 이 과정을 \"reconciliation(재조정)\"이라고 부른다.\n4. 변경사항 계산 (Patch):\n   - 알고리즘은 두 가상 DOM 트리 간의 차이점을 찾아 최소한의 변경사항 집합을 계산한다.\n5. 배치 업데이트(Batching):\n   - 모든 변경사항만 실제 DOM에 적용한다. 이 과정을 \"커밋 단계\"라고 한다.\n\n## Diffing 알고리즘의 최적화 원칙\n\n1. 트리 비교:\n   - 두 트리를 루트 노드부터 비교하기 시작힌다.\n   - 루트 요소의 타입이 다르면 전체 트리를 새로 구성한다.\n2. 요소 타입 비교:\n   - 같은 위치에 있는 요소의 타입이 같으면 속성만 업데이트하고, 다르면 해당 노드와 그 하위 트리를 모두 재생성한다.\n3. 키(Key)사용:\n   - 리스트 항목에 고유 키를 할당하면 알고리즘이 요소의 이동을 효율적으로 추적할 수 있다.\n   - 예: `\u003cli key=\"todo-1\"\u003e항목 1\u003c/li\u003e`\n4. 레벨별 비교:\n   - 알고리즘은 같은 레벨의 노드들만 비교하며, 자식 노드들 간에는 재귀적으로 비교한다.\n\n## 성능 이점\n\n1. DOM 조작 최소화:\n   - 실제 DOM 조작은 비용이 큰 작업이다. 가상 DOM은 필요한 변경사항만 적용해 이를 최소화한다.\n2. 일괄 처리:\n   - 여러 변경사항을 하나의 업데이트로 배치 처리한다.\n3. 이벤트 시스템 최적화:\n   - [[이벤트 위임(event delegation)]]을 통해 이벤트 핸들러 수를 줄인다.\n\n## 간단한 가상 DOM 구현 예시(의사 코드)\n\n```js\n// 1. 가상 DOM 노드 생성\nfunction createVirtualNode(type, props, ...children) {\n  return { type, props, children };\n}\n// 2. 가상 DOM을 실제 DOM으로 변환\nfunction createRealDOM(virtualNode) {\n  //텍스트 노드 처리\n  if (typeof virtualNode === \"string\") {\n    return document.createTextNode(virtualNode);\n  }\n\n  // 요소 노드 생성\n  const element = document.createElement(virtualNode.type);\n  //속성 설정\n  for (const [key, value] of Object.entries(virtualNode.props || {})) {\n    element.setAttribute(key, value);\n  }\n  // 자식 노드 재귀적 처리\n  for (const child of virtualNode.children) {\n    element.appendChild(createRealDOM(child));\n  }\n  return element;\n}\n// 3.DOM 비교 (단순화된 버전)\nfunction updateDOM(oldNode, newNode, parentElement) {\n  // 노드가 없거나 변경된 여우\n  if (!oldNode) {\n    parentElement.appendChild(createRealDOM(newNode));\n  } else if (!newNode) {\n    parentElement.removeChild(oldNode);\n  } else if (hasChanged(oldNode, newNode)) {\n    parentElement.replaceChild(createRealDOM(newNode), oldNode);\n  } else if (newNode.type) {\n    // 자식 노드들 비교\n    const oldChildren = Array.from(oldNode.childNodes);\n    const newChildren = newNode.children;\n\n    // 최대 자식 길이 계산\n    const maxLength = Math.max(oldChildren.length, newChildren.length);\n\n    for (let i = 0; i \u003c maxLength; i++) {\n      updateDOM(oldChildren[i], newChildren[i], oldNode);\n    }\n  }\n}\n\n// 노드 변경 여부 확인\n\nfunction hasChanged(a, b) {\n  return (\n    typeof a !== typeof b ||\n    (typeof a === \"string\" \u0026\u0026 a !== b) ||\n    a.type !== b.type\n  );\n}\n```\n"])</script><script>self.__next_f.push([1,"11:Tc98,"])</script><script>self.__next_f.push([1,"\n# Props Drilling 이란 무엇인가\n\n![1745188841-propsDrilling.png](_assets/attachments/1745188841-propsDrilling.png)\n\nProps Drilling은 React와 같은 컴포넌트 기반 프레임워크에서 발생하는 **패턴**으로,상위 컴포넌트에서 깊이 중첩된 하위 컴포넌트로 데이터(props)를 전달하기 위해 중간에 있는 여러 컴포넌트들을 통과시키는 과정을 말한다.\n\n## 작동 방식\n\n예를 들어 다음과 같은 컴포넌트 구조가 있다고 가정해보자\n\n```xml\nApp\n└── Parent\n    └── Child\n        └── GrandChild\n            └── GreatGrandChild\n```\n\n만약 `App`컴포넌트에서 `GreatGrandChild`컴포넌트로 데이터를 전달해야 한다면, 그 데이터는 `Parent`,`Child`,`GrandChild`를 거쳐야 한다. 이때 중간에 이쓴ㄴ 컴포넌트들은 해당 데이터를 실제로 사용하지 않고 단순히 하위 컴포넌트로 전달만 하는 역할을 한다.\n\n```jsx\njsxfunction App() {\n  const data = \"Hello from App\";\n  return \u003cParent data={data} /\u003e;\n}\n\nfunction Parent({ data }) {\n  return \u003cChild data={data} /\u003e;\n}\n\nfunction Child({ data }) {\n  return \u003cGrandChild data={data} /\u003e;\n}\n\nfunction GrandChild({ data }) {\n  return \u003cGreatGrandChild data={data} /\u003e;\n}\n\nfunction GreatGrandChild({ data }) {\n  return \u003cdiv\u003e{data}\u003c/div\u003e;\n}\n```\n\n위 예제에서 `Parent`,`Child`,`GrandChild`컴포넌트는 `data` prop을 사용하지 않고 단순히 다음 컴포넌트로 전달만 한다. 이것이 바로 Props Drilling이다.\n\n## 문제점\n\n1. 코드 복잡성 증가: 중간 컴포넌트들이 불필요한 props를 관리해야 하므로 코드가 복잡해진다.\n2. 유지보수 어려움: props의 변경이 필요할 때 관련된 모든 컴포넌트를수정해야한다.\n3. 컴포넌트 재사용성 저하: 특정 데이터에 의존하게 되어 컴포넌트의 재사용성이 떨어진다.\n4. 디버깅 어려움: 데이터 흐름을 추적하기 어려워 문제 발생 시 디버깅이 복잡해진다.\n\n## 해결 방법\n\n1. ContextAPI: React의 Context API를 사용하면 중간 컴포넌트를 거치지 않고 직접 데이터를 전달할 수 있다.\n\n```jsx\nconst DataContext = React.createContext();\n\nfunction App() {\n  const data = \"Hello from App\";\n  return (\n    \u003cDataContext.Provider value={data}\u003e\n      \u003cParent /\u003e\n    \u003c/DataContext.Provider\u003e\n  );\n}\n\n// 중간 컴포넌트들은 데이터를 전달하지 않아도 됨\nfunction Parent() {\n  return \u003cChild /\u003e;\n}\n\nfunction Child() {\n  return \u003cGrandChild /\u003e;\n}\n\nfunction GrandChild() {\n  return \u003cGreatGrandChild /\u003e;\n}\n\nfunction GreatGrandChild() {\n  const data = React.useContext(DataContext);\n  return \u003cdiv\u003e{data}\u003c/div\u003e;\n}\n```\n\n2. 상태 관리 라이브러리: Redux, Recoil, MobX 같은 상태 관리 라이브러리를 사용하여 전역 상태를 관리할 수 있다.\n\n3. Composition(합성): 컴포넌트 합성을 통해 props drilling을 피할 수 있다.\n\n```jsx\nfunction App() {\n  const data = \"Hello from App\";\n  return (\n    \u003cParent\u003e\n      \u003cGreatGrandChild data={data} /\u003e\n    \u003c/Parent\u003e\n  );\n}\n\nfunction Parent({ children }) {\n  return \u003cdiv\u003e{children}\u003c/div\u003e;\n}\n\nfunction GreatGrandChild({ data }) {\n  return \u003cdiv\u003e{data}\u003c/div\u003e;\n}\n```\n"])</script><script>self.__next_f.push([1,"12:T6d3,\n# 자식컴포넌트에서 부모컴포넌트로 데이터 전달하기\n\n두가지 방법이 있다 한가지는 부모가 가지고 있는 상태를 조작할 수 있는 리모콘을 만들어 자식에게 전달하는 방식 다른 하나는 contextAPI 혹은 다른 상태 관리 프로그램을 활용해 데이터를 전달하는 것이다.\n\n## 리모콘을 전달해보자.\n\n리엑트는 기본적으로 `state`와 `props`로 이루어져 있다. `props`는 읽기 전용 이기 때문에 직접 수정은 불가능 하다. 다만 객체를 넘기면 된다. 함수의 경우에도 객체이기 때문에 `props`에 `setState` 혹은 **콜백 함수** 를 자식 컴포넌트로 넘기게 되면 자식 컴포넌트에서 부모에서 선언된 상태를 조작할 수 있게 된다.\n\n```jsx\n// 부모 컴포넌트\nfunction ParentComponent() {\n  const [parentData, setParentData] = useState(\"\");\n\n  return (\n    \u003cdiv\u003e\n      \u003ch2\u003e부모 컴포넌트\u003c/h2\u003e\n      \u003cp\u003e데이터: {parentData}\u003c/p\u003e\n\n      {/* setState 함수 자체를 props로 전달 */}\n      \u003cChildComponent setParentData={setParentData} /\u003e\n    \u003c/div\u003e\n  );\n}\n\n// 자식 컴포넌트\nfunction ChildComponent({ setParentData }) {\n  const [inputValue, setInputValue] = useState(\"\");\n\n  const handleChange = (e) =\u003e {\n    setInputValue(e.target.value);\n  };\n\n  const handleSubmit = () =\u003e {\n    // 부모로부터 전달받은 setState 함수 직접 호출\n    setParentData(inputValue);\n  };\n\n  return (\n    \u003cdiv\u003e\n      \u003ch3\u003e자식 컴포넌트\u003c/h3\u003e\n      \u003cinput\n        type=\"text\"\n        value={inputValue}\n        onChange={handleChange}\n        placeholder=\"데이터 입력\"\n      /\u003e\n      \u003cbutton onClick={handleSubmit}\u003e부모 상태 업데이트\u003c/button\u003e\n    \u003c/div\u003e\n  );\n}\n```\n13:T9b3,"])</script><script>self.__next_f.push([1,"\n# props와 state\n\n![1745187761-propsAndState.png](_assets/attachments/1745187761-propsAndState.png)\n\nprops 와 state 둘다 데이터를 관리하기 위한 값이다.\n\n## State(상태)\n\nState는[[엘리먼트와 컴포넌트의 차이|컴포넌트]] 내부에서 관리되는 데이터로, 컴포넌트의 렌더링에 영향을 주는 동적인 값이다.\n\n### 주요 특징\n\n- 컴포넌트 내부에서 생성되고 관리된다.\n- 변경 가능(mutable)아며, 상태가 변경되면 컴포넌트가 다시 렌더링된다.\n- 컴포넌트의 생명주기 동안 유지된다.\n- 비동기적으로 업데이트될 수 있다.\n\n\u003e [!important]\n\u003e\n\u003e - `setState()`나 `setState`의 업데이트 함수는 상태를 즉시 변경하지 않고 업데이트를 예약한다.(비동기적)\n\u003e - 이전 상태에 의존하는 업데이트트는 함수형 업데이트를 사용해야 한다.\n\u003e   ```js\n\u003e   setCount((prevCount) =\u003e prevCount + 1);\n\u003e   ```\n\n## Props(속성)\n\nProps는 부모 컴포넌트로부터 자식 컴포넌트로 전달되는 데이터 이다.\n\n### 주요 특징\n\n- 외부(부모 컴포넌트)에서 전달받는다.\n- 읽기 전용(read-only)이며 컴포넌트 내부에서 변경할 수 없다.\n- 부모 컴포넌트가 리렌더링되면 자식 컴포넌트의 props도 업데이트될 수 있다.\n- 컴포넌트 간의 데이터 흐름을 형성한다.\n\n\u003e [!important]\n\u003e\n\u003e - Props는 단방향 데이터 흐름을 구현한다(부모-\u003e자식)\n\u003e - Props는 불변성(immutability)을 가진다.\n\u003e - 기본값 설정이 가능하다.\n\u003e - Props를 통해 함수도 전달할 수 있어 자식 컴포넌트가 부모 컴포넌트의 상태를 변경할 수 있다.\n\n| 특성          | State                                           | Props                         |\n| ------------- | ----------------------------------------------- | ----------------------------- |\n| 출처          | 컴포넌트 내부                                   | 부모 컴포넌트                 |\n| 변경 가능성   | 변경 가능(mutable)                              | 읽기 전용(immutable)          |\n| 업데이트 방법 | `setState()` 또는 `useState` 훅의 업데이트 함수 | 부모 컴포넌트에서만 변경 가능 |\n| 데이터 흐름   | 컴포넌트 내부 흐름                              | 하향식(top-down)흐름          |\n| 사용 용도     | 컴포넌트의 내부 상태 관리                       | 컴포넌트 간 데이터 전달       |\n"])</script><script>self.__next_f.push([1,"14:T87f,"])</script><script>self.__next_f.push([1,"props 와 state 둘다 데이터를 관리하기 위한 값이다.\nState는컴포넌트 내부에서 관리되는 데이터로, 컴포넌트의 렌더링에 영향을 주는 동적인 값이다.\n컴포넌트 내부에서 생성되고 관리된다.\n변경 가능(mutable)아며, 상태가 변경되면 컴포넌트가 다시 렌더링된다.\n컴포넌트의 생명주기 동안 유지된다.\n비동기적으로 업데이트될 수 있다.\n\u003e [!important]\n\u003e\n\u003e - setState()나 setState의 업데이트 함수는 상태를 즉시 변경하지 않고 업데이트를 예약한다.(비동기적)\n\u003e - 이전 상태에 의존하는 업데이트트는 함수형 업데이트를 사용해야 한다.\n\u003e   \nProps는 부모 컴포넌트로부터 자식 컴포넌트로 전달되는 데이터 이다.\n외부(부모 컴포넌트)에서 전달받는다.\n읽기 전용(read-only)이며 컴포넌트 내부에서 변경할 수 없다.\n부모 컴포넌트가 리렌더링되면 자식 컴포넌트의 props도 업데이트될 수 있다.\n컴포넌트 간의 데이터 흐름을 형성한다.\n\u003e [!important]\n\u003e\n\u003e - Props는 단방향 데이터 흐름을 구현한다(부모-\u003e자식)\n\u003e - Props는 불변성(immutability)을 가진다.\n\u003e - 기본값 설정이 가능하다.\n\u003e - Props를 통해 함수도 전달할 수 있어 자식 컴포넌트가 부모 컴포넌트의 상태를 변경할 수 있다.\n| 특성          | State                                           | Props                         |\n| ------------- | ----------------------------------------------- | ----------------------------- |\n| 출처          | 컴포넌트 내부                                   | 부모 컴포넌트                 |\n| 변경 가능성   | 변경 가능(mutable)                              | 읽기 전용(immutable)          |\n| 업데이트 방법 | setState() 또는 useState 훅의 업데이트 함수 | 부모 컴포넌트에서만 변경 가능 |\n| 데이터 흐름   | 컴포넌트 내부 흐름                              | 하향식(top-down)흐름          |\n| 사용 용도     | 컴포넌트의 내부 상태 관리                       | 컴포넌트 간 데이터 전달       |"])</script><script>self.__next_f.push([1,"15:T948,"])</script><script>self.__next_f.push([1,"\n# flux 패턴이란\n\n![1745105037-flux-pattern.png](_assets/attachments/1745105037-flux-pattern.png)\n\nFlux 패턴은 Facebook(현 Meta)에서 개발한 단방향 데이터 흐름 아키텍처 패턴이다. 복잡한 UI를 가진 웹 애플리케이션에서 데이터 흐름을 관리하기 위해 만들어 졌으며, 특히 React와 함께 사용하기 위해 설계되었다.\n\n## 주요 특징\n\n1. 단방향 데이터 흐름: 데이터는 항상 한방향(Dispatcher -\u003e Store -\u003e View)으로만 흐른다.\n2. 예측 가능한 상태 관리: 애플리케이션의 상태가 어떻게 변하는지 추적하기 쉽다.\n3. 중앙 집중식 Dispatcher:모든 액션이 중앙 Dispatcher를 통과한다.\n\n## 핵심 구성 요소\n\n1. 액션(Actioin): 사용자 상호작용이나 API응답 등으로 발생하는 이벤트이다. 각 액션은 `type`과 관련 `payload`(데이터)를 가진다.\n\n2. 디스패처(Dispatcher): 액션을 받아서 등록된 모든 스토어에 전달하는 중앙 허브이다. Flux의 디스패처는 단일 디스패처로, 모든 액션은 이를 통과한다.\n\n3. 스토어(Store): 애플리케이션의 상태와 비즈니스 로직을 포함한다. 디스패치로부터 액션을 받아 처리하고, 상태를 업데이트한다. 스토어는 상태가 변경되면 뷰에게 알린다.\n\n4. 뷰(View): 주로 React 컴포넌트로 구현하다. 스토어의 상태를 화면에 렌더링하고, 사용자 입력에 반응하여 새로운 액션을 생성한다.\n\n## 데어터 흐름\n\nFlux 데이터 흐름은 다음과 같은 단계로 진행된다.\n\n1. 사용자가 뷰와 상호작용한다.(예: 버튼 클릭)\n2. 뷰는 액션 크리에이터(Action Creator)\n3. 액션은 디스패처로 전달된다.\n4. 디스패처는 액션을 모든 스토어에 전달한다.\n5. 스토어는 액션에 따라 상태를 업데이트하고, 변경 이벤트를 발생시킨다.\n6. 뷰는 스토어의 변경 이벤트를 감지하고, 새로운 상태에 따라 리렌더링된다.\n\n## Flux 패턴의 장단점\n\n- 장점\n\n  - 예측 가능한 데이터 흐름\n  - 상태 관리의 일관성\n  - 디버깅 용이성\n  - 코드 구조의 명확성\n\n- 한계점\n\n  - 간단한 애플리케이션에서는 과도한 보일러플레이트 코드가 발생\n  - 비동기 작업 처리를 위한 추가 라이브러리 필요\n  - 학습 곡선이 있음\n"])</script><script>self.__next_f.push([1,"16:T24cf,"])</script><script>self.__next_f.push([1,"\n# Javascript에서의 비동기 함수\n\n자바스크립트는 기본적으로 '단일 스레드'언어이다. 이는 한 번에 하나의 작업만 수행할 수 있다는 의미이다. 그러나 웹 애플리케이션에서는 데이터 가져오기, 파일 읽기/쓰기 등 시간이 오래 걸리는 작업이 많이 있다. 이러한 **작업을 동기적으로 처리한다면, 작업이 완료될 때까지 다른 모든 코드의 실행이 중단**된다.\n\n비동기 프로그래밍은 이런 문제를 해결한다. 비동기 작업은 메인 실행 스레드를 차단하지 않고 백그라운드에서 실행되며, 작업이 완료되면 결과를 반환한다.\n\n\u003e [!caution]\n\u003e \"단일 스레드\" 라는것은 어디까지나 코드를 읽고 해석하고 실행시키는 작업만 해당된다. 자바스크립트 엔진은 실행 자체는 Node.js 나 브라우저에 업무를 위임하게 되는데 Node.js 나 브라우저는 멀티 스레드로 컴퓨팅하여 작업을 처리한다.\n\n## 비동기 처리 방식의 발전\n\n### 콜백 함수(Callbacks)\n\n초기 자바스크립트에서는 비동기 처리를 위해 콜백 함수를 사용했다. **콜백 함수는 다른 함수에 인수로 전달되어, 그 함수 내부에서 나중에 호출**되는 함수를 의미한다. 비동기 처리에서는 특정 작업(예: 타이머 완료, 데이터 로딩 완료, 이벤트 발생)이 끝났을 때 실행될 로직을 콜백 함수 형태로 전달하는 방식으로 주로 사용된다. 비동기 작업을 시작하는 함수는 즉시 반환되고, 작업이 완료되면 미리 등록된 콜백 함수가 호출되어 결과를 처리하거나 다음 단계를 진행한다.\n\n```js\nfunction fetchData(callback) {\n  setTimeout(() =\u003e {\n    const data = \"데이터가 도착했습니다\";\n    callback(data);\n  }, 2000);\n}\n\nfetchData((data) =\u003e {\n  console.log(data); // 2초 후 \"데이터가 도착했습니다\" 출력\n});\n```\n\n#### 콜백 지옥(Callback Hell)\n\n여러 개의 비동기 작업을 순차적으로 처리해야 할 때 콜백 함수가 계속해서 중첩되어 코드의 들여쓰기 수준이 깊어지고 가독성이 극도로 나빠지는 상황을 말한다.\n\n콜백 지옥은 콜백 패턴의 한계를 보여주는 대표적인 예시이며 이러한 문제를 해결하기 위해 `promise`와 `async/await`같은 더 나은 비동기 처리 패턴이 등장하게 되었다.\n\n##### 문제점\n\n1. 가독성 저하: 코드가 오른쪽으로 계속 길어져 전체 로직을 파악하기 어렵다.\n2. 에러 처리의 어려움: 각 콜백 단계마다 에러 처리를 별도로 해주어야 하며, 에러가 발생했을 때 어디서 문제가 생겼는지 추적하기 어렵다.\n3. 유지보수 어려움: 코드 수정이나 기능 추가 시 복잡한 중첩 구조 때문에 실수를 유발하기 쉽다.\n\n```js\nasyncTask1(\n  function (result1) {\n    asyncTask2(\n      result1,\n      function (result2) {\n        asyncTask3(\n          result2,\n          function (result3) {\n            //... 계속 중첩...\n            asyncTaskN(\n              resultN_1,\n              function (resultN) {\n                // 최종 결과 처리\n              },\n              function (errorN) {\n                // 에러 처리 N\n              },\n            );\n          },\n          function (error3) {\n            // 에러 처리 3\n          },\n        );\n      },\n      function (error2) {\n        // 에러 처리 2\n      },\n    );\n  },\n  function (error1) {\n    // 에러 처리 1\n  },\n);\n```\n\n### 프로미스(Promise)\n\n프로미스는 비동기 작업의 최종 완료(또는 실패)와 그 결과 값을 나타내는 **객체** 이다.\n\n프로미스는 다음 세 가지 상태중 하나를 갖는다.\n\n- 대기(Pending): 초기 상태, 비동기 작업이 아직 완료되지 않음\n- 이행(Fullfilled): 비동기 작업이 성공적으로 완료됨. 결과 값을 가짐\n- 거부(Rejected): 비동기 작업이 실패함. 실패 이유(에러)를 가짐. 프로미스는 한번 상태가 결정되면(이행 또는 거부) 더 이상 변하지 않는(settled) 특징을 갖는다.\n\n```js\nfunction fetchData() {\n  return new Promise((resolve, reject) =\u003e {\n    setTimeout(() =\u003e {\n      const data = \"데이터가 도착했습니다\";\n      resolve(data); // 성공 시 resolve 호출\n      // 실패했다면: reject(new Error(\"데이터 로딩 실패\"));\n    }, 2000);\n  });\n}\n\nfetchData()\n  .then((data) =\u003e {\n    console.log(data); // \"데이터가 도착했습니다\"\n    return \"다음 작업을 위한 데이터\";\n  })\n  .then((nextData) =\u003e {\n    console.log(nextData); // \"다음 작업을 위한 데이터\"\n  })\n  .catch((error) =\u003e {\n    console.error(error); // 오류 처리\n  });\n```\n\n#### 프로미스 체이닝(Promise Chaining)\n\n프로미스 체이닝은 프로미스의 `.then()` 또는 `.catch()` 메서드가 항상 새로운 프로미스를 반환하는 특성을 이용하여 여러 비동기 작업을 순차적으로 연결하는 기법이다. `.then()` 핸들러는 이전 프로미스가 이행(fullfill)되면 호출되며, 그 결과 값을 받아 다음 작업을 수행하고, 또 다른 값이나 새로운 프로미스를 반환하여 체인을 이어갈 수 있다.\n\n```js\nfetch(\"user.json\") // 1. 사용자 정보 요청 (프로미스 반환)\n  .then((response) =\u003e response.json()) // 2. 응답을 JSON으로 파싱 (프로미스 반환)\n  .then((user) =\u003e fetch(`https://api.github.com/users/${user.name}`)) // 3. GitHub API 요청 (프로미스 반환)\n  .then((githubResponse) =\u003e githubResponse.json()) // 4. GitHub 응답 파싱 (프로미스 반환)\n  .then((githubUser) =\u003e {\n    // 5. 최종 결과 처리\n    console.log(githubUser.name);\n    return githubUser; // 다음.then으로 값을 전달할 수 있음\n  })\n  .catch((error) =\u003e {\n    // 에러 처리\n    console.error(\"오류 발생:\", error);\n  });\n```\n\n프로미스 체이닝은 비동기 코드의 흐름을 논리적이고 읽기 쉽게 만들어 콜백 지옥 문제를 해결하는 핵심적인 방법이다.\n\n#### 프로미스 메서드\n\n- `Promise.all()`: 여러 프로미스를 동시에 실행하고 모두 완료될 때까지 기다린다.\n- `Promise.race()`: 가장 먼저 완료되는 프로미스의 결과를 반환한다.\n- `Promise.allSettled()`: 모든 프로미스가 처리될 때까지 기다리고, 각 프로미스의 상태와 값을 반환한다.\n- `Promise.any()`: 가장 먼저 성공적으로 완료된 프로미스의 결과를 반환한다.\n\n### Async/Await\n\n`async`/`await` 는 프로미스를 기반으로 동작하는 비동기 처리 문법으로, 비동기 코드를 마치 동기 코드처럼 더 읽기 쉽고 간결하게 작성할 수 있도록 도와주는 문법이다.\n\n- `async`함수:\n  함수 선언 앞에 `async` 키워드를 붙여 정의한다. `async` 함수는 항상 프로미스를 반환한다. 함수 본문에서 명시적으로 프로미스를 반환하지 않더라고, 반환 값은 자동으로 `Promise.resolve()`로 감싸져 프로미스로 반환된다.\n\n- `await` 연산자:\n  `async` 함수 내부에서만 사용할 수 있다. `await` 뒤에는 주로 프로미스가 오며, 해당 프로미스가 처리될 때까지 `async`함수의 실행을 일시 중지시킨다.. 프로미스가 이행되면 `await` 표현식은 그 결과 값을 반환하고, 프로미스가 거부되면 에러를 던진다(`throw`)\n\n#### `async`/`await`에서의 에러 핸들링\n\n`try...catch`문을 사용하여 처리한다.\n\n- `try`블록 안에 `await`를 포함한 비동기 코드를 작성한다.\n- 만약 `await`한 프로미스가 거부되면, 에러가 발생(throw)하고 제어 흐름은 즉시 해당 `catch`블록으로 이동한다.\n- `catch`블록에서는 발생한 에러 객체를 받아 로깅, 사용자 알림, 대체 로직 수행 등 필요한 에러 처리를 수행할 수 있다.\n\n```js\nasync function getUserData(userId) {\n  try {\n    const response = await fetch(`/api/users/${userId}`);\n    if (!response.ok) {\n      throw new Error(`HTTP error! status: ${response.status}`); // 명시적 에러 발생\n    }\n    const userData = await response.json();\n    console.log(\"사용자 데이터:\", userData);\n    return userData;\n  } catch (error) {\n    console.error(\"사용자 데이터 로딩 중 오류 발생:\", error);\n    // 에러 처리 로직 (예: 기본값 반환, 에러 로깅 등)\n    return null; // 또는 에러를 다시 던질 수도 있음: throw error;\n  }\n}\n\n// async 함수는 항상 프로미스를 반환합니다\ngetUserData(123).then((result) =\u003e {\n  console.log(\"최종 결과:\", result);\n});\n```\n\n#### 병렬처리를 위한 성능 향상\n\n`async`/`await`는 코드를 간결하게 만들지만 `await`는 코드 실행을 멈추기 때문에, 서로 의존성이 없는 여러 개의 비동기 작업을 순차적으로 `await`하면 불필요하게 실행 시간이 길어질 수 있다.\n\n```js\n// 비효율적인 순차 실행\nasync function fetchSequential() {\n  const result1 = await fetch(\"/api/data1\"); // data1 완료 후 data2 시작\n  const result2 = await fetch(\"/api/data2\");\n  //...\n}\n\n// 효율적인 병렬 실행\nasync function fetchParallel() {\n  const [result1, result2] = await Promise.all([\n    fetch(\"/api/data1\"),\n    fetch(\"/api/data2\"),\n  ]); // data1과 data2를 동시에 요청하고 모두 완료될 때까지 기다림\n  //...\n}\n```\n"])</script><script>self.__next_f.push([1,"17:T158b,"])</script><script>self.__next_f.push([1,"자바스크립트는 기본적으로 '단일 스레드'언어이다. 이는 한 번에 하나의 작업만 수행할 수 있다는 의미이다. 그러나 웹 애플리케이션에서는 데이터 가져오기, 파일 읽기/쓰기 등 시간이 오래 걸리는 작업이 많이 있다. 이러한 작업을 동기적으로 처리한다면, 작업이 완료될 때까지 다른 모든 코드의 실행이 중단된다.\n비동기 프로그래밍은 이런 문제를 해결한다. 비동기 작업은 메인 실행 스레드를 차단하지 않고 백그라운드에서 실행되며, 작업이 완료되면 결과를 반환한다.\n\u003e [!caution]\n\u003e \"단일 스레드\" 라는것은 어디까지나 코드를 읽고 해석하고 실행시키는 작업만 해당된다. 자바스크립트 엔진은 실행 자체는 Node.js 나 브라우저에 업무를 위임하게 되는데 Node.js 나 브라우저는 멀티 스레드로 컴퓨팅하여 작업을 처리한다.\n초기 자바스크립트에서는 비동기 처리를 위해 콜백 함수를 사용했다. 콜백 함수는 다른 함수에 인수로 전달되어, 그 함수 내부에서 나중에 호출되는 함수를 의미한다. 비동기 처리에서는 특정 작업(예: 타이머 완료, 데이터 로딩 완료, 이벤트 발생)이 끝났을 때 실행될 로직을 콜백 함수 형태로 전달하는 방식으로 주로 사용된다. 비동기 작업을 시작하는 함수는 즉시 반환되고, 작업이 완료되면 미리 등록된 콜백 함수가 호출되어 결과를 처리하거나 다음 단계를 진행한다.\n여러 개의 비동기 작업을 순차적으로 처리해야 할 때 콜백 함수가 계속해서 중첩되어 코드의 들여쓰기 수준이 깊어지고 가독성이 극도로 나빠지는 상황을 말한다.\n콜백 지옥은 콜백 패턴의 한계를 보여주는 대표적인 예시이며 이러한 문제를 해결하기 위해 promise와 async/await같은 더 나은 비동기 처리 패턴이 등장하게 되었다.\n1. 가독성 저하: 코드가 오른쪽으로 계속 길어져 전체 로직을 파악하기 어렵다.\n2. 에러 처리의 어려움: 각 콜백 단계마다 에러 처리를 별도로 해주어야 하며, 에러가 발생했을 때 어디서 문제가 생겼는지 추적하기 어렵다.\n3. 유지보수 어려움: 코드 수정이나 기능 추가 시 복잡한 중첩 구조 때문에 실수를 유발하기 쉽다.\n프로미스는 비동기 작업의 최종 완료(또는 실패)와 그 결과 값을 나타내는 객체 이다.\n프로미스는 다음 세 가지 상태중 하나를 갖는다.\n대기(Pending): 초기 상태, 비동기 작업이 아직 완료되지 않음\n이행(Fullfilled): 비동기 작업이 성공적으로 완료됨. 결과 값을 가짐\n거부(Rejected): 비동기 작업이 실패함. 실패 이유(에러)를 가짐. 프로미스는 한번 상태가 결정되면(이행 또는 거부) 더 이상 변하지 않는(settled) 특징을 갖는다.\n프로미스 체이닝은 프로미스의 .then() 또는 .catch() 메서드가 항상 새로운 프로미스를 반환하는 특성을 이용하여 여러 비동기 작업을 순차적으로 연결하는 기법이다. .then() 핸들러는 이전 프로미스가 이행(fullfill)되면 호출되며, 그 결과 값을 받아 다음 작업을 수행하고, 또 다른 값이나 새로운 프로미스를 반환하여 체인을 이어갈 수 있다.\n프로미스 체이닝은 비동기 코드의 흐름을 논리적이고 읽기 쉽게 만들어 콜백 지옥 문제를 해결하는 핵심적인 방법이다.\nPromise.all(): 여러 프로미스를 동시에 실행하고 모두 완료될 때까지 기다린다.\nPromise.race(): 가장 먼저 완료되는 프로미스의 결과를 반환한다.\nPromise.allSettled(): 모든 프로미스가 처리될 때까지 기다리고, 각 프로미스의 상태와 값을 반환한다.\nPromise.any(): 가장 먼저 성공적으로 완료된 프로미스의 결과를 반환한다.\nasync/await 는 프로미스를 기반으로 동작하는 비동기 처리 문법으로, 비동기 코드를 마치 동기 코드처럼 더 읽기 쉽고 간결하게 작성할 수 있도록 도와주는 문법이다.\nasync함수:\n함수 선언 앞에 async 키워드를 붙여 정의한다. async 함수는 항상 프로미스를 반환한다. 함수 본문에서 명시적으로 프로미스를 반환하지 않더라고, 반환 값은 자동으로 Promise.resolve()로 감싸져 프로미스로 반환된다.\nawait 연산자:\nasync 함수 내부에서만 사용할 수 있다. await 뒤에는 주로 프로미스가 오며, 해당 프로미스가 처리될 때까지 async함수의 실행을 일시 중지시킨다.. 프로미스가 이행되면 await 표현식은 그 결과 값을 반환하고, 프로미스가 거부되면 에러를 던진다(throw)\ntry...catch문을 사용하여 처리한다.\ntry블록 안에 await를 포함한 비동기 코드를 작성한다.\n만약 await한 프로미스가 거부되면, 에러가 발생(throw)하고 제어 흐름은 즉시 해당 catch블록으로 이동한다.\ncatch블록에서는 발생한 에러 객체를 받아 로깅, 사용자 알림, 대체 로직 수행 등 필요한 에러 처리를 수행할 수 있다.\nasync/await는 코드를 간결하게 만들지만 await는 코드 실행을 멈추기 때문에, 서로 의존성이 없는 여러 개의 비동기 작업을 순차적으로 await하면 불필요하게 실행 시간이 길어질 수 있다."])</script><script>self.__next_f.push([1,"18:Taa1,"])</script><script>self.__next_f.push([1,"\n# Javascript는 어떻게 비동기 처리가 가능한 것인가\n\n자바스크립트 엔진 자체는 싱글 스레드 기반으로 동작하여 한번에 하나의 작업만 처리할 수 있는 [[콜 스택(Call Stack)이란 무엇인가|콜 스택]] 을 갖는다. 하지만 자바스크립트가 실행되는 환경(웹 브라우저나 Node.js)은 자바스크립트 엔진 외에도 비동기 작업을 처리하는 별도의 API(Web API 또는 C++API)와 여러개의 큐(Queue), 그리고 이들을 조율하는 **이벤트 루프(Event Loop)**를 제공한다. 이 구조 덕분에 싱글 스레드 입에도 불구하고 논블로킹(none-blocking) 방식으로 비동기 처리가 가능하다\n\n참고: [[Javascript에서의 비동기 함수]]\n\n## 이벤트 루프\n\n자바스크립트의 비동기 프로그래밍 모델의 핵심 메커니즘\n\n![eventloop](_assets/attachments/eventloop.gif)\n\n- 콜 스택(Call Stack): 현재 실행중인 함수의 실행 컨텍스트를 저장하는 LIFO 구조의 스택이다. 동기적인 코드 실행을 담당한다.\n- Web API/Node.js API: `setTimeout`,`setInterval`,DOM 이벤트 리스터, `fetch`(네트워크 요청), 파일 I/O등 비동기 작업을 처리하는 환경 제공 기능이다. 이 작업들은 자바스크립트 엔진의 메인 스레드 밖에서 수행된다.\n- 태스크 큐(Task Queue/Macrotask Queue): Web API등에서 완료된 비동기 작업의 [[콜백 함수(Callback Function)란 무엇인가|콜백 함수]]들이 대기하는 FIFO구조의 큐이다. `setTimeout`,`setInterval`콜백, I/O 완료 콜백, UI렌더링 작업 등이 여기에 해당한다.\n- 마이크로태스크 큐(Microtask Queue): 태스크 큐와 유사하지만, 더 높은 우선순위를 가진다. `Promise콜백 함수(Callback Function)이란 무엇인가`의 `.then()`,`.catch()`,`.finally()`콜백, `queueMicrotask()`,`MutationObserver`콜백 등이 여기에 해당한다.\n\n- 이벤트 루프(Event Loop): 콜 스택과 큐들을 지속적으로 감시하는 프로세스\n  1.  콜 스택 확인: 콜 스택이 비어있는지 확인한다.\n  2.  마이크로태스크 큐 처리: 콜 스택이 비어 있다면, 마이크로태스크 큐에 있는 모든 콜백 함수를 순서대로 꺼내어 콜스택에 넣고 실핸한다. 마이크로태스크 실행 중 새로운 마이크로태스크가 추가되면 이 역시 현재 루프 주기 내에서 모두 처리된다.\n  3.  매크로태스크 큐 처리:마이크로태스크 큐가 비워니 후 (그리고 필요한 UI 렌더링 등이 수행된 후), 매크로태스크 큐에서 하나의 콜백 함수를 꺼내어 콜 스택에 넣고 실핸한다.\n  4.  위 과정을 계속 반복한다.\n"])</script><script>self.__next_f.push([1,"19:T16bc,"])</script><script>self.__next_f.push([1,"\n# 프로토타입(Prototype)과 프로토타입 상속\n\n## 프로토타입\n\n자바스크립트의 모든 객체는 자신의 **원형(Prototype)** 이 되는 다른 객체와 내부적으로 연결되어 있다. 이 연결댄 객체를 '프로토타입 객체'또는 간단히 '프로토타입'이라고 부른다. 객체는 이 프로토타입으로부터 속성(property)과 메서드(method)를 상속받을 수 있다. 객체의 프로토타입은 내부 슬롯 `[[Prototype]]`에 저장되며, 일반적으로 `Object.getPrototypeOf()`메서드나 (비표준이지만 널리 사용되는) `__proto__` 접근자 속성을 통해 접근할 수 있다.\n\n프로토 타입과 프로토 타입 체인은 자바스크립트에서 상속과 코드 재사용을 구현하는 근본적인 메커니즘 이다.\n\n### 프로토타입 체인(Prototype Chain)\n\n어떤 객체의 속성이나 메서드에 접근하려고 할 때, 자바스크립트 엔진은 먼저 해당 객체 자체에서 찾는다. 만약 찾지 못하면, 내부 `[[Prototype]]`링크를 따라 프로토타입 객체로 이동하여 다시 찾는다. 이 과정을 포로토타입 객체의 포로토타입으로 계속 올라가며 반복하게 되는데, 이 연결된 프로토타입들의 연쇄를 프로토타입 체인이라고 한다. 체인의 가장 마지막에는 일반적으로 `Object.prototype`이 있으며, 이 객체의 프로토타입은 `null`이므로 여기서 탐색이 종료된다.\n\n## 프로토타입 기반 상속은 의 동작방식\n\n프로토타입 기반 상속은 객체가 자신의 프로토타입으로부터 속성과 메서드를 물려받는 방식으로 동작한다.\n\n1. 속성/메서드 탐색: 객체의 특정 속성이나 메서드에 접근할 때, 엔진은 먼저 객체 자신에게 해당 속성/메서드가 있는지 확인한다.\n2. 체인 탐색: 객체 자신에게 없다면, `[[Prototype]]` 링크를 따라 프로토타입 객체로 이동하여 해당 속성/메서드를 찾는다.\n3. 반복: 프로토타입 객체에도 없다면, 다시 그 객체의 프로토타입으로 이동하여 찾는 과정을 프로토타입 체인을 따라 반복한다.\n4. 종료: 속성/메서드를 찾으면 그 값을 반환하고 탐색을 종료한다. 체인의 끝(`null`)에 도달할 때까지 찾지 못하면 `undefined`를 반환한다.\n\n```js\nlet animal = {\n  eats: true,\n  walk() {\n    console.log(\"동물이 걷고 있습니다.\");\n  },\n};\n\nlet rabbit = {\n  jumps: true,\n  __proto__: animal,\n};\nrabbit.walk(); // \"동물이 걷고 있습니다.\" - animal 에서 상속받은 메서드\nconsole.log(rabbit.eats); // true - animal 에서 상속받은 속성\n```\n\n### 상속 구현\n\n#### 생성자 함수\n\n**생성자 함수**를 사용하여 객체를 생성할 때, 생성자 함수의 `prototype` 속성이 가리키는 객체는 생성된 인스턴스들의 프로토타입이 된다. 따라서 생성자 함수의 `porototype`에 메서드를 추가하면, 모든 인스턴스는 프로토타입 체인을 통해 해당 메서드를 공유하고 사용할 수 있다. `Object.create()`메서드를 사용하면 명시적으로 특정 객체를 프로토타입으로 하는 새로운 객체를 생성하여 상속 관계를 만들 수도 있다.\n\n```js\nfunction Animal(name) {\n  this.name = name;\n}\n\n//Animal 의 prototype 객체에 speak 메서드 추가\nAnimal.prototype.speak = function () {\n  console.log(`${this.name} make a noise.`);\n};\n\nconst dog = new Animal(\"Dog\");\ndog.speak(); // dog 객체 자체에는 speak가 없지만, 프로토타입 체인을 통해 Animal.prototype.speak을 찾아 실행\n\nconsole.log(dog.__proto__ === Animal.prototype); //true\nconsole.log(Animal.prototype.isPrototypeOf(dog)); //true\n```\n\n#### 다른 방법들\n\n1. `__proto__`사용 (권장되지 않음)\n\n```js\nlet animal = { eats: true };\nlet rabbit = { jumps: true };\n\nrabbit.__proto__ = animal; // 상속 설정\n```\n\n2. `Object.create()`사용 (권장됨)\n\n```js\nlet animal = { eats: true };\nlet rabbit = Object.create(animal); // animal을 프로토타입으로 하는 새 객체 생성\nrabbit.jumps = true;\n```\n\n3. `Object.setPrototypeOf()`사용\n\n```js\nlet animal = { eats: true };\nlet rabbit = { jumps: true };\nObject.setPrototypeOf(rabbit, animal); // rabbit의 프로토타입을 animal로 설정\n```\n\n### 프로토타입 상속의 핵심 특징\n\n1. 동적 특성: 프로토타입을 변경하면 해당 프로토타입을 상속받은 모든 객체에 영향을 미친다.\n2. 메모리 효율성: 모든 인스턴스가 메서드를 복제하지 않고 프로토타입의 메서드를 참조하므로 메모리를 절약한다.\n3. 속성 가리기(Property Shadowing): 객체가 프로토타입과 동일한 이름의 속성을 가지면 프로토타입의 속성을 가린다.\n\n## 클래스와 프로토타입\n\nES6부터 도입된 클래스 문법도 내부적으로는 프로토타입을 사용한다.\n\n```js\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n\n  walk() {\n    console.log(`${this.name}이(가) 걷고 있습니다`);\n  }\n}\n\nclass Rabbit extends Animal {\n  constructor(name, earLength) {\n    super(name);\n    this.earLength = earLength;\n  }\n\n  jump() {\n    console.log(`${this.name}이(가) 점프합니다`);\n  }\n}\n\nlet rabbit = new Rabbit(\"흰토끼\", 10);\nrabbit.walk(); // \"흰토끼이(가) 걷고 있습니다\" - 상위 클래스에서 상속받은 메서드\nrabbit.jump(); // \"흰토끼이(가) 점프합니다\"\n```\n\n## 주의점\n\n1. 프로토타입 체인 깊이: 체인이 너무 깊으면 성능에 영향을 미칠 수 있다.\n2. 순환 참조: 프로토타입 체인에 순환 참조가 생기지 않도록 주의해야 한다.\n3. 내장 프로토타입 수정: 내장 객체(Array Object 등)의 프로토타입을 수정하는 것은 위험할 수 있다.\n"])</script><script>self.__next_f.push([1,"1a:Te42,"])</script><script>self.__next_f.push([1,"자바스크립트의 모든 객체는 자신의 원형(Prototype) 이 되는 다른 객체와 내부적으로 연결되어 있다. 이 연결댄 객체를 '프로토타입 객체'또는 간단히 '프로토타입'이라고 부른다. 객체는 이 프로토타입으로부터 속성(property)과 메서드(method)를 상속받을 수 있다. 객체의 프로토타입은 내부 슬롯 Prototype]]에 저장되며, 일반적으로 Object.getPrototypeOf()메서드나 (비표준이지만 널리 사용되는) __proto__ 접근자 속성을 통해 접근할 수 있다.\n프로토 타입과 프로토 타입 체인은 자바스크립트에서 상속과 코드 재사용을 구현하는 근본적인 메커니즘 이다.\n어떤 객체의 속성이나 메서드에 접근하려고 할 때, 자바스크립트 엔진은 먼저 해당 객체 자체에서 찾는다. 만약 찾지 못하면, 내부 [[Prototype]]링크를 따라 프로토타입 객체로 이동하여 다시 찾는다. 이 과정을 포로토타입 객체의 포로토타입으로 계속 올라가며 반복하게 되는데, 이 연결된 프로토타입들의 연쇄를 프로토타입 체인이라고 한다. 체인의 가장 마지막에는 일반적으로 Object.prototype이 있으며, 이 객체의 프로토타입은 null이므로 여기서 탐색이 종료된다.\n프로토타입 기반 상속은 객체가 자신의 프로토타입으로부터 속성과 메서드를 물려받는 방식으로 동작한다.\n1. 속성/메서드 탐색: 객체의 특정 속성이나 메서드에 접근할 때, 엔진은 먼저 객체 자신에게 해당 속성/메서드가 있는지 확인한다.\n2. 체인 탐색: 객체 자신에게 없다면, [[Prototype 링크를 따라 프로토타입 객체로 이동하여 해당 속성/메서드를 찾는다.\n3. 반복: 프로토타입 객체에도 없다면, 다시 그 객체의 프로토타입으로 이동하여 찾는 과정을 프로토타입 체인을 따라 반복한다.\n4. 종료: 속성/메서드를 찾으면 그 값을 반환하고 탐색을 종료한다. 체인의 끝(null)에 도달할 때까지 찾지 못하면 undefined를 반환한다.\n생성자 함수를 사용하여 객체를 생성할 때, 생성자 함수의 prototype 속성이 가리키는 객체는 생성된 인스턴스들의 프로토타입이 된다. 따라서 생성자 함수의 porototype에 메서드를 추가하면, 모든 인스턴스는 프로토타입 체인을 통해 해당 메서드를 공유하고 사용할 수 있다. Object.create()메서드를 사용하면 명시적으로 특정 객체를 프로토타입으로 하는 새로운 객체를 생성하여 상속 관계를 만들 수도 있다.\n1. __proto__사용 (권장되지 않음)\n2. Object.create()사용 (권장됨)\n3. Object.setPrototypeOf()사용\n1. 동적 특성: 프로토타입을 변경하면 해당 프로토타입을 상속받은 모든 객체에 영향을 미친다.\n2. 메모리 효율성: 모든 인스턴스가 메서드를 복제하지 않고 프로토타입의 메서드를 참조하므로 메모리를 절약한다.\n3. 속성 가리기(Property Shadowing): 객체가 프로토타입과 동일한 이름의 속성을 가지면 프로토타입의 속성을 가린다.\nES6부터 도입된 클래스 문법도 내부적으로는 프로토타입을 사용한다.\n1. 프로토타입 체인 깊이: 체인이 너무 깊으면 성능에 영향을 미칠 수 있다.\n2. 순환 참조: 프로토타입 체인에 순환 참조가 생기지 않도록 주의해야 한다.\n3. 내장 프로토타입 수정: 내장 객체(Array Object 등)의 프로토타입을 수정하는 것은 위험할 수 있다."])</script><script>self.__next_f.push([1,"1b:T1309,"])</script><script>self.__next_f.push([1,"\n# `this`키워드\n\n`this`는 함수가 호출될 때 해당 함수가 속한 [[실행컨텍스트(Execution Context)]]를 가리키는 특별한 키워드 이다.\n\n중요한 점은 `this`의 값은 함수가 어디서 선언되었는지가 아니라, 어떻게 호출되었는지에 따라 동적으로 결정된다는 것이다. 이는 렉시컬 스코프(선언 위치에 따라 결정)와 대조되는 특징이다.\n\n`this`는 자바스크립트에서 가장 혼란스러운 개념 중 하나이며, 객체 지향 프로그래밍과 이벤트 처리 등에서 중요한 역할을 한다.\n\n`this` 키워드를 둘러싼 혼란은 주로 그것의 동적인 성격과 렉시컬 스코프 규칙과의 차이에서 비롯된다. 변수나 함수의 스코프는 코드가 작성된 위치(렉시컬 구조)에 따라 정적으로 결정되지만, 일반 함수의 `this`는 함수가 어떻게 호출되었는지(동적 컨텍스트)에 따라 달라진다. 이 불일치 때문에 특히 콜백 함수나 중첩 함수 내에서 `this`가 예기치 않게 전역 객체나 `undefined`를 가리키는 문제가 자주 발행했다.\n\n과거에는 이를 해결하기 위해 `var self = this;` 트릭이나 `.bind(this)` 메서드를 사용해야 했다. 화살표 함수는 이러한 문제를 해결하기 위한 방안 중 하나로 도입되었다.\n\n화살표 함수는 자체`this`바인딩을 갖지 않고, 대신 변수처럼 렉시컬 스코프 규칙을 따라 상위 스코프의 `this`를 그대로 물려받는다. 이 덕분에 중첩된 컨텍스트에서도 `this`의 동작이 더 예측 가능해지고, 콜백 함수 등에서 `this`관련 코드가 훨씬 간결해졌다. 따라서 화살표 함수가 `this`를 다르게 처리하는 이우(렉시컬 상속)와 해결하는 문제(동적 `this`의 혼란)를 이해하는 것은 단순히 문법적 차이를 아는것 이상으로 중요하다.\n\n## 함수 호출 방식에 따른`this` 바인딩 규칙\n\n1. 일반 함수 호출(Function invocation): 함수가 단독으로 호출될 때(`myFunction()`).\n\n   - 비엄격 모드(Non-strict mode): `this`는 전역 객체 (`window`또는 `global`)를 가리킨다.\n   - 엄격 모드(Strict mode): `this`는 `undefined`를 가리킨다. 이는 실수로 전역 객체를 오염시키는 것을 방지한다.\n\n2. 메서드 호출(Method Invocation): 함수가 객체의 속성으로서 호출될 때(`object.myMethod()`).\n\n   - `this`는 해당 메서드를 호출한 객체(점`.` 앞의 객체)를 가리킨다.\n\n3. 생성자 함수 호출(Constructor Invocation):`new` 키워드를 사용하여 함수(생성자)를 호출할 때 (`new MyConstructor()`).\n\n   - `this`는 새로 생성되는 인스턴스 객체를 가리킨다.\n\n4. `call()`,`apply()`,`bind()` 메서드를 이용한 간접 호출 (Indirect Invocation): 이 메서드들은 함수를 호출하면서 `this`값을 명시적으로 지정할 수 있게 해준다.\n\n   - `func.call(thisArg,arg1,arg2,...)`: 함수를 호출하며, 첫 번째 인자로 전달된 `thisArg`가 함수 내부의 `this`가 된다. 나머지 인자들은 함수의 매개변수로 순서대로 전달된다.\n\n   ```js\n   function introduce(greeting) {\n     console.log(`${greeting}, 저는 ${this.name}입니다.`);\n   }\n   const person = { name: \"다니엘라\" };\n   introduce.call(person, \"안녕하세요\"); // \"안녕하세요, 저는 다니엘라입니다.\"\n   ```\n\n   - `func.apply(thisArg, [arg1,arg2,...])`: `call`과 유사하지만, 함수의 매개 변수들을 배열 형태로 전달한다.\n\n   ```js\n   function introduce(greeting, punctuation) {\n     console.log(`${greeting}, 저는 ${this.name}입니다${punctuation}`);\n   }\n   const person = { name: \"다니엘라\" };\n   introduce.apply(person, [\"안녕하세요\", \"!\"]); // \"안녕하세요, 저는 다니엘라입니다!\"\n   ```\n\n   - `func.bind(thisArg)`: 함수를 즉시 호출하지 않고, `this`값이 `thisArg`로 영구히 바인딩된 새로운 함수를 반환한다. 반환된 함수는 나중에 호출해도 `this`값이 고정된다.\n\n   ```js\n   function introduce() {\n     console.log(`안녕하세요, 저는 ${this.name}입니다`);\n   }\n   const person = { name: \"다니엘라\" };\n   const boundFunction = introduce.bind(person);\n   boundFunction(); // \"안녕하세요, 저는 다니엘라입니다\"\n   ```\n\n## 화살표 함수의 `this` 는 일반 함수와 어떻게 다른가\n\n화살표 함수는 자신만의 `this`를 가지지 않는다. 대신, 화살표 함수 내부의 `this`는 함수가 선언될 당시읠 외부(상위) 스코프의 `this` 값을 그대로 상속받아 사용한다(렉시컬`this`). 즉,함수가 어디서 정의되었는지에 따라 `this`가 결정된다.\n\n이는 `call`,`apply`,`bind`메서드를 사용하여 화살표 함수의 `this` 값을 변경할 수 없음을 의미한다.\n"])</script><script>self.__next_f.push([1,"1c:Te93,"])</script><script>self.__next_f.push([1,"this는 함수가 호출될 때 해당 함수가 속한 실행컨텍스트(Execution Context)를 가리키는 특별한 키워드 이다.\n중요한 점은 this의 값은 함수가 어디서 선언되었는지가 아니라, 어떻게 호출되었는지에 따라 동적으로 결정된다는 것이다. 이는 렉시컬 스코프(선언 위치에 따라 결정)와 대조되는 특징이다.\nthis는 자바스크립트에서 가장 혼란스러운 개념 중 하나이며, 객체 지향 프로그래밍과 이벤트 처리 등에서 중요한 역할을 한다.\nthis 키워드를 둘러싼 혼란은 주로 그것의 동적인 성격과 렉시컬 스코프 규칙과의 차이에서 비롯된다. 변수나 함수의 스코프는 코드가 작성된 위치(렉시컬 구조)에 따라 정적으로 결정되지만, 일반 함수의 this는 함수가 어떻게 호출되었는지(동적 컨텍스트)에 따라 달라진다. 이 불일치 때문에 특히 콜백 함수나 중첩 함수 내에서 this가 예기치 않게 전역 객체나 undefined를 가리키는 문제가 자주 발행했다.\n과거에는 이를 해결하기 위해 var self = this; 트릭이나 .bind(this) 메서드를 사용해야 했다. 화살표 함수는 이러한 문제를 해결하기 위한 방안 중 하나로 도입되었다.\n화살표 함수는 자체this바인딩을 갖지 않고, 대신 변수처럼 렉시컬 스코프 규칙을 따라 상위 스코프의 this를 그대로 물려받는다. 이 덕분에 중첩된 컨텍스트에서도 this의 동작이 더 예측 가능해지고, 콜백 함수 등에서 this관련 코드가 훨씬 간결해졌다. 따라서 화살표 함수가 this를 다르게 처리하는 이우(렉시컬 상속)와 해결하는 문제(동적 this의 혼란)를 이해하는 것은 단순히 문법적 차이를 아는것 이상으로 중요하다.\n1. 일반 함수 호출(Function invocation): 함수가 단독으로 호출될 때(myFunction()).\n비엄격 모드(Non-strict mode): this는 전역 객체 (window또는 global)를 가리킨다.\n엄격 모드(Strict mode): this는 undefined를 가리킨다. 이는 실수로 전역 객체를 오염시키는 것을 방지한다.\n2. 메서드 호출(Method Invocation): 함수가 객체의 속성으로서 호출될 때(object.myMethod()).\nthis는 해당 메서드를 호출한 객체(점. 앞의 객체)를 가리킨다.\n3. 생성자 함수 호출(Constructor Invocation):new 키워드를 사용하여 함수(생성자)를 호출할 때 (new MyConstructor()).\nthis는 새로 생성되는 인스턴스 객체를 가리킨다.\n4. call(),apply(),bind() 메서드를 이용한 간접 호출 (Indirect Invocation): 이 메서드들은 함수를 호출하면서 this값을 명시적으로 지정할 수 있게 해준다.\nfunc.call(thisArg,arg1,arg2,...): 함수를 호출하며, 첫 번째 인자로 전달된 thisArg가 함수 내부의 this가 된다. 나머지 인자들은 함수의 매개변수로 순서대로 전달된다.\nfunc.apply(thisArg, [arg1,arg2,...]): call과 유사하지만, 함수의 매개 변수들을 배열 형태로 전달한다.\nfunc.bind(thisArg): 함수를 즉시 호출하지 않고, this값이 thisArg로 영구히 바인딩된 새로운 함수를 반환한다. 반환된 함수는 나중에 호출해도 this값이 고정된다.\n화살표 함수는 자신만의 this를 가지지 않는다. 대신, 화살표 함수 내부의 this는 함수가 선언될 당시읠 외부(상위) 스코프의 this 값을 그대로 상속받아 사용한다(렉시컬this). 즉,함수가 어디서 정의되었는지에 따라 this가 결정된다.\n이는 call,apply,bind메서드를 사용하여 화살표 함수의 this 값을 변경할 수 없음을 의미한다."])</script><script>self.__next_f.push([1,"1d:T9e0,"])</script><script>self.__next_f.push([1,"\n# 실행컨텍스트(Execution Context)\n\n실행 컨텍스트는 **Javascript 코드가 실행되는 환경**에 대한 추상적인 개념이다. **코드가실행될 때마다 자바스크립트 엔진은 해당 코드의 실행 환경을 나타내는 실행 컨텍스트를 생성하고 관리**한다. 실행 컨텍스트는 **코드가 실행되는 데 필요한 모든 정보**(변수, 함수 선언, 스코프 체인, `this`값 등)을 담고있다.\n\n실행 컨텍스트는 자바스크립트 엔진이 코드를 어떻게 해석하고 실행하는지 이해하는 데 핵심적인 개념이다. 스코프, 호이스팅, 클로저, `this` 바인딩 등 중요한 언어적 틍징드이 모두 실행 컨텍스트의 생서 및 관리 메커니즘과 관련되어 있다.\n\n## 종류\n\n1. 전역 실행 컨텍스트(Global Execution Context, GEC)\n\n   - 코드를 실행하면 가장 먼저 생성되는 컨텍스트\n   - 브라우저에서는 `window`객체, Node.js에서는 `global`객체를 생성\n   - 프로그램에 하나만 존재\n\n2. 함수 실행 컨텍스트(Function Execution Context, FEC)\n   - 함수가 호출될 때 생성\n   - 각 함수는 자신만의 실행 컨텍스트를 가짐\n\n- Eval 실행 컨텍스트(Eval Execution Context, EXC)\n  - `eval()`함수 내에서 실행되는 코드를 위한 컨텍스트\n  - 보안 문제로 잘 사용하지 않음\n\n## 구성 요소 (논리적)\n\n1. 변수 환경(Variable Environment)\n\n   - 변수 선언(`var`)과 함수 산언문이 저장됨\n   - 호이스팅이 일어나는 공간\n\n2. 렉시컬 환경(Lexical Environment)\n\n   - 변수 환경의 확장된 개념\n   - `let`,`const`로 선언된 변수가 저장됨\n   - 블록 스코프를 지원\n   - 외부 환경에 대한 참조(Outer Environment Reference)를 포함\n     변수 참조시 현제 환경에서 찾지 못하면[[스코프(Scope)란 무엇인가|스코프 체인]]이 발생함\n\n3. `this`바인딩\n\n   - 현재 컨텍스트에서[[`this`키워드|`this`]]가 가리키는 대상\n\n## 실행 컨텍스트의 생성 및 실행 과정\n\n1. 생성 단계(Creation Phase)\n\n   - 변수와 함수 선언을 메모리에 저장(호이스팅)\n   - `var`로 선언된 변수는 `undefined`로 초기화\n   - `let`, `const`로 선언된 변수는 초기화되지 않고 TDZ(Temporal Dead Zone)에 들어감\n   - `this` 바인딩이 결정됨\n\n2. 실행 단계(Execution Phase)\n\n   - 코드를 한줄 씩 실행\n   - 변수에 실제 값 할당\n   - 함수 호출시 새로운 실행 컨텍스트 생성\n"])</script><script>self.__next_f.push([1,"1e:T878,"])</script><script>self.__next_f.push([1,"실행 컨텍스트는 Javascript 코드가 실행되는 환경에 대한 추상적인 개념이다. 코드가실행될 때마다 자바스크립트 엔진은 해당 코드의 실행 환경을 나타내는 실행 컨텍스트를 생성하고 관리한다. 실행 컨텍스트는 코드가 실행되는 데 필요한 모든 정보(변수, 함수 선언, 스코프 체인, this값 등)을 담고있다.\n실행 컨텍스트는 자바스크립트 엔진이 코드를 어떻게 해석하고 실행하는지 이해하는 데 핵심적인 개념이다. 스코프, 호이스팅, 클로저, this 바인딩 등 중요한 언어적 틍징드이 모두 실행 컨텍스트의 생서 및 관리 메커니즘과 관련되어 있다.\n1. 전역 실행 컨텍스트(Global Execution Context, GEC)\n코드를 실행하면 가장 먼저 생성되는 컨텍스트\n브라우저에서는 window객체, Node.js에서는 global객체를 생성\n프로그램에 하나만 존재\n2. 함수 실행 컨텍스트(Function Execution Context, FEC)\n함수가 호출될 때 생성\n각 함수는 자신만의 실행 컨텍스트를 가짐\nEval 실행 컨텍스트(Eval Execution Context, EXC)\neval()함수 내에서 실행되는 코드를 위한 컨텍스트\n보안 문제로 잘 사용하지 않음\n1. 변수 환경(Variable Environment)\n변수 선언(var)과 함수 산언문이 저장됨\n호이스팅이 일어나는 공간\n2. 렉시컬 환경(Lexical Environment)\n변수 환경의 확장된 개념\nlet,const로 선언된 변수가 저장됨\n블록 스코프를 지원\n외부 환경에 대한 참조(Outer Environment Reference)를 포함\n변수 참조시 현제 환경에서 찾지 못하면스코프 체인이 발생함\n3. this바인딩\n현재 컨텍스트에서this가 가리키는 대상\n1. 생성 단계(Creation Phase)\n변수와 함수 선언을 메모리에 저장(호이스팅)\nvar로 선언된 변수는 undefined로 초기화\nlet, const로 선언된 변수는 초기화되지 않고 TDZ(Temporal Dead Zone)에 들어감\nthis 바인딩이 결정됨\n2. 실행 단계(Execution Phase)\n코드를 한줄 씩 실행\n변수에 실제 값 할당\n함수 호출시 새로운 실행 컨텍스트 생성"])</script><script>self.__next_f.push([1,"1f:T17ce,"])</script><script>self.__next_f.push([1,"\n# 클로저(Closure)란 무엇인가\n\n클로저는 함수와 그 **함수가 선언된 렉시컬 환경(Lexical Environment)의 조합**이다. 간단하게 **함수가 자신이 생성될 때의 환경(변수)을 기억하는 현상**을 말한다.\n\n클로저는 자바스크립트의 핵심 개념 중 하나로, 함수형 프로그래밍 패러다임과 다양한 디자인 패턴을 구현하는 데 필수적이다.\n\n클로저는 단순히 내부 함수가 외부 변수에 접근하는 현상을 넘어, 자바스크립트의 렉시컬 스코핑 규칙과 실행 컨텍스트가 외부 환경 참조를 유지하는 방식의 자연스러운 결과이다. 외부 함수가 실행될때 생성된 실행 컨텍스트의 렉시컬 환경은, 그 내부에서 정의된 함수가 외부로 반환되거나 다른 곳에서 참조될 경우, 해당 내부 함수에 의해 계속 참조된다.\n\n이 견결고리 때문에 외부 함수의 실행이 끝나도 관련 환경이 메모리에서 사라지지 않는 것이다. 모듈 패턴은 이러한 클로저의 특성을 활용한 대표적인 예시이다. IIFE나 일반 함수를 사용하여 '비공개' 스코프(외부 함수의 렉시컬 환경)을 만들고, 이 스코프에 접근할 수 있는 '공개'메서드(내부 함수)들을 객체 형태로 반환함으로써 데이터 캡슐화를 구현한다. 따라서 클로저를 실행 컨텍스트와 렉시컬 환경의 관점에서 이해하면, 그 작동 원리와 모듈 패턴과 같은 실제 활영 사례를 더 근본적으로 파악할 수 있다.\n\n\u003e [!tip]\n\u003e\n\u003e 클로저가 발생하는 이유는 객체인 함수를 변수에 할당하면서 가능해 진다. 즉 객체로서 변수에 할당된 함수를 지속적으로 참조할 수 있는 것이다. 변수에 담지 않고 그저 함수를 사용하면 함수가 실행되고 사라지면 실행 컨텍스트도 같이 정리 되어야 하지만 변수는 남아 있기 때문에 해당 한수가 선언된 변수를 담고 있는 컨텍스트가 정리되기 전까지는 유지되는 것이다. 렉시컬 스코프 때문에 가능한 일\n\n## 핵심 개념\n\n1. 렉시컬 스코핑(Lexical Scoping): 함수가 선언된 위치에 따라 상위 스코프가 결정된다.\n2. 변수의 생존: 함수가 선언된 함수의 변수들이 함수가 호출될 때까지 메모리에 유지된다.\n3. 캡슐화(Encapsulation): 데이터와 그 데이터를 조작하는 마수를 하나의 단위로 묶는다.\n\n\u003e [!example]\n\u003e\n\u003e ```js\n\u003e function createCounter() {\n\u003e   let count = 0; // 외부에서 직접 접근할 수 없는 변수\n\u003e   return function () {\n\u003e     count += 1; // 외부 함수의 변수를 참조\n\u003e     return count;\n\u003e   };\n\u003e }\n\u003e const counter = createCounter();\n\u003e\n\u003e console.log(counter()); //1\n\u003e console.log(counter()); //2\n\u003e console.log(counter()); //3\n\u003e ```\n\u003e\n\u003e 이 예제이서 `createCounter`는 내부 함수를 반환한다. 내부 함수는 `count` 변수를 참조하고 있으며, 원래라면 `createCounter`함수가 실행을 마치면 `count`변수는 사라져야 하지만, 클로저 덕분에 내부 함수가 `count`변수를 계속 기억하고 접근할 수 있다.\n\n## 활용 사례\n\n1. 데이터 은닉과 캡슐화\n   외부에서 직접 접근할 수 없는 비공개(private) 변수를 만들고, 오직 클로저를 통해 노출된 함수(메서드)를 통해서만 이 변수에 접근하거나 조작하도록 할 수 있다. 이는 객체 지향 프로그래밍의 캡슐화와 유사한 효과를 제공한다.\n\n   ```js\n   function createPerson(name) {\n     let _name = name; // 비공개 변수\n     return {\n       getName: function () {\n         // 공개 메서드 (클로져)\n         return _name;\n       },\n       setName: function (newName) {\n         // 공개 메서드 (클로져)\n         _name = newName;\n       },\n     };\n   }\n   const person = creaatePerson(\"Alice\");\n   console.log(person.getName()); // \"Alice\"\n   console.log(person._name); //undefined  (직접 접근 불가)\n   person.setName(\"Bob\");\n   console.log(person.getName()); // \"Bob\"\n   ```\n\n2. 상태 유지\n   함수 호출이 끝나도 이전 상태를 기억하고 유지해야 할 때 사용된다. 예를 들어, 호출 될 때마다 1씩 증가하는 카운터를 만들 수 있다.\n\n   ```js\n   function makeCounter() {\n     let count = 0; // 외부 함수의 변수 (자유 변수)\n     // 내부 함수 (클로저)\n     return function () {\n       count++; // 외부 함수의 count 변수에 접근 및 수정\n       return count;\n     };\n   }\n   const counter1 = makeCounter(); // counter1은 내부 함수와 count=0 환경을 기억\n   console.log(counter1()); // 1\n   console.log(counter1()); // 2\n   const counter2 = makeCounter(); // counter2은 새로운 내부 함수와 count=0 환경을 기억\n   console.log(counter2()); // 1\n   console.log(counter1()); // 3 (counter1의 상태는 유지됨)\n   ```\n\n3. 함수 팩토리\n   특정 설정을 가진 함수를 동적으로 생성할 때 사용된다. 외부 함수에서 설정값을 받고, 이를 기억하는 내부 함수를 반환하는 방식이다.\n\n4. 비동기 처리에서의 상태 관리\n   콜백 함수나 프로미스 핸들러 등 비동기 작업이 완료된 후 특정 컨텍스트나 상태를 참조해야할 때 클로저가 활용된다.\n\n5. 모듈 패턴 구현\n   전역 스코프를 오염시키지 않고 독립적인 모듈을 만드는 데 클로저가 핵심적인 역할을 한다.\n\n## 클로저의 주의점\n\n1. 메모리 관리\n   클로저는 참조하는 변수를 메모리에 계속 유지하므로, 불필요한 클로저는 메모리 누수의 원인이 될 수 있다. 더 이상 필요 없는 클로저나 클로저가 참조하는 변수에 대한 참조를 명시적으로 끊어줘야 한다.(변수에 `null` 할당)\n\n2. 루프 내에서의 클로저\n   루프 안에서 비동기 함수를 사용할 때 예상치 못한 결과가 나올 수 있다. 이벤트 리스너 등은 사용이 끝나면 반드시 `removeEventListener`등을 사용하여 제거해야 한다.\n"])</script><script>self.__next_f.push([1,"20:T112b,"])</script><script>self.__next_f.push([1,"클로저는 함수와 그 함수가 선언된 렉시컬 환경(Lexical Environment)의 조합이다. 간단하게 함수가 자신이 생성될 때의 환경(변수)을 기억하는 현상을 말한다.\n클로저는 자바스크립트의 핵심 개념 중 하나로, 함수형 프로그래밍 패러다임과 다양한 디자인 패턴을 구현하는 데 필수적이다.\n클로저는 단순히 내부 함수가 외부 변수에 접근하는 현상을 넘어, 자바스크립트의 렉시컬 스코핑 규칙과 실행 컨텍스트가 외부 환경 참조를 유지하는 방식의 자연스러운 결과이다. 외부 함수가 실행될때 생성된 실행 컨텍스트의 렉시컬 환경은, 그 내부에서 정의된 함수가 외부로 반환되거나 다른 곳에서 참조될 경우, 해당 내부 함수에 의해 계속 참조된다.\n이 견결고리 때문에 외부 함수의 실행이 끝나도 관련 환경이 메모리에서 사라지지 않는 것이다. 모듈 패턴은 이러한 클로저의 특성을 활용한 대표적인 예시이다. IIFE나 일반 함수를 사용하여 '비공개' 스코프(외부 함수의 렉시컬 환경)을 만들고, 이 스코프에 접근할 수 있는 '공개'메서드(내부 함수)들을 객체 형태로 반환함으로써 데이터 캡슐화를 구현한다. 따라서 클로저를 실행 컨텍스트와 렉시컬 환경의 관점에서 이해하면, 그 작동 원리와 모듈 패턴과 같은 실제 활영 사례를 더 근본적으로 파악할 수 있다.\n\u003e [!tip]\n\u003e\n\u003e 클로저가 발생하는 이유는 객체인 함수를 변수에 할당하면서 가능해 진다. 즉 객체로서 변수에 할당된 함수를 지속적으로 참조할 수 있는 것이다. 변수에 담지 않고 그저 함수를 사용하면 함수가 실행되고 사라지면 실행 컨텍스트도 같이 정리 되어야 하지만 변수는 남아 있기 때문에 해당 한수가 선언된 변수를 담고 있는 컨텍스트가 정리되기 전까지는 유지되는 것이다. 렉시컬 스코프 때문에 가능한 일\n1. 렉시컬 스코핑(Lexical Scoping): 함수가 선언된 위치에 따라 상위 스코프가 결정된다.\n2. 변수의 생존: 함수가 선언된 함수의 변수들이 함수가 호출될 때까지 메모리에 유지된다.\n3. 캡슐화(Encapsulation): 데이터와 그 데이터를 조작하는 마수를 하나의 단위로 묶는다.\n\u003e [!example]\n\u003e\n\u003e \n\u003e\n\u003e 이 예제이서 createCounter는 내부 함수를 반환한다. 내부 함수는 count 변수를 참조하고 있으며, 원래라면 createCounter함수가 실행을 마치면 count변수는 사라져야 하지만, 클로저 덕분에 내부 함수가 count변수를 계속 기억하고 접근할 수 있다.\n1. 데이터 은닉과 캡슐화\n외부에서 직접 접근할 수 없는 비공개(private) 변수를 만들고, 오직 클로저를 통해 노출된 함수(메서드)를 통해서만 이 변수에 접근하거나 조작하도록 할 수 있다. 이는 객체 지향 프로그래밍의 캡슐화와 유사한 효과를 제공한다.\n2. 상태 유지\n함수 호출이 끝나도 이전 상태를 기억하고 유지해야 할 때 사용된다. 예를 들어, 호출 될 때마다 1씩 증가하는 카운터를 만들 수 있다.\n3. 함수 팩토리\n특정 설정을 가진 함수를 동적으로 생성할 때 사용된다. 외부 함수에서 설정값을 받고, 이를 기억하는 내부 함수를 반환하는 방식이다.\n4. 비동기 처리에서의 상태 관리\n콜백 함수나 프로미스 핸들러 등 비동기 작업이 완료된 후 특정 컨텍스트나 상태를 참조해야할 때 클로저가 활용된다.\n5. 모듈 패턴 구현\n전역 스코프를 오염시키지 않고 독립적인 모듈을 만드는 데 클로저가 핵심적인 역할을 한다.\n1. 메모리 관리\n클로저는 참조하는 변수를 메모리에 계속 유지하므로, 불필요한 클로저는 메모리 누수의 원인이 될 수 있다. 더 이상 필요 없는 클로저나 클로저가 참조하는 변수에 대한 참조를 명시적으로 끊어줘야 한다.(변수에 null 할당)\n2. 루프 내에서의 클로저\n루프 안에서 비동기 함수를 사용할 때 예상치 못한 결과가 나올 수 있다. 이벤트 리스너 등은 사용이 끝나면 반드시 removeEventListener등을 사용하여 제거해야 한다."])</script><script>self.__next_f.push([1,"21:T160e,"])</script><script>self.__next_f.push([1,"\n# 스코프(Scope)란 무엇인가\n\n스코프는 **변수, 함수, 객체 등 식별자(identifier)에 접근하거나 참조할 수 있는 유효 범위**를 의미한다. 즉, 코드가 특정 변수에 접근할 수 있는지 여부를 결정하는 규칙이다. 자바스크립트의 스코프는 주로 **렉시컬 스코프(Lexical Scope)**를 따르는데, 이는 함수가 어디서 선언되었는지에 따라 스코프가 결정된다는 의미이다. 주요 스코프 종류는 다음과 같다. 스코프는 변수의 생명주기와 접근성으 관리하며, 이름추돌을 방지하고 코드의 모듈서을 높이는 데 중요한 역할을 한다.\n\n## 스코프의 종류\n\n1. 전역 스코프(Global Scope)\n\n   코드의 가장 바깥 영역이다. 여기서 선언된 변수나 함수는 **코드 어디에서든 접근이 가능**하다. 브라우저 환경에서는 `window`객체가 전역 객체 역할을 한다.\n\n2. 함수 스코프(Function Scope)\n\n   **함수 내부에서 선언된 변수는 해당 함수 내에서만 유효**하다. `var`키웓로 선언된 변수가 이 스코프 규칙을 따른다.\n\n3. 블록스코프(Bllank Scope)\n\n   **코드 블록(`{}`) 내에서 선언된 변수는 해당 블록 내에서만 유효**하다. `let`과 `const` 키워드로 서언된 변수가 이 스코프 규칙을 따른다. `if`문, `for`문, `while`문 등의 코드 블록이 해당된다.\n\n### 전역 스코프의 장단점\n\n전역 스코프에 변수나 함수를 선언하면 코드 어디서든 쉽게 접근할 수 있다는 장점이 있다. 애플리케이션 전체에서 공유되어야 하는 상태나 유틸리티 함수 등에 사용될 수 있다.\n\n전역 스코프의 오염을 최소화하는 것이 좋은 프로그래밍 습관이다. 모듈 패턴, IIFE(즉시 실행 함수 표현식), ES6모듈 등을 사용하여 변수의 스코프를 제한하고, 필요한경우에만 최소한의 전역 변수를 사용하는 것이 바람직하다.\n\n#### 장점\n\n1. 접근성: 코드 어디서든 참조 가능하다.\n\n2. 상태 유지: 애플리케이션 생명주기 동안 값이 유지될 수 있다.\n\n#### 단점\n\n1. 이름충돌(Namespace Pollution): 다른 스크립트나 라이브러리에서 동일한 이름의 전역 변수/함수를 사용하면 충돌이 발생하여 예기치 않은 결과를 초래할 수 있다. 특히 규모가 큰 프로젝트나 여러 개발자가 협업하는 경우 문제가 심각해질 수 있다.\n\n2. 유지보수 어려움: 전역변수는 코드 어느 부분에서든 변경될 수 있어, 값의 변경을 추적하고 디버깅하기 어렵게 만든다. 이는 코드의 의존성을 높이고 예측가능성을 떨어뜨린다.\n\n3. 메모리: 전역 변수는 애플리케이션이 종료될 때까지 메모리에 남아있어, 불필요한 메모리 소비를 유발할 수 있다.\n\n4. 함묵적 의존성: 코드가 명시적인 전달 없이 전역 상태에 의존하게 되어 모듈성과 재사용성을 저해할 수 있다.\n\n## 렉시컬 스코프(Lexical Scope)\n\n렉시컬 스코프(Lexical Scope)는 프로그래밍 언어에서 **변수의 유효 범위를 결정하는 방식**으로, 코드가 작성된 구조에 따라 변수의 접근성이 결정된다.\n\n렉시컬 스코프는 스코프 체인과 [[클로저(Closure)란 무엇인가]]의 작동 방식을이해하는 데 있어 핵심적인 원리이다. 자바스크립트 엔진은 코드가 실행될 때가 아니라, 코드가 작성될 때(컴파일 또는 파싱 시점)변수와 함수가 어디에 위치하는지를 기준으로 스코프를 결정한다. 이것으 렉시컬 스코프(정적 스코프)이다. 따라서 함수가 호출되는 위치와 관계없이, 함수는 자신이 선언된 위치의 스코프와 그 상위 스코프들에 접근할 수 있다. 스코프 체인은 바로 이 렉시컬 구조를 따라 형성되며, 클로저는 함수가 자신의 렉시컬 환경(선언 시점의 스코프)을 기억하는 능력에서 비롯된다.\n\n만약 자바스크립트가 동적 스코프(함수가 호출된 위치에 따라 스코프가 결정되는 방식)을 사용했다면, 코드의 동작을 에측하기 훨씬 어려웠을 것이다. 렉시컬 스코프 덕분에 개발자는 코드를 읽는것 만으로도 변수의 유효 범위를 상대적으로 쉽게 파악할 수 있고, 이는 코드의 안정성과 예측 가능성을 높여준다.\n\n### 렉시컬 스코프의 주요 특징\n\n1. **코드가 작성된 위치에 따라** 변수의 접근 범위가 정적으로 결정된다.\n2. **내부 함수**는 자신이 정의된 **외부 함수의 변수에 접근할 수 있다.**\n3. 반대로 **외부 함수**는 **내부 함수의 변수에 접근할 수 없다.**\n\n### 스코프 체인(Scope Chain)\n\n스코프 체인은 **자바스크립트 엔진이 식별자(변수, 함수 등)을 찾는 메커니즘**이다. 특정 스코프 내에서 변수를 참조할 때, 엔진은 먼저 현재 스코프에서 해당 변수를 찾는다. 만약 찾지 못하면, **상위 스코프(자신을 포하하는 외부 스코프)**로 이동하여 다시 찾는다. 이 과정을 젼역 스코프에 도달할 때까지 반복한다. 이처럼 현재 스코프에서 시작하여 **상위 스코프로 연속적으로 연결된 것을 스코프 체인이라고 한다.** 이 체인은 코드가 작성될 때의 렉시컬 구조(어디에 선언되었는지)에 의해 결정된다.\n\n스코프 체인의 내부 함수가 외부 함수의 변수에 접근할 수 있는 원리를 설명하며, 클로저(Closure) 개념의 기반이 된다.\n"])</script><script>self.__next_f.push([1,"22:T14b6,"])</script><script>self.__next_f.push([1,"스코프는 변수, 함수, 객체 등 식별자(identifier)에 접근하거나 참조할 수 있는 유효 범위를 의미한다. 즉, 코드가 특정 변수에 접근할 수 있는지 여부를 결정하는 규칙이다. 자바스크립트의 스코프는 주로 렉시컬 스코프(Lexical Scope)를 따르는데, 이는 함수가 어디서 선언되었는지에 따라 스코프가 결정된다는 의미이다. 주요 스코프 종류는 다음과 같다. 스코프는 변수의 생명주기와 접근성으 관리하며, 이름추돌을 방지하고 코드의 모듈서을 높이는 데 중요한 역할을 한다.\n1. 전역 스코프(Global Scope)\n코드의 가장 바깥 영역이다. 여기서 선언된 변수나 함수는 코드 어디에서든 접근이 가능하다. 브라우저 환경에서는 window객체가 전역 객체 역할을 한다.\n2. 함수 스코프(Function Scope)\n함수 내부에서 선언된 변수는 해당 함수 내에서만 유효하다. var키웓로 선언된 변수가 이 스코프 규칙을 따른다.\n3. 블록스코프(Bllank Scope)\n코드 블록({}) 내에서 선언된 변수는 해당 블록 내에서만 유효하다. let과 const 키워드로 서언된 변수가 이 스코프 규칙을 따른다. if문, for문, while문 등의 코드 블록이 해당된다.\n전역 스코프에 변수나 함수를 선언하면 코드 어디서든 쉽게 접근할 수 있다는 장점이 있다. 애플리케이션 전체에서 공유되어야 하는 상태나 유틸리티 함수 등에 사용될 수 있다.\n전역 스코프의 오염을 최소화하는 것이 좋은 프로그래밍 습관이다. 모듈 패턴, IIFE(즉시 실행 함수 표현식), ES6모듈 등을 사용하여 변수의 스코프를 제한하고, 필요한경우에만 최소한의 전역 변수를 사용하는 것이 바람직하다.\n1. 접근성: 코드 어디서든 참조 가능하다.\n2. 상태 유지: 애플리케이션 생명주기 동안 값이 유지될 수 있다.\n1. 이름충돌(Namespace Pollution): 다른 스크립트나 라이브러리에서 동일한 이름의 전역 변수/함수를 사용하면 충돌이 발생하여 예기치 않은 결과를 초래할 수 있다. 특히 규모가 큰 프로젝트나 여러 개발자가 협업하는 경우 문제가 심각해질 수 있다.\n2. 유지보수 어려움: 전역변수는 코드 어느 부분에서든 변경될 수 있어, 값의 변경을 추적하고 디버깅하기 어렵게 만든다. 이는 코드의 의존성을 높이고 예측가능성을 떨어뜨린다.\n3. 메모리: 전역 변수는 애플리케이션이 종료될 때까지 메모리에 남아있어, 불필요한 메모리 소비를 유발할 수 있다.\n4. 함묵적 의존성: 코드가 명시적인 전달 없이 전역 상태에 의존하게 되어 모듈성과 재사용성을 저해할 수 있다.\n렉시컬 스코프(Lexical Scope)는 프로그래밍 언어에서 변수의 유효 범위를 결정하는 방식으로, 코드가 작성된 구조에 따라 변수의 접근성이 결정된다.\n렉시컬 스코프는 스코프 체인과 클로저(Closure)란 무엇인가의 작동 방식을이해하는 데 있어 핵심적인 원리이다. 자바스크립트 엔진은 코드가 실행될 때가 아니라, 코드가 작성될 때(컴파일 또는 파싱 시점)변수와 함수가 어디에 위치하는지를 기준으로 스코프를 결정한다. 이것으 렉시컬 스코프(정적 스코프)이다. 따라서 함수가 호출되는 위치와 관계없이, 함수는 자신이 선언된 위치의 스코프와 그 상위 스코프들에 접근할 수 있다. 스코프 체인은 바로 이 렉시컬 구조를 따라 형성되며, 클로저는 함수가 자신의 렉시컬 환경(선언 시점의 스코프)을 기억하는 능력에서 비롯된다.\n만약 자바스크립트가 동적 스코프(함수가 호출된 위치에 따라 스코프가 결정되는 방식)을 사용했다면, 코드의 동작을 에측하기 훨씬 어려웠을 것이다. 렉시컬 스코프 덕분에 개발자는 코드를 읽는것 만으로도 변수의 유효 범위를 상대적으로 쉽게 파악할 수 있고, 이는 코드의 안정성과 예측 가능성을 높여준다.\n1. 코드가 작성된 위치에 따라 변수의 접근 범위가 정적으로 결정된다.\n2. 내부 함수는 자신이 정의된 외부 함수의 변수에 접근할 수 있다.\n3. 반대로 외부 함수는 내부 함수의 변수에 접근할 수 없다.\n스코프 체인은 자바스크립트 엔진이 식별자(변수, 함수 등)을 찾는 메커니즘이다. 특정 스코프 내에서 변수를 참조할 때, 엔진은 먼저 현재 스코프에서 해당 변수를 찾는다. 만약 찾지 못하면, 상위 스코프(자신을 포하하는 외부 스코프)로 이동하여 다시 찾는다. 이 과정을 젼역 스코프에 도달할 때까지 반복한다. 이처럼 현재 스코프에서 시작하여 상위 스코프로 연속적으로 연결된 것을 스코프 체인이라고 한다. 이 체인은 코드가 작성될 때의 렉시컬 구조(어디에 선언되었는지)에 의해 결정된다.\n스코프 체인의 내부 함수가 외부 함수의 변수에 접근할 수 있는 원리를 설명하며, 클로저(Closure) 개념의 기반이 된다."])</script><script>self.__next_f.push([1,"23:T98a,"])</script><script>self.__next_f.push([1,"\n# 라이브러리vs프레임워크\n\n## 라이브러리\n\n라이브러리는 **도구 상자**와 같다.\n\n- 개념: 특정 기능을 수행하는 코드 모음\n- 사용 방식: 필요할 때만 꺼내서 사용함\n- 주도권: 개발자가 주도권을 가짐(내가 필요할 때 사용)\n\n## 프레임워크\n\n프레임 워크는 **집의 기초 구조**와 같다.\n\n- 개념: 애플리케이션 개발을 위한 뼈대, 구조\n- 사용 방식: 프레임워크가 정한 틀 안에서 개발\n- 주도권: 프레임워크가 주도권을 가짐 (프레임워크가 내 코드를 호출)\n\n## 주요 차이점\n\n1. 제어 흐름(Control Flow)\n\n   - 라이브러리: **개발자가 코드의 흐름을 제어**한다. 필요할 때 라이브러리를 호출하여 사용한다.\n   - 프레임워크: **프레임워크가 코드의 흐름을 제어**한다. 프레임워크가 정한 규칙과 구조에 맞게 개발자가 코드를 작성한다.\n\n2. 제어의 역전(Inversion of Control)\n\n   - 라이브러리: **제어의 역전이 없다.** 개발자가 라이브러리를 호출한다.\n   - 프레임워크: **제어의 역전이 있다.** 프레임워크가 개발자의 코드를 호출한다.\n\n3. 유연성과 자유도\n\n   - 라이브러리: **높은 유연성과 자유도**를 제공한다. 다양한 라이브러리를 조합하여 사용할 수 있다.\n   - 프레임워크: **제한된 유연성을 가지며, 프레임워크의 규칙을 따라야 한다.**\n\n4. 구조와 아키텍처\n\n   - 라이브러리: 특정 기능을 제공하는 코드 모음으로, 전체 애플리케이션 구조에 영향을 미치지 않는다.\n   - 프레임워크: 애플리케이션의 전체 구조와 아키텍처를 제공한다.\n\n5. 사용 목적\n\n   - 라이브러리: 특정 문제 해결이나 기능 구현에 중점을 둔다.\n   - 프레임워크: **표준화된 개발 환경과 패턴을 제공**한다.\n\n6. 학습 곡선\n\n   - 라이브러리: 상대적으로 **낮은 학습곡선**을 가진다. 필요한 부분만 배워서 사용할 수 있다.\n   - 프레임워크: **높은 학습 곡선**을 가진다. 프레임워크의 철학과 구조를 이해해야 한다.\n\n7. 통합성\n\n   - 라이브러리: 독립적으로 작동하며, 필요에 따라 다른 라이브러리와 함께 사용할 수 있습니다.\n   - 프레임워크: 여러 라이브러리와 도구들을 포함하고 있으며, 일관된 환경을 제공한다.\n"])</script><script>self.__next_f.push([1,"24:T1080,"])</script><script>self.__next_f.push([1,"\n# 데이터 타입과 불변성\n\nJavascript의 데이터 타입은 크게 두 가지로 나눌 수 있다.\n\n## Javascript의 데이터 타입\n\n1. 원시타입(Primitive types)\n\n   고정된 크기의 메모리에 저장되며, 값 자체가 변수에 직접 할당된다. 원시 타입은 불변한다(immutable)\n\n   - `string`: 문자열\n   - `number`: 숫자(정수 및 부동소수점 수 포함)\n   - `boolean`: `true` 또는 `false`\n   - `null`: 값이 없음을 의도적으로 나타내는 값\n   - `undefined`: 값이 할당되지 않은 상태\n   - `symbol`: ES6에서 추가된, 고유하고 변경 불가능한 식별자를 만들 때 사용\n   - `bigint`: `number`타입이 표현할 수 있는 한계를 넘어서는 매우 큰 정수를 다룰 때 사용\n\n2. 객체타입(Object types)\n\n   크기가 가변적일 수 있으며, 변수에는 값 자체가 아닌 값이 저장된 메모리 주소(참조)가 할당된다. 객체 타입은 **가변(mutable)하다.** 종류는 다음과 같다.\n\n   - `Object`: 키-값 쌍의 컬렉션(가장 기본적인 형태)\n   - `Array`: 순서가 있는 값의 목록\n   - `Function`: 호출 가능한 코드 블록(함수도 객체임)\n   - `Date`,`RegExp`,`Map`,`Set`등의 내장 객체들\n\n## 원시 타입과 객체 타입의 주요 차이점\n\n원시 타입과 객체 타입은 값 저장 방식, 불변성, 복사 방식 세 가지 주요 측면에서 근본적인 차이를 보인다.\n\n이 차이점들을 이해하는 것은 함수에 인자를 전달할 때, 변수를 복사할 때, 객체의 상태를 관리할 때 발생할 수 있는 예기치 않은 동작(side effects)을 방지하는 데 매우 중요하디. 특히 객체의 가변성과 참조 전달 방식은 주의 깊게 다루어 져야 한다.\n\n1. 값 저장 방식(Value vs Reference)\n\n   - 원시 타입\n     변수에 실제 값(value) 자체가 저장된다.\n\n   - 객체 타입\n     변수에는 객체가 실제 저장된 메모리 공간을 가리키는 참조(reference) 값이 저장된다.\n\n2. 불변성(Immutability vs Mutability)\n\n   - 원시타입\n     **불변(immutable)** 하다. 한번 생성된 원시 갓은 변경할 수 없다. 예를 들어, 문자열의 일부를 변경하려 해도 새로운 문자열이 생성될뿐, 원본 문자열은 변하지 않는다. 변수에 다른 값을 재할당하는 것은 가능하지만, 이는 새로운 값을 가리키도록 하는 것이지 기존 값 자체를 바꾸는 것이 아니다.\n\n   - 객체타입\n     **가변(mutable)** 하다. 객체를 생성한 후에도 그 내부의 속성이나 요소를 추가, 수정, 삭제할 수 있다.\n\n   ```js\n   // let 의 경우 재할당이 가능 하기 때문에 아무런 오류 없이 실행 되지만\n   // const 의 경우 재하당이 불가능 하기 때문에 TypeError: Assignment to constant variable. 가 발생한다.\n   const a = 10;\n   a += 1;\n   console.log(a);\n   ```\n\n3. 복사 방식(Pass by Balue vs Pass by Reference)\n\n   - 원시타입\n     변수를 다른 변수에 할당하면 **값에 의한 복사(pass by value)** 가 일어난다. 원본 변수의 실제 값이 복사되어 새로운 변수에 저장되므로, 두 변수는 완전히 독립적이다. 한쪽을 변경해도 다른 쪽에 영향을 주지 않는다.\n\n   - 객체타입\n     변수를 다른 변수에 할당하면 **참조에 의한 전달(pass by reference)** 이 일어난다. 원본 변수의 참조 값(메모리 주소)이 복사되어 새로운 변수에 저장된다. 따라서 두 변수는 동일한 객체를 가리키게 된다 한쪾 변수를 통해 객체의 내용을 변경하면 다른 변수에도 그 변경 사항이 반영된다.\n\n   ```js\n   // Pass by Value (Primitive)\n   let a = 10;\n   let b = a; // a 의 값이 b에 복사됨\n   b = 20;\n   console.log(a); //10(값만 복사 하는것이기 때문에 a는 영향이 없음)\n   console.log(b); //20\n\n   // Pass by Reference (Object)\n   let obj1 = { value: 10 };\n   let obj2 = obj1; //obj1의 참조(주소)가 obj2에 복사됨 (같은 객체를 가리킴)\n   obj2.value = 20;\n   console.log(obj1.value); // 20(obj2를 통해 변경했지만 obj1에도 반영됨)\n   console.log(obj2.value); // 20\n   ```\n"])</script><script>self.__next_f.push([1,"25:Tc11,"])</script><script>self.__next_f.push([1,"Javascript의 데이터 타입은 크게 두 가지로 나눌 수 있다.\n1. 원시타입(Primitive types)\n고정된 크기의 메모리에 저장되며, 값 자체가 변수에 직접 할당된다
