전 식별 등)가 발생할 가능성이 높다.\n4. 백엔드 서버를 유지보수해야 하므로 추가적인 비용과 관리 부담이 생긴다.\n5. 단순한 마크다운 기반 블로그를 운영하는 데 있어, DB를 활용하는 것이 오히려 과도한 복잡성을 초래할 수 있다.\n\n이러한 문제점 때문에 나는 DB 사용하지 않기로 하였다.\nDB를 사용하지 않는다면 [[동적 사이트 vs 정적사이트|동적 사이트로 블로그를 개발할 이유]]가 사라진다. 그러면 이제 정적 사이트를 위해 고민할것은 파일을 프로젝트 폴더 안으로 가져와 파일을 동기화 해야 한다.\n\n파일을 프로젝트 폴더 안으로 가져오는 것을 **파이썬 스크립트**를 사용하여 구현하기로 하였다.\nPython을 통해 파일 시스템을 만져본것은 처음이라 [[Aider|AI 툴]]을 활용하여 작성하였다. 완성된 스크립트는 [링크](https://github.com/lazy-dinosaur/lazy-dinosaur.github.io/blob/blog/scripts/sync-notes.py)를 통해 확인할 수 있다.\n\n\u003e [!tip]\n\u003e\n\u003e - [[Python Script로 파일 복사해오기]]\n\u003e - [[Python Script로 Markdown 파일 읽어오기]]\n\u003e - [[Python Script로 JSON 파일 작성하기]]\n\nNext.js 를 활용하여 블로그를 만들때 기본적으로 content 폴더에 파일들을 가져와 빌드하게 된다.\n"])</script><script>self.__next_f.push([1,"38:T9fa,"])</script><script>self.__next_f.push([1,"앞선 포스트에서 살펴본것처럼 내가 중요하게 생각한 블로그의 조건은 다음과 같았다.\n1. 블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것\n2. 노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것\n3. 포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것\n4. 필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것\n나는 Neovim 과 Obsidian 을 활용하여 노트를 작성하고 있다. 내가 이러한 셋업을 사용하면서 원하는 워크플로우는 Neovim 으로 노트를 작성 한 이후 커맨드를 사용하여 바로 노트를 동기화 시키고 블로그에 글을 포스팅하는 것 이었다.\n노트를 동기화 시키는 방법은 두가지로 좁혀진다. DB를 사용하는 방식과 사용하지 않는 방식이다\n1. 만약 DB를 사용하게 된다면 백엔드를 만들어 API를 활용해서 블로그를 관리해야 한다. 즉, 관리의 복잡성이 증가한다.\n2. API를 통해 먼저 DB에서 노트를 불러오고 현재 노트와 비교해야 하는 번거로운 작업이 필요하다.\n3. 노트의 버전 관리를 위해 추가적인 작업이 필요하며, 이 과정에서 데이터 동기화 문제(예: 중복 저장, 최신 버전 식별 등)가 발생할 가능성이 높다.\n4. 백엔드 서버를 유지보수해야 하므로 추가적인 비용과 관리 부담이 생긴다.\n5. 단순한 마크다운 기반 블로그를 운영하는 데 있어, DB를 활용하는 것이 오히려 과도한 복잡성을 초래할 수 있다.\n이러한 문제점 때문에 나는 DB 사용하지 않기로 하였다.\nDB를 사용하지 않는다면 동적 사이트로 블로그를 개발할 이유가 사라진다. 그러면 이제 정적 사이트를 위해 고민할것은 파일을 프로젝트 폴더 안으로 가져와 파일을 동기화 해야 한다.\n파일을 프로젝트 폴더 안으로 가져오는 것을 파이썬 스크립트를 사용하여 구현하기로 하였다.\nPython을 통해 파일 시스템을 만져본것은 처음이라 AI 툴을 활용하여 작성하였다. 완성된 스크립트는 링크를 통해 확인할 수 있다.\n\u003e [!tip]\n\u003e\n\u003e - Python Script로 파일 복사해오기]]\n\u003e - [[Python Script로 Markdown 파일 읽어오기]]\n\u003e - [[Python Script로 JSON 파일 작성하기\nNext.js 를 활용하여 블로그를 만들때 기본적으로 content 폴더에 파일들을 가져와 빌드하게 된다."])</script><script>self.__next_f.push([1,"39:T11a8,"])</script><script>self.__next_f.push([1,"\n# 개인 블로그를 제작하게 된 이유\n\n개발자로서 내가 한 일을 기록하고, 이를 공유할 수 있는 공간이 필요했다. 여러 블로그 플랫폼이 있지만, **작성한 글을 복사해서 붙여넣어야 한다는 점**이 번거로웠다. 이 과정에서 블로그 운영이 기록의 목적이 아니라 **포스트를 만들기 위한 기록**처럼 느껴지는 문제가 발생했다. 결국, 기존 플랫폼을 이용하는 방식은 내 스타일이 아니라는 결론을 내렸다.\n\n## 블로그 운영 방식에 대한 고민\n\n블로그를 운영하는 방식에는 크게 세 가지가 있다고 생각했다.\n\n1. 기존 블로그 플랫폼을 이용하는 방법\n2. Notion이나 Obsidian의 Publish 기능을 활용하는 방법\n3. 직접 개인 블로그를 제작하여 운영하는 방법\n\n각각의 방법을 고민하면서 어떤 방식이 나에게 가장 적합할지 검토했다.\n\n## 블로그 플랫폼의 한계\n\n기존 블로그 플랫폼을 이용하는 방법에는 두 가지 방식이 있다. API를 활용한 자동화와 수동으로 글을 업로드하는 방식이다. 하지만 이 두 가지 방법 모두 내게는 불편한 점이 많았다.\n\n### 1. API를 활용한 자동화의 어려움\n\n일부 블로그 플랫폼은 API를 제공하지만, 최근에는 이를 폐지하는 곳이 많아졌다. 대표적으로 **네이버 블로그**와 **티스토리**가 API 지원을 중단했다. 이처럼 플랫폼 정책이 바뀔 위험성이 크기 때문에 특정 서비스에 의존하는 것은 장기적으로 안전한 방법이 아니라고 판단했다.\n\n### 2. 수동 업로드의 번거로움\n\n나는 **Neovim을 이용해 글을 작성하고, Obsidian을 뷰어(Viewer)로 사용**하고 있다. 따라서 글을 블로그에 올리려면 복사하여 붙여넣어야 하며, 플랫폼에서 지원하지 않는 **Callout 형식**이나 **Wiki 스타일 링크** 등을 직접 변환해야 하는 번거로움이 있다.\n\n## 노트 앱의 Publish 기능 활용의 한계\n\nNotion과 Obsidian 같은 노트 앱의 Publish 기능을 활용하는 방법도 고려했지만, 몇 가지 제약이 있었다.\n\n### 1. 노트와 블로그 포스트의 분리 문제\n\n나는 노트를 우선 **Inbox 폴더**에 저장한 후, 필요한 경우 다른 폴더로 이동시키는 방식으로 정리한다. 하지만 이 방식은 블로그에 올릴 글을 특정 카테고리로 묶는 데 제약이 생긴다. 이를 해결하려면 블로그 전용 워크스페이스를 만들어야 하는데, 이는 기존 블로그 플랫폼을 사용하는 것과 크게 다르지 않다.\n\n### 2. 커스터마이징의 한계\n\nNotion과 Obsidian은 강력한 노트 관리 기능을 제공하지만, 블로그 디자인과 기능을 원하는 대로 변경하는 데는 한계가 있다. 특히 Obsidian의 Publish 기능은 기본적으로 노트 공유에 초점이 맞춰져 있어, 블로그를 운영하는 데 적합하지 않았다.\n\n## 나만의 블로그를 제작하기로 결정하다\n\n위의 문제점들을 고려한 결과, 나만의 블로그를 직접 제작하는 것이 최선의 방법이라고 판단했다. 이렇게 하면 기존 방식의 모든 단점을 보완하면서도 나만의 이상적인 블로그 운영 방식을 구축할 수 있다.\n\n### 내가 만들고 싶은 블로그의 조건\n\n기존 방식의 문제를 반대로 생각하면, 내가 원하는 블로그의 조건은 다음과 같았다.\n\n1. **블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것**\n2. **노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것**\n3. **포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것**\n4. **필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것**\n\n이러한 목표를 달성하기 위해 데이터베이스(DB) 사용도 고려했지만, 단순한 방법이 더 적합하다고 판단했다. 그래서 **Python을 활용하여** Obsidian Vault 폴더 내의 Markdown 파일을 자동으로 블로그로 가져오는 방식을 선택했다.\n\n### 커스터마이징을 위한 프레임워크\n\n블로그를 만들기 위한 다양한 프레임워크가 있지만 내가 다룰 줄 아는 프레임워크인 Next.js 가 커스터마이징하기 쉬워 보였기 때문에 Next.js 를 활용하여 블로그를 구축 하기로 결정하였다.\n\n다음: [[어떻게 블로그를 구현하였나]]\n"])</script><script>self.__next_f.push([1,"3a:Tf5f,"])</script><script>self.__next_f.push([1,"개발자로서 내가 한 일을 기록하고, 이를 공유할 수 있는 공간이 필요했다. 여러 블로그 플랫폼이 있지만, 작성한 글을 복사해서 붙여넣어야 한다는 점이 번거로웠다. 이 과정에서 블로그 운영이 기록의 목적이 아니라 포스트를 만들기 위한 기록처럼 느껴지는 문제가 발생했다. 결국, 기존 플랫폼을 이용하는 방식은 내 스타일이 아니라는 결론을 내렸다.\n블로그를 운영하는 방식에는 크게 세 가지가 있다고 생각했다.\n1. 기존 블로그 플랫폼을 이용하는 방법\n2. Notion이나 Obsidian의 Publish 기능을 활용하는 방법\n3. 직접 개인 블로그를 제작하여 운영하는 방법\n각각의 방법을 고민하면서 어떤 방식이 나에게 가장 적합할지 검토했다.\n기존 블로그 플랫폼을 이용하는 방법에는 두 가지 방식이 있다. API를 활용한 자동화와 수동으로 글을 업로드하는 방식이다. 하지만 이 두 가지 방법 모두 내게는 불편한 점이 많았다.\n일부 블로그 플랫폼은 API를 제공하지만, 최근에는 이를 폐지하는 곳이 많아졌다. 대표적으로 네이버 블로그와 티스토리가 API 지원을 중단했다. 이처럼 플랫폼 정책이 바뀔 위험성이 크기 때문에 특정 서비스에 의존하는 것은 장기적으로 안전한 방법이 아니라고 판단했다.\n나는 Neovim을 이용해 글을 작성하고, Obsidian을 뷰어(Viewer)로 사용하고 있다. 따라서 글을 블로그에 올리려면 복사하여 붙여넣어야 하며, 플랫폼에서 지원하지 않는 Callout 형식이나 Wiki 스타일 링크 등을 직접 변환해야 하는 번거로움이 있다.\nNotion과 Obsidian 같은 노트 앱의 Publish 기능을 활용하는 방법도 고려했지만, 몇 가지 제약이 있었다.\n나는 노트를 우선 Inbox 폴더에 저장한 후, 필요한 경우 다른 폴더로 이동시키는 방식으로 정리한다. 하지만 이 방식은 블로그에 올릴 글을 특정 카테고리로 묶는 데 제약이 생긴다. 이를 해결하려면 블로그 전용 워크스페이스를 만들어야 하는데, 이는 기존 블로그 플랫폼을 사용하는 것과 크게 다르지 않다.\nNotion과 Obsidian은 강력한 노트 관리 기능을 제공하지만, 블로그 디자인과 기능을 원하는 대로 변경하는 데는 한계가 있다. 특히 Obsidian의 Publish 기능은 기본적으로 노트 공유에 초점이 맞춰져 있어, 블로그를 운영하는 데 적합하지 않았다.\n위의 문제점들을 고려한 결과, 나만의 블로그를 직접 제작하는 것이 최선의 방법이라고 판단했다. 이렇게 하면 기존 방식의 모든 단점을 보완하면서도 나만의 이상적인 블로그 운영 방식을 구축할 수 있다.\n기존 방식의 문제를 반대로 생각하면, 내가 원하는 블로그의 조건은 다음과 같았다.\n1. 블로그 포스팅과 노트 작성의 흐름이 자연스럽게 연결될 것\n2. 노트와 블로그 포스트가 분리되어, 원하는 노트만 포스팅할 수 있을 것\n3. 포스팅 시 블로그의 구조를 내가 직접 정의할 수 있을 것\n4. 필요에 따라 기능을 추가하거나 제거할 수 있도록 커스터마이징이 가능할 것\n이러한 목표를 달성하기 위해 데이터베이스(DB) 사용도 고려했지만, 단순한 방법이 더 적합하다고 판단했다. 그래서 Python을 활용하여 Obsidian Vault 폴더 내의 Markdown 파일을 자동으로 블로그로 가져오는 방식을 선택했다.\n블로그를 만들기 위한 다양한 프레임워크가 있지만 내가 다룰 줄 아는 프레임워크인 Next.js 가 커스터마이징하기 쉬워 보였기 때문에 Next.js 를 활용하여 블로그를 구축 하기로 결정하였다.\n다음: 어떻게 블로그를 구현하였나"])</script><script>self.__next_f.push([1,"2:[\"$\",\"html\",null,{\"lang\":\"ko\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{\"className\":\"__variable_5cfdac __variable_9a8899 __variable_d65c78 __variable_dc8395 antialiased transition-all\",\"children\":[\"$\",\"$Ld\",null,{\"attribute\":\"class\",\"defaultTheme\":\"system\",\"enableSystem\":true,\"disableTransitionOnChange\":true,\"children\":[\"$\",\"$Le\",null,{\"posts\":[{\"urlPath\":\"자원/React/리엑트 함수형 컴포넌트의 생명주기\",\"title\":\"리엑트 함수형 컴포넌트의 생명주기\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-24 08:34:02\",\"modifiedAt\":\"2025-04-24 08:44:05\",\"publish\":\"자원/React\",\"content\":\"$f\",\"plainContent\":\"과거엔 클래스형 컴포넌트가 주를 이루었고 클래스형 컴포넌트에는 생명 주기를 메서드로 제공했지만, 현재는 함수형 컴포넌트가 주를 이루고 있다. 함수형 컴포넌트는 생명 주기를 메서드로 제공하지 않지만, 훅을 사용하여 생명 주기를 관리할 수 있다.\\nReact 함수형 컴포넌트의 생명주기는 더 선언적이고 예측 가능하며, 부작용(side effects)과 상태 관리를 더 명확하게 분리할 수 있게 해준다.\\n1. 마운트(Mount)-컴포넌트가 DOM에 추가될때\\nuseState: 상태 초기화\\nuseEffect(callback,[]): 빈 의존성 배열을 사용하면 컴포넌트가 마운트될 때 한 번만 실행된다. 이는 클래스 컴포넌트의 componentDidMount와 유사하다.\\n2. 업데이트(Update)-컴포넌트가 리렌더링될 때\\nuseEffect(callback,[dpendencies]): 의존성 배열의 값이 변경될 때마다 실행된다. 이는 클래스 컴포넌트의 componentDidUpdate와 유사하다.\\nuseMemo,useCallback: 의존성이 변경될 때만 값이나 함수를 재계산하여 최적화한다.\\n3. 언마운트(Unmount)-컴포넌트가 DOM에서 제거될 때\\nuseEffect의 클린업 함수:useEffect(()=\u003e{return()=\u003e{/정리 로직/}},[]). 이는 크래스 컴포넌트의 componentWillUnmount와 유사하다.\\n4. 에러 처리\\nuseErrorBoundary(별도 라이브러리) 또는 상위 컴포넌트에서 ErrorBoundary 클래스 사용\\n조건부 렌더링: 함수형 컴포넌트는 조건에 따라 다른 JSX를 반환할 수 있다.\\n렌더 최적화: React.memo를 사용하여 불필요한 리렌더링을 방지할 수 있다.\\n커스텀 Hooks: 여러 생명주기 관련 로직을 재사용 가능한 자체 Hook으로 만들 수 있다.\"},{\"urlPath\":\"자원/React/가상DOM의 원리\",\"title\":\"가상DOM의 원리\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-21 18:45:51\",\"modifiedAt\":\"2025-04-23 14:15:23\",\"publish\":\"자원/React\",\"content\":\"$10\",\"plainContent\":\"가상DOM은 실제 DOM의 가벼운 복사본이다. 실제 브라우저의 DOM을 직접 조작하는 대신, 메모리 상에 가상의 DOM 트리를 만들어 작업산 후 필요한 변경사항만 실제 DOM에 적용하는 방식이다.\\n1. 초기 렌더링:\\n애플리케이션이 처음 로드될때 실제 DOM의 가상 표현이 메모리에 생성된다.\\n이 가상 DOM은 실제 DOM 요소에 대응하는 JavaScript 객체 트리 구조이다.\\n2. 상태 변경 감지:\\n데이터가 변경되면(예: 사용자 상호작용) 전체 UI를 다시 렌더링하는 새로운 가상 DOM 트리가 생성된다.\\n3. 가상 DOM 비교(Diffing):\\n이전 DOM과 새로운 가상 DOM을 비교하는 \\\"diffing\\\"알고리즘이 실행된다.\\nReact의 경우 이 과정을 \\\"reconciliation(재조정)\\\"이라고 부른다.\\n4. 변경사항 계산 (Patch):\\n알고리즘은 두 가상 DOM 트리 간의 차이점을 찾아 최소한의 변경사항 집합을 계산한다.\\n5. 배치 업데이트(Batching):\\n모든 변경사항만 실제 DOM에 적용한다. 이 과정을 \\\"커밋 단계\\\"라고 한다.\\n1. 트리 비교:\\n두 트리를 루트 노드부터 비교하기 시작힌다.\\n루트 요소의 타입이 다르면 전체 트리를 새로 구성한다.\\n2. 요소 타입 비교:\\n같은 위치에 있는 요소의 타입이 같으면 속성만 업데이트하고, 다르면 해당 노드와 그 하위 트리를 모두 재생성한다.\\n3. 키(Key)사용:\\n리스트 항목에 고유 키를 할당하면 알고리즘이 요소의 이동을 효율적으로 추적할 수 있다.\\n예: \u003cli key=\\\"todo-1\\\"\u003e항목 1\u003c/li\u003e\\n4. 레벨별 비교:\\n알고리즘은 같은 레벨의 노드들만 비교하며, 자식 노드들 간에는 재귀적으로 비교한다.\\n1. DOM 조작 최소화:\\n실제 DOM 조작은 비용이 큰 작업이다. 가상 DOM은 필요한 변경사항만 적용해 이를 최소화한다.\\n2. 일괄 처리:\\n여러 변경사항을 하나의 업데이트로 배치 처리한다.\\n3. 이벤트 시스템 최적화:\\n이벤트 위임(event delegation)을 통해 이벤트 핸들러 수를 줄인다.\"},{\"urlPath\":\"자원/React/Props Drilling 이란 무엇인가\",\"title\":\"Props Drilling 이란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-20 10:03:21\",\"modifiedAt\":\"2025-04-21 07:40:48\",\"publish\":\"자원/React\",\"content\":\"$11\",\"plainContent\":\"Props Drilling은 React와 같은 컴포넌트 기반 프레임워크에서 발생하는 패턴으로,상위 컴포넌트에서 깊이 중첩된 하위 컴포넌트로 데이터(props)를 전달하기 위해 중간에 있는 여러 컴포넌트들을 통과시키는 과정을 말한다.\\n예를 들어 다음과 같은 컴포넌트 구조가 있다고 가정해보자\\n만약 App컴포넌트에서 GreatGrandChild컴포넌트로 데이터를 전달해야 한다면, 그 데이터는 Parent,Child,GrandChild를 거쳐야 한다. 이때 중간에 이쓴ㄴ 컴포넌트들은 해당 데이터를 실제로 사용하지 않고 단순히 하위 컴포넌트로 전달만 하는 역할을 한다.\\n위 예제에서 Parent,Child,GrandChild컴포넌트는 data prop을 사용하지 않고 단순히 다음 컴포넌트로 전달만 한다. 이것이 바로 Props Drilling이다.\\n1. 코드 복잡성 증가: 중간 컴포넌트들이 불필요한 props를 관리해야 하므로 코드가 복잡해진다.\\n2. 유지보수 어려움: props의 변경이 필요할 때 관련된 모든 컴포넌트를수정해야한다.\\n3. 컴포넌트 재사용성 저하: 특정 데이터에 의존하게 되어 컴포넌트의 재사용성이 떨어진다.\\n4. 디버깅 어려움: 데이터 흐름을 추적하기 어려워 문제 발생 시 디버깅이 복잡해진다.\\n1. ContextAPI: React의 Context API를 사용하면 중간 컴포넌트를 거치지 않고 직접 데이터를 전달할 수 있다.\\n2. 상태 관리 라이브러리: Redux, Recoil, MobX 같은 상태 관리 라이브러리를 사용하여 전역 상태를 관리할 수 있다.\\n3. Composition(합성): 컴포넌트 합성을 통해 props drilling을 피할 수 있다.\"},{\"urlPath\":\"자원/React/자식컴포넌트에서 부모컴포넌트로 데이터 전달하기\",\"title\":\"자식컴포넌트에서 부모컴포넌트로 데이터 전달하기\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-20 10:02:37\",\"modifiedAt\":\"2025-04-21 18:45:45\",\"publish\":\"자원/React\",\"content\":\"$12\",\"plainContent\":\"두가지 방법이 있다 한가지는 부모가 가지고 있는 상태를 조작할 수 있는 리모콘을 만들어 자식에게 전달하는 방식 다른 하나는 contextAPI 혹은 다른 상태 관리 프로그램을 활용해 데이터를 전달하는 것이다.\\n리엑트는 기본적으로 state와 props로 이루어져 있다. props는 읽기 전용 이기 때문에 직접 수정은 불가능 하다. 다만 객체를 넘기면 된다. 함수의 경우에도 객체이기 때문에 props에 setState 혹은 콜백 함수 를 자식 컴포넌트로 넘기게 되면 자식 컴포넌트에서 부모에서 선언된 상태를 조작할 수 있게 된다.\"},{\"urlPath\":\"자원/React/props와 state\",\"title\":\"props와 state\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-20 09:40:39\",\"modifiedAt\":\"2025-04-21 07:22:55\",\"publish\":\"자원/React\",\"content\":\"$13\",\"plainContent\":\"$14\"},{\"urlPath\":\"자원/React/엘리먼트와 컴포넌트의 차이\",\"title\":\"엘리먼트와 컴포넌트의 차이\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-20 08:41:50\",\"modifiedAt\":\"2025-04-20 09:44:34\",\"publish\":\"자원/React\",\"content\":\"\\n# 엘리먼트와 컴포넌트의 차이\\n\\n## 엘리먼트(Element)\\n\\n엘리먼트는 UI를 구성하는 가장 작은 단위로, 화면에 표시하려는 것을 기술한다.\\n\\n- 정의: 화면에 표시되는 실제 DOM 노드나 React와 같은 프레임워크에서는 **가상 DOM 노드**를 의미한다.\\n- 특성: 엘리먼트는 일반적으로 불변(immutable)이다. 즉, 생성된 후에는 자식이나 속성을 변경할 수 없다.\\n- React에서의 예시: `React.createElement()` 함수로 생성 되거나 JSX를 통해 선언적으로 작성된다.\\n\\n## 컴포넌트(Component)\\n\\n컴포넌트는 재사용 가능한 독립적인 모듈로, UI의 일부를 구성한다.\\n\\n- 정의: 엘리먼트들의 집합을 캡슐화하여 재사용 가능한 단위로 만든 것이다.\\n- 특성:\\n  - 자체[[props와 state|상태(state)]]와 라이프사이클을 가질 수 있다.\\n  - props를 통해 데이터를 전달받아 처리할 수 있다.\\n  - 재사용성과 모듈화를 위해 설계된다.\\n- React에서의 예시:\\n  ```js\\n  function Greeting(props) {\\n    return \u003ch1\u003e안녕하세요, {props.name}님!\u003c/h1\u003e;\\n  }\\n  ```\\n\\n## 핵심 차이점\\n\\n1. 추상화 수준:\\n\\n   - 엘리먼트: 낮은 수준의 추상화로, UI의 실제 표현을 정의한다.\\n   - 컴포넌트: 높은 수준의 추상화로, 엘리먼트들을 조합하여 기능적 단위를 형성한다.\\n\\n2. 재사용성:\\n   - 엘리먼트: 단일 인스턴스로, 그 자체로는 재사용하기 어렵다.\\n   - 컴포넌트: 재사용을 목적으로 설계되어 다양한 상황에서 활용 가능하다.\\n3. 동작 방식:\\n\\n   - 엘리먼트: 단순히 화면에 표시라 것을 기술하는 객체이다.\\n   - 컴포넌트: 로직과 상태를 포함하여 동적으로 엘리먼트를 생성하고 조작한다.\\n\\n4. 생명주기:\\n   - 엘리먼트: 생명주기가 없으며, 단순히 렌더링 결과물의 스냅샷이다.\\n   - 컴포넌트: 마운트, 업데이트, 언마운트 등의 생명주기를 가진다.\\n\",\"plainContent\":\"엘리먼트는 UI를 구성하는 가장 작은 단위로, 화면에 표시하려는 것을 기술한다.\\n정의: 화면에 표시되는 실제 DOM 노드나 React와 같은 프레임워크에서는 가상 DOM 노드를 의미한다.\\n특성: 엘리먼트는 일반적으로 불변(immutable)이다. 즉, 생성된 후에는 자식이나 속성을 변경할 수 없다.\\nReact에서의 예시: React.createElement() 함수로 생성 되거나 JSX를 통해 선언적으로 작성된다.\\n컴포넌트는 재사용 가능한 독립적인 모듈로, UI의 일부를 구성한다.\\n정의: 엘리먼트들의 집합을 캡슐화하여 재사용 가능한 단위로 만든 것이다.\\n특성:\\n자체상태(state)와 라이프사이클을 가질 수 있다.\\nprops를 통해 데이터를 전달받아 처리할 수 있다.\\n재사용성과 모듈화를 위해 설계된다.\\nReact에서의 예시:\\n1. 추상화 수준:\\n엘리먼트: 낮은 수준의 추상화로, UI의 실제 표현을 정의한다.\\n컴포넌트: 높은 수준의 추상화로, 엘리먼트들을 조합하여 기능적 단위를 형성한다.\\n2. 재사용성:\\n엘리먼트: 단일 인스턴스로, 그 자체로는 재사용하기 어렵다.\\n컴포넌트: 재사용을 목적으로 설계되어 다양한 상황에서 활용 가능하다.\\n3. 동작 방식:\\n엘리먼트: 단순히 화면에 표시라 것을 기술하는 객체이다.\\n컴포넌트: 로직과 상태를 포함하여 동적으로 엘리먼트를 생성하고 조작한다.\\n4. 생명주기:\\n엘리먼트: 생명주기가 없으며, 단순히 렌더링 결과물의 스냅샷이다.\\n컴포넌트: 마운트, 업데이트, 언마운트 등의 생명주기를 가진다.\"},{\"urlPath\":\"자원/React/flux 패턴이란\",\"title\":\"flux 패턴이란\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-19 22:48:15\",\"modifiedAt\":\"2025-04-20 09:23:43\",\"publish\":\"자원/React\",\"content\":\"$15\",\"plainContent\":\"Flux 패턴은 Facebook(현 Meta)에서 개발한 단방향 데이터 흐름 아키텍처 패턴이다. 복잡한 UI를 가진 웹 애플리케이션에서 데이터 흐름을 관리하기 위해 만들어 졌으며, 특히 React와 함께 사용하기 위해 설계되었다.\\n1. 단방향 데이터 흐름: 데이터는 항상 한방향(Dispatcher -\u003e Store -\u003e View)으로만 흐른다.\\n2. 예측 가능한 상태 관리: 애플리케이션의 상태가 어떻게 변하는지 추적하기 쉽다.\\n3. 중앙 집중식 Dispatcher:모든 액션이 중앙 Dispatcher를 통과한다.\\n1. 액션(Actioin): 사용자 상호작용이나 API응답 등으로 발생하는 이벤트이다. 각 액션은 type과 관련 payload(데이터)를 가진다.\\n2. 디스패처(Dispatcher): 액션을 받아서 등록된 모든 스토어에 전달하는 중앙 허브이다. Flux의 디스패처는 단일 디스패처로, 모든 액션은 이를 통과한다.\\n3. 스토어(Store): 애플리케이션의 상태와 비즈니스 로직을 포함한다. 디스패치로부터 액션을 받아 처리하고, 상태를 업데이트한다. 스토어는 상태가 변경되면 뷰에게 알린다.\\n4. 뷰(View): 주로 React 컴포넌트로 구현하다. 스토어의 상태를 화면에 렌더링하고, 사용자 입력에 반응하여 새로운 액션을 생성한다.\\nFlux 데이터 흐름은 다음과 같은 단계로 진행된다.\\n1. 사용자가 뷰와 상호작용한다.(예: 버튼 클릭)\\n2. 뷰는 액션 크리에이터(Action Creator)\\n3. 액션은 디스패처로 전달된다.\\n4. 디스패처는 액션을 모든 스토어에 전달한다.\\n5. 스토어는 액션에 따라 상태를 업데이트하고, 변경 이벤트를 발생시킨다.\\n6. 뷰는 스토어의 변경 이벤트를 감지하고, 새로운 상태에 따라 리렌더링된다.\\n장점\\n예측 가능한 데이터 흐름\\n상태 관리의 일관성\\n디버깅 용이성\\n코드 구조의 명확성\\n한계점\\n간단한 애플리케이션에서는 과도한 보일러플레이트 코드가 발생\\n비동기 작업 처리를 위한 추가 라이브러리 필요\\n학습 곡선이 있음\"},{\"urlPath\":\"자원/JavaScript/Javascript에서의 비동기 함수\",\"title\":\"Javascript에서의 비동기 함수\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 20:47:13\",\"modifiedAt\":\"2025-04-19 21:35:38\",\"publish\":\"자원/JavaScript\",\"content\":\"$16\",\"plainContent\":\"$17\"},{\"urlPath\":\"자원/JavaScript/Javascript는 어떻게 비동기 처리가 가능한 것인가\",\"title\":\"Javascript는 어떻게 비동기 처리가 가능한 것인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 18:43:45\",\"modifiedAt\":\"2025-04-19 21:35:43\",\"publish\":\"자원/JavaScript\",\"content\":\"$18\",\"plainContent\":\"자바스크립트 엔진 자체는 싱글 스레드 기반으로 동작하여 한번에 하나의 작업만 처리할 수 있는 콜 스택 을 갖는다. 하지만 자바스크립트가 실행되는 환경(웹 브라우저나 Node.js)은 자바스크립트 엔진 외에도 비동기 작업을 처리하는 별도의 API(Web API 또는 C++API)와 여러개의 큐(Queue), 그리고 이들을 조율하는 이벤트 루프(Event Loop)를 제공한다. 이 구조 덕분에 싱글 스레드 입에도 불구하고 논블로킹(none-blocking) 방식으로 비동기 처리가 가능하다\\n참고: 콜백 함수들이 대기하는 FIFO구조의 큐이다. setTimeout,setInterval콜백, I/O 완료 콜백, UI렌더링 작업 등이 여기에 해당한다.\\n마이크로태스크 큐(Microtask Queue): 태스크 큐와 유사하지만, 더 높은 우선순위를 가진다. Promise콜백 함수(Callback Function)이란 무엇인가의 .then(),.catch(),.finally()콜백, queueMicrotask(),MutationObserver콜백 등이 여기에 해당한다.\\n이벤트 루프(Event Loop): 콜 스택과 큐들을 지속적으로 감시하는 프로세스\\n1.  콜 스택 확인: 콜 스택이 비어있는지 확인한다.\\n2.  마이크로태스크 큐 처리: 콜 스택이 비어 있다면, 마이크로태스크 큐에 있는 모든 콜백 함수를 순서대로 꺼내어 콜스택에 넣고 실핸한다. 마이크로태스크 실행 중 새로운 마이크로태스크가 추가되면 이 역시 현재 루프 주기 내에서 모두 처리된다.\\n3.  매크로태스크 큐 처리:마이크로태스크 큐가 비워니 후 (그리고 필요한 UI 렌더링 등이 수행된 후), 매크로태스크 큐에서 하나의 콜백 함수를 꺼내어 콜 스택에 넣고 실핸한다.\\n4.  위 과정을 계속 반복한다.\"},{\"urlPath\":\"자원/JavaScript/프로토타입(Prototype)과 프로토타입 상속\",\"title\":\"프로토타입(Prototype)과 프로토타입 상속\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 15:21:35\",\"modifiedAt\":\"2025-04-19 18:39:55\",\"publish\":\"자원/JavaScript\",\"content\":\"$19\",\"plainContent\":\"$1a\"},{\"urlPath\":\"자원/JavaScript/`this`키워드\",\"title\":\"`this`키워드\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 13:24:41\",\"modifiedAt\":\"2025-04-19 15:21:13\",\"publish\":\"자원/JavaScript\",\"content\":\"$1b\",\"plainContent\":\"$1c\"},{\"urlPath\":\"자원/JavaScript/콜 스택(Call Stack)이란 무엇인가\",\"title\":\"콜 스택(Call Stack)이란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 11:15:16\",\"modifiedAt\":\"2025-04-19 13:12:49\",\"publish\":\"자원/JavaScript\",\"content\":\"\\n# 콜 스택(Call Stack)이란 무엇인가\\n\\n콜 스택은 **함수 호출을 추적**하기 위해 자비스크립트 엔진이 사용하는 **LIFO(Last-in, First-out)** 구조의 메모리 영역이다. 코드가 실행되면서 함수가 호출되면, 해당 함수의 실행 컨텍스트가 생성되어 콜 스택의 맨 위에 쌓인다(push). 함수 실행이 완료되어 값을 반환하면, 해당 실행 컨텍스트는 콜 스택에서 제거된다(pop). 콜 스택의 가장 위에 있는 실행 컨텍스트가 현재 리행중인 컨텍스트이다.\\n\\n콜 스택은 자바스크립트의 동기적인 코드 실행 순서를 관리한다. 하나의 작업이 완료되어야 다음 작업이 스택에서 실행될 수있다. 이는 이벤트 루프와 비동기 처리 방식을 이해하는 데 필수적인 배경지식 이다.\\n\\n## 동작 예시\\n\\n1. 전역 코드가 실행되면 전역 실행 컨텍스트가 스택에 추가된다.\\n2. 함수 `A`가 호출되면 `A`의 함수 실행컨텍스트가 스택 위에 추가된다\\n3. 함수 `A` 내부에서 함수 `B`가 호출되면 `B`의 함수 실행컨텍스트가 스택 위에 추가된다.\\n4. 함수 `B`가 실행을마치고 반환하면 `B`의 함수 실행 컨텍스트가 스택에서 제거된다.\\n5. 함수 `A`가 실행을 마치고 반환하면 `A`의 함수 실행 컨텍스트가 제거된다\\n6. 모든 코드가 실행되면 전역 실행 컨텍스트가 스택에서 제거된다.\\n\\n## Stack Oeverflow\\n\\n함수가 자기 자신을 계속해서 호출하는 재귀 호출 등에서 종료 조건이 없거나 잘못된 경우, 콜 스택에 실행 컨텍스트가 무한히 쌓이게 되어 스택 용량을 초과하면 \\\"Stack Overflow\\\"에러가 발생한다.\\n\",\"plainContent\":\"콜 스택은 함수 호출을 추적하기 위해 자비스크립트 엔진이 사용하는 LIFO(Last-in, First-out) 구조의 메모리 영역이다. 코드가 실행되면서 함수가 호출되면, 해당 함수의 실행 컨텍스트가 생성되어 콜 스택의 맨 위에 쌓인다(push). 함수 실행이 완료되어 값을 반환하면, 해당 실행 컨텍스트는 콜 스택에서 제거된다(pop). 콜 스택의 가장 위에 있는 실행 컨텍스트가 현재 리행중인 컨텍스트이다.\\n콜 스택은 자바스크립트의 동기적인 코드 실행 순서를 관리한다. 하나의 작업이 완료되어야 다음 작업이 스택에서 실행될 수있다. 이는 이벤트 루프와 비동기 처리 방식을 이해하는 데 필수적인 배경지식 이다.\\n1. 전역 코드가 실행되면 전역 실행 컨텍스트가 스택에 추가된다.\\n2. 함수 A가 호출되면 A의 함수 실행컨텍스트가 스택 위에 추가된다\\n3. 함수 A 내부에서 함수 B가 호출되면 B의 함수 실행컨텍스트가 스택 위에 추가된다.\\n4. 함수 B가 실행을마치고 반환하면 B의 함수 실행 컨텍스트가 스택에서 제거된다.\\n5. 함수 A가 실행을 마치고 반환하면 A의 함수 실행 컨텍스트가 제거된다\\n6. 모든 코드가 실행되면 전역 실행 컨텍스트가 스택에서 제거된다.\\n함수가 자기 자신을 계속해서 호출하는 재귀 호출 등에서 종료 조건이 없거나 잘못된 경우, 콜 스택에 실행 컨텍스트가 무한히 쌓이게 되어 스택 용량을 초과하면 \\\"Stack Overflow\\\"에러가 발생한다.\"},{\"urlPath\":\"자원/JavaScript/실행컨텍스트(Execution Context)\",\"title\":\"실행컨텍스트(Execution Context)\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-19 10:37:27\",\"modifiedAt\":\"2025-04-19 17:30:58\",\"publish\":\"자원/JavaScript\",\"content\":\"$1d\",\"plainContent\":\"$1e\"},{\"urlPath\":\"자원/JavaScript/클로저(Closure)란 무엇인가\",\"title\":\"클로저(Closure)란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-18 22:36:08\",\"modifiedAt\":\"2025-04-19 16:55:15\",\"publish\":\"자원/JavaScript\",\"content\":\"$1f\",\"plainContent\":\"$20\"},{\"urlPath\":\"자원/JavaScript/스코프(Scope)란 무엇인가\",\"title\":\"스코프(Scope)란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-18 21:55:13\",\"modifiedAt\":\"2025-04-19 09:24:31\",\"publish\":\"자원/JavaScript\",\"content\":\"$21\",\"plainContent\":\"$22\"},{\"urlPath\":\"자원/JavaScript/`==` 과 `===` 의 차이\",\"title\":\"`==` 과 `===` 의 차이\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-18 21:21:24\",\"modifiedAt\":\"2025-05-03 09:36:55\",\"publish\":\"자원/JavaScript\",\"content\":\"\\n# `==` 과 `===` 의 차이\\n\\n두 연산자 모두 값을 비교하지만, 비교 방식에 차이가 있다.\\n\\n예측 불가능한 타입 변환으로 인한 버그를 피하기 위해, 거의 항상 `===` (엄격 동등성 비교)를 사용하는 것이 좋다. `==`는 타입 변환 규칙을 정확히 이해하고 특별한 의도가 있을때만 제한적으로 사용해야 한다.\\n\\n동등성 비교는 조건문 등에서 매우 빈번하게 사용하게 되므로, 두 연산자의 차이를 명확히 이해하고 `===`를 일관되게 사용하는 것이 코드의 안정성과 예측 가능서을 높이는 데 중요하다.\\n\\n- `==` (추상 동등성 비교,Abstract Equality Comparison)\\n\\n  비교화기 전에 피연산자들의 타입을 강제로 변환(type coercion)하여 같은 타입으로 만든 후 값을 비교한다. 이 과정에서 예상치 못하 결과가 나올수 있다. 예를 들어, `0 == false`는 `true` 이고 `\\\"\\\" == false`도 `true`이며, `null == undefined`도 `true`이다.\\n\\n- `===` (엄격 동등성 비교, Strict Equality Comparison)\\n\\n  피연산자들의 타입 변환 없이 값과 타입을 모두 비교한다. 타입이 다르면 즉시 `false`를 반환한다. 예를 들어, `0 == false`는 `false`이고, `null === undefined`도 `false`이다.\\n\",\"plainContent\":\"두 연산자 모두 값을 비교하지만, 비교 방식에 차이가 있다.\\n예측 불가능한 타입 변환으로 인한 버그를 피하기 위해, 거의 항상 === (엄격 동등성 비교)를 사용하는 것이 좋다. ==는 타입 변환 규칙을 정확히 이해하고 특별한 의도가 있을때만 제한적으로 사용해야 한다.\\n동등성 비교는 조건문 등에서 매우 빈번하게 사용하게 되므로, 두 연산자의 차이를 명확히 이해하고 ===를 일관되게 사용하는 것이 코드의 안정성과 예측 가능서을 높이는 데 중요하다.\\n== (추상 동등성 비교,Abstract Equality Comparison)\\n비교화기 전에 피연산자들의 타입을 강제로 변환(type coercion)하여 같은 타입으로 만든 후 값을 비교한다. 이 과정에서 예상치 못하 결과가 나올수 있다. 예를 들어, 0 == false는 true 이고 \\\"\\\" == false도 true이며, null == undefined도 true이다.\\n=== (엄격 동등성 비교, Strict Equality Comparison)\\n피연산자들의 타입 변환 없이 값과 타입을 모두 비교한다. 타입이 다르면 즉시 false를 반환한다. 예를 들어, 0 == false는 false이고, null === undefined도 false이다.\"},{\"urlPath\":\"자원/웹개발/라이브러리vs프레임워크\",\"title\":\"라이브러리vs프레임워크\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"web\",\"resource\"],\"series\":\"\",\"createdAt\":\"2025-04-18 20:56:02\",\"modifiedAt\":\"2025-04-18 21:53:50\",\"publish\":\"자원/웹개발\",\"content\":\"$23\",\"plainContent\":\"라이브러리는 도구 상자와 같다.\\n개념: 특정 기능을 수행하는 코드 모음\\n사용 방식: 필요할 때만 꺼내서 사용함\\n주도권: 개발자가 주도권을 가짐(내가 필요할 때 사용)\\n프레임 워크는 집의 기초 구조와 같다.\\n개념: 애플리케이션 개발을 위한 뼈대, 구조\\n사용 방식: 프레임워크가 정한 틀 안에서 개발\\n주도권: 프레임워크가 주도권을 가짐 (프레임워크가 내 코드를 호출)\\n1. 제어 흐름(Control Flow)\\n라이브러리: 개발자가 코드의 흐름을 제어한다. 필요할 때 라이브러리를 호출하여 사용한다.\\n프레임워크: 프레임워크가 코드의 흐름을 제어한다. 프레임워크가 정한 규칙과 구조에 맞게 개발자가 코드를 작성한다.\\n2. 제어의 역전(Inversion of Control)\\n라이브러리: 제어의 역전이 없다. 개발자가 라이브러리를 호출한다.\\n프레임워크: 제어의 역전이 있다. 프레임워크가 개발자의 코드를 호출한다.\\n3. 유연성과 자유도\\n라이브러리: 높은 유연성과 자유도를 제공한다. 다양한 라이브러리를 조합하여 사용할 수 있다.\\n프레임워크: 제한된 유연성을 가지며, 프레임워크의 규칙을 따라야 한다.\\n4. 구조와 아키텍처\\n라이브러리: 특정 기능을 제공하는 코드 모음으로, 전체 애플리케이션 구조에 영향을 미치지 않는다.\\n프레임워크: 애플리케이션의 전체 구조와 아키텍처를 제공한다.\\n5. 사용 목적\\n라이브러리: 특정 문제 해결이나 기능 구현에 중점을 둔다.\\n프레임워크: 표준화된 개발 환경과 패턴을 제공한다.\\n6. 학습 곡선\\n라이브러리: 상대적으로 낮은 학습곡선을 가진다. 필요한 부분만 배워서 사용할 수 있다.\\n프레임워크: 높은 학습 곡선을 가진다. 프레임워크의 철학과 구조를 이해해야 한다.\\n7. 통합성\\n라이브러리: 독립적으로 작동하며, 필요에 따라 다른 라이브러리와 함께 사용할 수 있습니다.\\n프레임워크: 여러 라이브러리와 도구들을 포함하고 있으며, 일관된 환경을 제공한다.\"},{\"urlPath\":\"자원/JavaScript/null,undefined,undeclared 의 차이점은\",\"title\":\"null,undefined,undeclared 의 차이점은\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-18 14:59:03\",\"modifiedAt\":\"2025-04-18 15:14:42\",\"publish\":\"자원/JavaScript\",\"content\":\"\\n# null,undefined,undeclared 의 차이점은\\n\\n이 세가지 상태 전부 변수가 값을가지지 않거나 존재하지 않는 상황을 나타내지만, 의미와 발생 원인이 다르다.\\n\\n이 세가지 상태를 혼동하면 코드에서 예상치 못한 오류가 발생할 수 있다. 특히 API 응답이나 함수의 반환 값을 다룰 때 `null`과 `undefined`를 변확히 구분하고 처리하는 것이 중요하다.\\n\\n- `undefined`\\n  변수가 선언되었지만 아직 값이 할당되지 않은 상태를 의미한다. 또는 함수가 명시적으로 값을 반환하지 않을 때 반환되는 값이기도 하다. `typeof undefined`는 `\\\"undefined`이다.\\n\\n- `null`\\n  변수에 값이 없다는 것을 의도엊긍로 명시할 때 사용된다. 즉, 개발자가가 '빈 값'또는 '값이 없음'을 나타내기 위해 할당하는 값이다. `typeof null`은 역사적인 이유로 `\\\"object\\\"`를 반환하지만, 실제로는 원시 타입 중 하나이다.\\n\\n- `undeclared`(선언되지 않음)\\n  변수 자체가 아예 선언되지 않은 상태이다. 선언되지 않은 변수에 접근하려고 하면 `ReferenceError`가 발생한다.(단`typeof` 연사자는 선언되지 않은 변수에 사용해도 에러를 발생시키지 않고 `\\\"undefined\\\"`를 반환한다.) 비엄격 모두(non-strict mode)에서 선언 없이 값을 할당하면 예기치 않게 전역 변수가 생성될수 있으므로 피해야 한다.\\n\\n## 확인 방법\\n\\n- `undefined` 확인: `myVar === undefined` 또는 `typeof myVar === 'undefined'`\\n\\n- `null` 확인: `myVar === null`\\n\\n- `undeclared` 확인: `try...catch` 블록으로 감싸서 `ReferenceError`를 확인하건, `typeof` 사용 (단, `typeof`는 `undefined`와 구분 불가)\\n\",\"plainContent\":\"이 세가지 상태 전부 변수가 값을가지지 않거나 존재하지 않는 상황을 나타내지만, 의미와 발생 원인이 다르다.\\n이 세가지 상태를 혼동하면 코드에서 예상치 못한 오류가 발생할 수 있다. 특히 API 응답이나 함수의 반환 값을 다룰 때 null과 undefined를 변확히 구분하고 처리하는 것이 중요하다.\\nundefined\\n변수가 선언되었지만 아직 값이 할당되지 않은 상태를 의미한다. 또는 함수가 명시적으로 값을 반환하지 않을 때 반환되는 값이기도 하다. typeof undefined는 \\\"undefined이다.\\nnull\\n변수에 값이 없다는 것을 의도엊긍로 명시할 때 사용된다. 즉, 개발자가가 '빈 값'또는 '값이 없음'을 나타내기 위해 할당하는 값이다. typeof null은 역사적인 이유로 \\\"object\\\"를 반환하지만, 실제로는 원시 타입 중 하나이다.\\nundeclared(선언되지 않음)\\n변수 자체가 아예 선언되지 않은 상태이다. 선언되지 않은 변수에 접근하려고 하면 ReferenceError가 발생한다.(단typeof 연사자는 선언되지 않은 변수에 사용해도 에러를 발생시키지 않고 \\\"undefined\\\"를 반환한다.) 비엄격 모두(non-strict mode)에서 선언 없이 값을 할당하면 예기치 않게 전역 변수가 생성될수 있으므로 피해야 한다.\\nundefined 확인: myVar === undefined 또는 typeof myVar === 'undefined'\\nnull 확인: myVar === null\\nundeclared 확인: try...catch 블록으로 감싸서 ReferenceError를 확인하건, typeof 사용 (단, typeof는 undefined와 구분 불가)\"},{\"urlPath\":\"자원/JavaScript/데이터 타입과 불변성\",\"title\":\"데이터 타입과 불변성\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-17 16:02:18\",\"modifiedAt\":\"2025-04-18 15:00:11\",\"publish\":\"자원/JavaScript\",\"content\":\"$24\",\"plainContent\":\"$25\"},{\"urlPath\":\"자원/JavaScript/var,let,const의 주요 차이점은 무엇인가\",\"title\":\"var,let,const의 주요 차이점은 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-17 14:40:27\",\"modifiedAt\":\"2025-04-18 15:01:31\",\"publish\":\"자원/JavaScript\",\"content\":\"$26\",\"plainContent\":\"$27\"},{\"urlPath\":\"자원/JavaScript/호이스팅(Hoisting)이란 무엇인가\",\"title\":\"호이스팅(Hoisting)이란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-17 14:08:12\",\"modifiedAt\":\"2025-04-19 17:42:08\",\"publish\":\"자원/JavaScript\",\"content\":\"$28\",\"plainContent\":\"호이스팅은 자바스크립트 엔진이 코드를 실행하기 전에 변수, 함수, 클래스의 선언 부분을 해당 스코프의 최상단으로 끌어올리는 것처럼 동작하는 현상을 말한다.\\n엔진이 코드를 해석할 때 선언부를 먼저 처리하기 때문에 마치 끌어올려진 것처럼 보인다.\\nvar\\n변수 선언(var myVar;)이 스코프 최상단으로 끌어올려지고, 동시에 undefined로 초기화된다. 따라서 선언문 이전에 변수에 접근해도 에러가 발생하지 않고 undefined 값을 가진다.\\nlet,const\\n변수 선언이 스코프 최상단으로 끌어올려지지만, 초기화 되지는 않는다. 선언문 이전에 해당 변수에 접근하려고 하면 초기화되기 전까지 접근할 수 없다는 referenceError가 발생한다. 이 구간을 시간적 사각지대(Temporal Dead One, TDZ)라고 한다.\\n함수 선언식\\n함수 선언식(function myFunction(){})은 함수 전체가 호이스팅되어 선언 전에 호출할 수 있다. 함수 표현식(function myFunction(){})은 변수 호이스팅 규칙(여기서는 const)을 따른다.\\n\u003e [!tip]\\n\u003e\\n\u003e - var,let,const의 주요 차이점은 무엇인가]]\\n호이스팅은 특히var을 사용할 때 코드의 실행 순서와 변수 값 예측을 어렵게 만들 수 있다.let과 const의 도입 및 TDZ는 이러한 혼란을 줄이고 더 예측 가능한 코드를 작성하는 데 도움을 준다.\\n[[변수의 선언,초기화,할당의 차이점은 무엇인가\"},{\"urlPath\":\"자원/JavaScript/변수의 선언,초기화,할당의 차이점은 무엇인가\",\"title\":\"변수의 선언,초기화,할당의 차이점은 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-17 13:25:40\",\"modifiedAt\":\"2025-04-20 08:03:35\",\"publish\":\"자원/JavaScript\",\"content\":\"\\n# 변수의 선언,초기화,할당의 차이점은 무엇인가\\n\\n선언, 초기화, 할당 세 단계를 구분하는 것은 호이스팅과 시간적 사각지대(TDZ)같은 개념을 이해하는 데 기초가 된다. 변수가 어떻게 생성되고 언제 접근 가능한지를 정확히 아는것은 코드의 동작을 예측하고 오류를 피하는데에 중요하다.\\n\\n1. 선언(Declaration)\\n   **변수 이름을 자바스크립트 엔진에 등록**하는 단계이다. 이 단계에서 해당 스코프는 참조할 식별자를 알게 된다. 예를 들어 `let myVar;`은 `myVar`이라는 변수를 선언한다.\\n\\n2. 초기화(Initialization)\\n   **선언된 변수를 위해 메모리 공간을 확보하고, 기본값으로 `undefined`를 할당**하는 단계이다. `let`과 `const`는 선언 단계와 초기화 단계가 분리되어 있지만, `var`은 선언과 동시에 `undefined`로 초기화된다. 이 때문에 [[호이스팅(Hoisting)이란 무엇인가|호이스팅 작동시에 문제]]가 생긴다\\n\\n3. 할당(Assignment)\\n   `=`연산자를 사용하여 **변수에 실제 값을 저장**하는 단계이다. `undefined`로 초기화된 변수에 구체적인 값을 넣어주는 과정이다. 예를 들어 `myVar = 10;`은 `myVar`변수에 10이라는 값을 할당한다.\\n\",\"plainContent\":\"선언, 초기화, 할당 세 단계를 구분하는 것은 호이스팅과 시간적 사각지대(TDZ)같은 개념을 이해하는 데 기초가 된다. 변수가 어떻게 생성되고 언제 접근 가능한지를 정확히 아는것은 코드의 동작을 예측하고 오류를 피하는데에 중요하다.\\n1. 선언(Declaration)\\n변수 이름을 자바스크립트 엔진에 등록하는 단계이다. 이 단계에서 해당 스코프는 참조할 식별자를 알게 된다. 예를 들어 let myVar;은 myVar이라는 변수를 선언한다.\\n2. 초기화(Initialization)\\n선언된 변수를 위해 메모리 공간을 확보하고, 기본값으로 undefined를 할당하는 단계이다. let과 const는 선언 단계와 초기화 단계가 분리되어 있지만, var은 선언과 동시에 undefined로 초기화된다. 이 때문에 호이스팅 작동시에 문제가 생긴다\\n3. 할당(Assignment)\\n=연산자를 사용하여 변수에 실제 값을 저장하는 단계이다. undefined로 초기화된 변수에 구체적인 값을 넣어주는 과정이다. 예를 들어 myVar = 10;은 myVar변수에 10이라는 값을 할당한다.\"},{\"urlPath\":\"자원/웹개발/HTTP(Hypertext Transfer Protocol)\",\"title\":\"HTTP(Hypertext Transfer Protocol)\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-15 15:05:31\",\"modifiedAt\":\"2025-04-16 13:14:25\",\"publish\":\"자원/웹개발\",\"content\":\"$29\",\"plainContent\":\"$2a\"},{\"urlPath\":\"자원/웹개발/CSSOM(CSS Object Model)\",\"title\":\"CSSOM(CSS Object Model)\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-15 14:55:32\",\"modifiedAt\":\"2025-04-16 12:49:54\",\"publish\":\"자원/웹개발\",\"content\":\"\\n# CSSOM(CSS Object Model)\\n\\nCSSOM(CSS Object Model)은 웹 브라우저가 CSS를 처리하는 방식을 나타내는 API이다. [[DOM(Document Object Model)]]이 HTML문서의 구조를 표현한다면, CSSOM은 CSS 스타일 규칙을 표현한다.\\n\\n웹페이작 로드될 때 브라우저는 HTML을 파싱하여 DOM을 구성하고, CSS를 파싱하여 CSSOM을 구성한다. 이 두 모델이 결합되어 랜더 트리가 생성되고, 이를 기반으로 브라우저는 화면에 콘텐츠를 그린다.\\n\\nCSSOM은 웹 페이지의 성틍에도 영향을 미치는데, 복잡한 CSS 선택자나 많은 스타일 규칙은 CSSOM 구성 시간을 증가시켜 페이지 렌더링을 지연시킬 수 있다.\\n\\n## CSSOM의 주요 특징\\n\\n1. 스타일 계산: 각 DOM 노드에 적용될 최종 스타일을 계산한다.\\n2. 상속과 계단식: CSS의 상속 및 우선순위 규칙이 적용된다.\\n3. 성능 영향: 복잡한 CSS 선택자는 CSSOM 생성 시간을 늘릴 수 있다.\\n\\n## CSSOM의 작동 방식\\n\\n1. CSS파싱: 브라우저가 CSS파일과 인라인 스타일을 사이한다.\\n2. 규칙 매칭: 각 CSS 규칙을 해당하는 DOM 요소에 매핑한다.\\n3. 계산된 스타일: 상속, 캐스케이딩(우선순위)을 고려해 최종 스타일을 계산한다.\\n\\n## CSSOM 조작 예시\\n\\n```js\\n// 인라인 스타일 변경\\nelement.style.color = \\\"red\\\";\\n\\n// 계산된 스타일 가져오기\\nconst computedStyle = window.getComputedStyle(element);\\nconsole.log(computedStyle.fontSize);\\n\\n// 스타일시트 조작\\ndocument.styleSheets[0].insertRule(\\\"body { background-color: lightblue; }\\\", 0);\\n```\\n\",\"plainContent\":\"CSSOM(CSS Object Model)은 웹 브라우저가 CSS를 처리하는 방식을 나타내는 API이다. DOM(Document Object Model)이 HTML문서의 구조를 표현한다면, CSSOM은 CSS 스타일 규칙을 표현한다.\\n웹페이작 로드될 때 브라우저는 HTML을 파싱하여 DOM을 구성하고, CSS를 파싱하여 CSSOM을 구성한다. 이 두 모델이 결합되어 랜더 트리가 생성되고, 이를 기반으로 브라우저는 화면에 콘텐츠를 그린다.\\nCSSOM은 웹 페이지의 성틍에도 영향을 미치는데, 복잡한 CSS 선택자나 많은 스타일 규칙은 CSSOM 구성 시간을 증가시켜 페이지 렌더링을 지연시킬 수 있다.\\n1. 스타일 계산: 각 DOM 노드에 적용될 최종 스타일을 계산한다.\\n2. 상속과 계단식: CSS의 상속 및 우선순위 규칙이 적용된다.\\n3. 성능 영향: 복잡한 CSS 선택자는 CSSOM 생성 시간을 늘릴 수 있다.\\n1. CSS파싱: 브라우저가 CSS파일과 인라인 스타일을 사이한다.\\n2. 규칙 매칭: 각 CSS 규칙을 해당하는 DOM 요소에 매핑한다.\\n3. 계산된 스타일: 상속, 캐스케이딩(우선순위)을 고려해 최종 스타일을 계산한다.\"},{\"urlPath\":\"자원/웹개발/DOM(Document Object Model)\",\"title\":\"DOM(Document Object Model)\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-14 18:08:07\",\"modifiedAt\":\"2025-04-16 12:47:05\",\"publish\":\"자원/웹개발\",\"content\":\"$2b\",\"plainContent\":\"DOM(Document Object Model)이란 HTML,XML 같은 마크업 문서를 위한 프로그래밍 인터페이스 이다.\\nDOM은 문서를 노드와 객체로 표현해 웹 페이지의 구조화된 표현을 제공한다.\\nDOM은 개발자가 Javascript를 통해 웹 페이지의 콘텐츠, 구조, 스타일을 동적으로 변경할 수 있게 해 준다. 이를 통해 사용자와 상호작용하는 웹 애플리케이션을 구축할 수 있다.\\n트리구조: 문서는 부모-자식 관계를 가진 노드들의 트리로 표현된다.\\n노드: HTML요소, 속성 텍스트등 모든 것이 노드이다.\\n조작기능: Javascript를 사용해 DOM 노드를 추가, 수정, 삭제할 수 있다.\\n이벤트 처리: 사용자 상호작용(클릭, 입력 등)에 반응하는 이벤트를 처리한다.\\nDocument: DOM 트리의 루트 노드\\nElement: HTML 태그에 해당하는 노드(div, p, span 등)\\nAttribute: 요소의 속성(id, class, href 등)\\nText: 텍스트 내용을 담고 있는 노드\\n\u003e [!info] window 오브젝트\\n\u003e window 객체는 브라우저에서 Javascript의 전역 객체이다. 브라우저 환경에서의 모든 Javascript코드가 실행되는 기본적인 컨테이너 이다.\\ndocument: DOM에 접근할 수 있는 객체\\nlocation: 현재 URL 정보와 탐색 기능\\nhistory: 브라우저 방문 기록 관리\\nnavigator: 브라우저 정보\\nscreen: 사용자 화면 정보\\nlocalStorage,sessionStorage:클라이언트 측 데이터 저장소\"},{\"urlPath\":\"자원/웹개발/웹사이트에 들어갈때에는 어떤 일이 생기는가-웹사이트접속의 과정\",\"title\":\"웹사이트에 들어갈때에는 어떤 일이 생기는가-웹사이트접속의 과정\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-14 16:19:40\",\"modifiedAt\":\"2025-04-16 08:30:03\",\"publish\":\"자원/웹개발\",\"content\":\"\\n# 웹사이트에 들어갈때에는 어떤 일이 생기는가-웹사이트접속의 과정\\n\\n브라우저에 웹사이트가 화면에 나타나기 까지엔 다음과 같은 과정이 필요하다\\n\\n1. URL 입력\\n   사용자가 링크를 클릭하거나 주소창에 웹 주소를 입력한다.\\n\\n2. DNS(Domain Name System) 조회\\n   입력받은 도메인 이름을 IP 주소로 변환합니다.이때 DNS 캐시를 먼저 확인해 보고 없다면 DNS서버에 요청하여 IP를 받아온다.\\n\\n3. 서버 연결\\n   찾은 IP주소를 통해 서버에 TCP/IP 연결을 설정한다.\\n\\n4. [[HTTP-Methods|HTTP 요청]]\\n   브라우저가 서버에 웹사이트 데이터를 요청한다.\\n\\n5. 서버 응답\\n   서버는 HTML,CSS,Javascript등의 파일을 브라우저에 전송한다.\\n\\n6. 렌더링 과정\\n   HTML 과 CSS 를 파싱하여 각각 DOM tree 와 CSSOM tree 만들고 둘을 합쳐 렌더 트리를 생성한다. 이후 Javascript를 처리한다. 이후 파싱한 DOM 과 CSSOM 을 쳐 Render tree를 만들고 레이아웃 과정을 통해 뷰포트에 표시될 각 요소들의 크기와 위치를 계산하고 페인트 단계를 거쳐 렌더트리의 각 노드를 화면에 그리고 마지막 컴포지팅 단계에서 여러 레이어로 나뉜 페이지의 요소들을 합성하여 최종 화면을 만든다.\\n\\n- 참고:[[웹사이트는 어떻게 보여지는가-브라우저의 렌더링]]\\n\",\"plainContent\":\"브라우저에 웹사이트가 화면에 나타나기 까지엔 다음과 같은 과정이 필요하다\\n1. URL 입력\\n사용자가 링크를 클릭하거나 주소창에 웹 주소를 입력한다.\\n2. DNS(Domain Name System) 조회\\n입력받은 도메인 이름을 IP 주소로 변환합니다.이때 DNS 캐시를 먼저 확인해 보고 없다면 DNS서버에 요청하여 IP를 받아온다.\\n3. 서버 연결\\n찾은 IP주소를 통해 서버에 TCP/IP 연결을 설정한다.\\n4. HTTP 요청\\n브라우저가 서버에 웹사이트 데이터를 요청한다.\\n5. 서버 응답\\n서버는 HTML,CSS,Javascript등의 파일을 브라우저에 전송한다.\\n6. 렌더링 과정\\nHTML 과 CSS 를 파싱하여 각각 DOM tree 와 CSSOM tree 만들고 둘을 합쳐 렌더 트리를 생성한다. 이후 Javascript를 처리한다. 이후 파싱한 DOM 과 CSSOM 을 쳐 Render tree를 만들고 레이아웃 과정을 통해 뷰포트에 표시될 각 요소들의 크기와 위치를 계산하고 페인트 단계를 거쳐 렌더트리의 각 노드를 화면에 그리고 마지막 컴포지팅 단계에서 여러 레이어로 나뉜 페이지의 요소들을 합성하여 최종 화면을 만든다.\\n참고:웹사이트는 어떻게 보여지는가-브라우저의 렌더링\"},{\"urlPath\":\"자원/웹개발/웹사이트는 어떻게 보여지는가-브라우저의 렌더링\",\"title\":\"웹사이트는 어떻게 보여지는가-브라우저의 렌더링\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-14 14:30:49\",\"modifiedAt\":\"2025-04-16 09:36:05\",\"publish\":\"자원/웹개발\",\"content\":\"$2c\",\"plainContent\":\"웹사이트는 사용자의 요청에 따라 웹사이트를 구성하는 Javascript를 통해 조작이 가능해 진다.\"},{\"urlPath\":\"자원/웹개발/Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념\",\"title\":\"Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-14 09:46:13\",\"modifiedAt\":\"2025-04-16 19:08:41\",\"publish\":\"자원/웹개발\",\"content\":\"$2d\",\"plainContent\":\"$2e\"},{\"urlPath\":\"자원/웹개발/웹사이트는 어떻게 구성되어있나-HTML과 CSS와 Javascript의 이해\",\"title\":\"웹사이트는 어떻게 구성되어있나-HTML과 CSS와 Javascript의 이해\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-04-14 09:18:21\",\"modifiedAt\":\"2025-04-16 08:29:36\",\"publish\":\"자원/웹개발\",\"content\":\"\\n# 웹사이트는 어떻게 구성되어있나-HTML과 CSS와 Javascript의 이해\\n\\n웹 사이트가 브라우저 상에서 우리의 눈으로 보여지기 위해서는 *우리가 원하는 모습을 브라우저에게 인식*시켜야 한다.\\n이 문서의 구조와 형태를 브라우저에게 이해시키는 언어가 바로 _[[HTML]]_ 과 *[[CSS]]*이다.\\n\\nHTML 의 경우 문서가 어떤 *구조*로 구성되어 있는지 브라우저에게 이해시키는 역할을 하고 CSS의 경우 이 문서가 _어떻게 생겼고 구조가 어떤식으로 보여져야 하는지_ 브라우저에게 알려주는 역할을 한다.\\n\\n보통 위키피디아나 간단한 뉴스 혹은 블로그 처럼 웹사이트와 상호작용이 필요 없는 사이트의 경우 이 [[HTML]]과 [[CSS]] 만으로 충분 하지만 상호작용을 통해 문서가 조작되어야 한다면 [[Javascript]]를 활용하여야 한다.\\n\\n\u003e [!info] Interactive 한 웹사이트\\n\u003e 상호작용이 가능하다는 것의 의미는 사용자의 입력에 반응하거나 페이지를 업데이트 하지 않고 콘텐츠를 업데이트 하거나 실시간으로 데이터를 처리하는 등의 문서가 Javascript에 의해 조작되는 웹사이트를 말한다.\\n\\n## 궁금한점\\n\\n- [[웹사이트는 어떻게 보여지는가-브라우저의 렌더링]]\\n- [[Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념]]\\n\",\"plainContent\":\"웹 사이트가 브라우저 상에서 우리의 눈으로 보여지기 위해서는 우리가 원하는 모습을 브라우저에게 인식시켜야 한다.\\n이 문서의 구조와 형태를 브라우저에게 이해시키는 언어가 바로 _HTML]]_ 과 [[CSS]]이다.\\nHTML 의 경우 문서가 어떤 구조로 구성되어 있는지 브라우저에게 이해시키는 역할을 하고 CSS의 경우 이 문서가 _어떻게 생겼고 구조가 어떤식으로 보여져야 하는지_ 브라우저에게 알려주는 역할을 한다.\\n보통 위키피디아나 간단한 뉴스 혹은 블로그 처럼 웹사이트와 상호작용이 필요 없는 사이트의 경우 이 [[HTML]]과 [[CSS]] 만으로 충분 하지만 상호작용을 통해 문서가 조작되어야 한다면 [[Javascript]]를 활용하여야 한다.\\n\u003e [!info] Interactive 한 웹사이트\\n\u003e 상호작용이 가능하다는 것의 의미는 사용자의 입력에 반응하거나 페이지를 업데이트 하지 않고 콘텐츠를 업데이트 하거나 실시간으로 데이터를 처리하는 등의 문서가 Javascript에 의해 조작되는 웹사이트를 말한다.\\n[[웹사이트는 어떻게 보여지는가-브라우저의 렌더링]]\\n[[Javascript가 웹사이트를 어떻게 조작할 수 있는가-DOM과 CSSOM의 개념\"},{\"urlPath\":\"자원/JavaScript/Javascript\",\"title\":\"Javascript\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\",\"javascript\"],\"series\":\"\",\"createdAt\":\"2025-04-12 09:09:33\",\"modifiedAt\":\"2025-04-20 09:23:09\",\"publish\":\"자원/JavaScript\",\"content\":\"\\n# Javascript\\n\\n![1745108580-javascript.png](_assets/attachments/1745108580-javascript.png)\\n\\n웹사이트에서 [[HTML]]과 [[CSS]]가 각각 내용의 구조를 정하고 그 내용이 어떤 모습으로 표현되어야 하는지 브라우져에게 설명하는 언어라면 Javascript 는 웹사이트와 사용자가 상호작용을 할 수 있도록 하는 언어이다.\\n\\n## 관련 노트\\n\\n- [[변수의 선언,초기화,할당의 차이점은 무엇인가]]\\n- [[var,let,const의 주요 차이점은 무엇인가]]\\n- [[호이스팅(Hoisting)이란 무엇인가]]\\n- [[데이터 타입과 불변성]]\\n- [[null,undefined,undeclared 의 차이점은]]\\n- [[`==` 과 `===` 의 차이]]\\n- [[스코프(Scope)란 무엇인가]]\\n- [[실행컨텍스트(Execution Context)]]\\n- [[콜 스택(Call Stack)이란 무엇인가]]\\n- [[클로저(Closure)란 무엇인가]]\\n- [[`this`키워드`]]\\n- [[프로토타입(Prototype)과 프로토타입 상속]]\\n- [[Javascript는 어떻게 비동기 처리가 가능한 것인가]]\\n- [[Javascript에서의 비동기 함수]]\\n\",\"plainContent\":\"웹사이트에서 HTML]]과 [[CSS]]가 각각 내용의 구조를 정하고 그 내용이 어떤 모습으로 표현되어야 하는지 브라우져에게 설명하는 언어라면 Javascript 는 웹사이트와 사용자가 상호작용을 할 수 있도록 하는 언어이다.\\n[[변수의 선언,초기화,할당의 차이점은 무엇인가]]\\n[[var,let,const의 주요 차이점은 무엇인가]]\\n[[호이스팅(Hoisting)이란 무엇인가]]\\n[[데이터 타입과 불변성]]\\n[[null,undefined,undeclared 의 차이점은]]\\n[[== 과 === 의 차이]]\\n[[스코프(Scope)란 무엇인가]]\\n[[실행컨텍스트(Execution Context)]]\\n[[콜 스택(Call Stack)이란 무엇인가]]\\n[[클로저(Closure)란 무엇인가]]\\n[[this키워드`]]\\n[[프로토타입(Prototype)과 프로토타입 상속]]\\n[[Javascript는 어떻게 비동기 처리가 가능한 것인가]]\\n[[Javascript에서의 비동기 함수\"},{\"urlPath\":\"자원/React/React\",\"title\":\"React\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"react\"],\"series\":\"\",\"createdAt\":\"2025-04-11 18:37:48\",\"modifiedAt\":\"2025-04-24 18:26:29\",\"publish\":\"자원/React\",\"content\":\"$2f\",\"plainContent\":\"$30\"},{\"urlPath\":\"프로젝트/아임유어박스 웹사이트/물류 서비스 웹사이트 개발 회고-혼자서 외주 프로젝트 완성하기\",\"title\":\"물류 서비스 웹사이트 개발 회고-혼자서 외주 프로젝트 완성하기\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"project\",\"회고\",\"portfolio\"],\"series\":\"\",\"createdAt\":\"2025-03-25 16:46:50\",\"modifiedAt\":\"2025-03-27 16:52:58\",\"publish\":\"프로젝트/아임유어박스 웹사이트\",\"content\":\"$31\",\"plainContent\":\"$32\"},{\"urlPath\":\"자원/크롬 확장프로그램/크롬 확장프로그램에 케시메모리 추가하기\",\"title\":\"크롬 확장프로그램에 케시메모리 추가하기\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"chrome-extension\",\"example\",\"problem\"],\"series\":\"\",\"createdAt\":\"2025-03-23 09:21:24\",\"modifiedAt\":\"2025-03-31 19:48:24\",\"publish\":\"자원/크롬 확장프로그램\",\"content\":\"$33\",\"plainContent\":\"$34\"},{\"urlPath\":\"자원/SWEA 강의 정리노트/SWEA 강의 정리노트\",\"title\":\"SWEA 강의 정리노트\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"study\",\"algorithm\"],\"series\":\"\",\"createdAt\":\"2025-03-19 12:20:41\",\"modifiedAt\":\"2025-03-20 16:17:34\",\"publish\":\"자원/SWEA 강의 정리노트\",\"content\":\"\\n# SWEA 강의 정리노트\\n\\n- [강의 주소](https://swexpertacademy.com/main/learn/course/subjectList.do?courseId=AVuPCwCKAAPw5UW6)\\n\\n## 강의 노트\\n\\n### Computaional Thinking\\n\\n- [[프로그래밍과 논리수학]]\\n\",\"plainContent\":\"강의 주소\\n프로그래밍과 논리수학\"},{\"urlPath\":\"프로젝트/알고리즘/취업을 위한 알고리즘 공부\",\"title\":\"취업을 위한 알고리즘 공부\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"project\",\"study\",\"algorithm\"],\"series\":\"취업을 위해 알고리즘 공부하기\",\"createdAt\":\"2025-03-19 08:05:06\",\"modifiedAt\":\"2025-03-20 16:16:00\",\"publish\":\"프로젝트/알고리즘\",\"content\":\"$35\",\"plainContent\":\"$36\"},{\"urlPath\":\"자원/ai/Aider\",\"title\":\"Aider\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"ai\",\"tool\",\"aider\",\"quickstart\"],\"series\":\"\",\"createdAt\":\"2025-03-10 08:21:08\",\"modifiedAt\":\"2025-03-20 16:17:15\",\"publish\":\"자원/ai\",\"content\":\"\\n# Aider\\n\\n공식 홈페이지:[Home | Aider](https://aider.chat/)\\n\\n\u003e [!quote]\\n\u003e Aider lets you pair program with LLMs, to edit code in your local git repository. Start a new project or work with an existing code base.\\n\\nAider 는 터미널을 통해 AI 와 [Pair Programming](https://namu.wiki/w/%ED%8E%98%EC%96%B4%20%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%98%EB%B0%8D)을 할 수 있도록 해주는 툴이다.\\n\\n비슷 한 툴로는 Cursor, Claude, Windsurf 등이 있다.\\n\\n## QuickStart\\n\",\"plainContent\":\"공식 홈페이지:Home | Aider\\n\u003e [!quote]\\n\u003e Aider lets you pair program with LLMs, to edit code in your local git repository. Start a new project or work with an existing code base.\\nAider 는 터미널을 통해 AI 와 Pair Programming을 할 수 있도록 해주는 툴이다.\\n비슷 한 툴로는 Cursor, Claude, Windsurf 등이 있다.\"},{\"urlPath\":\"자원/웹개발/동적 사이트 vs 정적사이트\",\"title\":\"동적 사이트 vs 정적사이트\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"resource\",\"web\"],\"series\":\"\",\"createdAt\":\"2025-03-10 07:39:08\",\"modifiedAt\":\"2025-04-16 08:52:13\",\"publish\":\"자원/웹개발\",\"content\":\"\\n# 동적 사이트 vs 정적사이트\\n\\n복잡하게 생각하지 말고 단순하게 동적 사이트와 정적 사이트를 구분한다면 페이지의 렌더링 (**화면 렌더링 아님**) 시기 이다.\\n\\n정적 사이트는 HTML이 빌드 타임에 미리 생성되고 수정되지 않는다.\\n하지만 동적 사이트의 경우 클라이언트 측이든 서버 측이든 요청에 따라 HTML 이 생성되게 된다.\\n\\n\u003e [!caution] 화면 렌더링(브라우저의 렌더링) 과 페이지 렌더링의 차이\\n\u003e 동적 사이트와 정적사이트에서 표현하는 렌더링은 HTML에 대한 렌더링 이다. 즉 코드를 HTML 로 변환하는 과정을 말한다.\\n\u003e 화면에 대한 렌더링은 이 완성된 HTML 과 CSS 를 웹브라우져가 화면에 그려 표현해주는것을 뜻한다.\\n\u003e 참고: [[웹사이트는 어떻게 보여지는가-브라우저의 렌더링]]\\n\\n## CSR,SSR,SSG\\n\\nCSR(Client Side Rendering) 과 SSR(Server Side Rendering) 의 경우 동적 사이트로 분류될 수 있다. 왜냐하면 HTML 의 렌더링 시기 때문이다.\\nSSR의 경우 요청에 따라 Javascript 가 담겨있는 HTML을 받아와 해당 javascript 코드를 실행하여 직접 HTML을 생성하여 렌더링 하게 된다. SSR의 경우 요청에 따라 서버 측에서 HTML 을 생성하여 클라이언트로 전송한다.\\n\\nCSR과 SSR둘 다 요청 이후에 필요에 따라 HTML이 새로 만들어지며 이 때문에 **동적 사이트** 방식으로 분류될 수 있다.\\n\\nSSG의 경우 HTML 을 빌드 타임에 미리 생성하게 되기 때문에 **정적 사이트**로 분류될 수 있다.\\n\\n참고: [[CSR vs SSR vs SSG]]\\n\",\"plainContent\":\"복잡하게 생각하지 말고 단순하게 동적 사이트와 정적 사이트를 구분한다면 페이지의 렌더링 (화면 렌더링 아님) 시기 이다.\\n정적 사이트는 HTML이 빌드 타임에 미리 생성되고 수정되지 않는다.\\n하지만 동적 사이트의 경우 클라이언트 측이든 서버 측이든 요청에 따라 HTML 이 생성되게 된다.\\n\u003e [!caution] 화면 렌더링(브라우저의 렌더링) 과 페이지 렌더링의 차이\\n\u003e 동적 사이트와 정적사이트에서 표현하는 렌더링은 HTML에 대한 렌더링 이다. 즉 코드를 HTML 로 변환하는 과정을 말한다.\\n\u003e 화면에 대한 렌더링은 이 완성된 HTML 과 CSS 를 웹브라우져가 화면에 그려 표현해주는것을 뜻한다.\\n\u003e 참고: 웹사이트는 어떻게 보여지는가-브라우저의 렌더링]]\\nCSR(Client Side Rendering) 과 SSR(Server Side Rendering) 의 경우 동적 사이트로 분류될 수 있다. 왜냐하면 HTML 의 렌더링 시기 때문이다.\\nSSR의 경우 요청에 따라 Javascript 가 담겨있는 HTML을 받아와 해당 javascript 코드를 실행하여 직접 HTML을 생성하여 렌더링 하게 된다. SSR의 경우 요청에 따라 서버 측에서 HTML 을 생성하여 클라이언트로 전송한다.\\nCSR과 SSR둘 다 요청 이후에 필요에 따라 HTML이 새로 만들어지며 이 때문에 동적 사이트 방식으로 분류될 수 있다.\\nSSG의 경우 HTML 을 빌드 타임에 미리 생성하게 되기 때문에 정적 사이트로 분류될 수 있다.\\n참고: [[CSR vs SSR vs SSG\"},{\"urlPath\":\"프로젝트/블로그/어떻게 블로그를 구현하였나\",\"title\":\"어떻게 블로그를 구현하였나\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"blog\",\"dev\",\"project\"],\"series\":\"나의 맞춤 블로그 만들기\",\"createdAt\":\"2025-03-08 17:12:17\",\"modifiedAt\":\"2025-03-20 16:16:24\",\"publish\":\"프로젝트/블로그\",\"content\":\"$37\",\"plainContent\":\"$38\"},{\"urlPath\":\"프로젝트/블로그/개인 블로그를 제작하게 된 이유\",\"title\":\"개인 블로그를 제작하게 된 이유\",\"summary\":\"\",\"image\":\"\",\"tags\":[\"blog\",\"dev\",\"project\"],\"series\":\"나의 맞춤 블로그 만들기\",\"createdAt\":\"2025-03-08 17:09:39\",\"modifiedAt\":\"2025-03-20 16:17:00\",\"publish\":\"프로젝트/블로그\",\"content\":\"$39\",\"plainContent\":\"$3a\"}],\"postsMetadata\":[{\"urlPath\":\"자원/React/리엑트 함수형 컴포넌트의 생명주기\",\"title\":\"리엑트 함수형 컴포넌트의 생명주기\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:0:tags\",\"series\":\"\",\"createdAt\":\"2025-04-24 08:34:02\",\"modifiedAt\":\"2025-04-24 08:44:05\",\"publish\":\"자원/React\"},{\"urlPath\":\"자원/React/가상DOM의 원리\",\"title\":\"가상DOM의 원리\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:1:tags\",\"series\":\"\",\"createdAt\":\"2025-04-21 18:45:51\",\"modifiedAt\":\"2025-04-23 14:15:23\",\"publish\":\"자원/React\"},{\"urlPath\":\"자원/React/Props Drilling 이란 무엇인가\",\"title\":\"Props Drilling 이란 무엇인가\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:2:tags\",\"series\":\"\",\"createdAt\":\"2025-04-20 10:03:21\",\"modifiedAt\":\"2025-04-21 07:40:48\",\"publish\":\"자원/React\"},{\"urlPath\":\"자원/React/자식컴포넌트에서 부모컴포넌트로 데이터 전달하기\",\"title\":\"자식컴포넌트에서 부모컴포넌트로 데이터 전달하기\",\"summary\":\"\",\"image\":\"\",\"tags\":\"$2:props:children:props:children:props:children:props:posts:3:tags\",\"series\":\"\",\"createdAt\":\"2025-04-20 10:02:37\",\"modifiedAt\":\"2025-04-21 18:45:45\
